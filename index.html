<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E14">
<!-- Safari en iOS cachea el HTML con ganas: sin esto, despues de subir una version nueva
     el celular sigue corriendo la vieja por horas. Ver APP_VER mas abajo. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gym Bro</title>
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%232BE08A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%230E0E14'/%3E%3Cg fill='url(%23g)'%3E%3Crect x='3' y='13' width='3' height='6' rx='1.3'/%3E%3Crect x='6.5' y='10' width='4' height='12' rx='1.6'/%3E%3Crect x='10.5' y='14.4' width='11' height='3.2' rx='1.4'/%3E%3Crect x='21.5' y='10' width='4' height='12' rx='1.6'/%3E%3Crect x='26' y='13' width='3' height='6' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<!-- iOS SOLO acepta PNG en apple-touch-icon. Con un SVG data URI lo ignora y
     dibuja la inicial del titulo sobre fondo negro. -->
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@300;400;500;600;700&family=Asap+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0E0E14; --surface:#16161F; --surface2:#1D1D28; --surface3:#24242F;
  --border:#2A2A38; --hairline:#22222E;
  --text:#ECECF2; --muted:#8A8A9C; --dim:#5E5E70;
  --violet:#7C5CFF; --violet-2:#9D85FF; --violet-lt:rgba(124,92,255,.14);
  --green:#2BE08A; --green-2:#5BEDA8; --green-lt:rgba(43,224,138,.13);
  --cyan:#3BE0D0; --cyan-2:#6BEBDE; --cyan-lt:rgba(59,224,208,.13);
  --red:#FF4D5E; --red-lt:rgba(255,77,94,.13);
  --r-sm:8px; --r:12px; --r-lg:16px;
  /* Zona que tapan la Dynamic Island y la barra de gestos cuando la app corre
     en modo standalone (agregada a la pantalla de inicio). En Safari normal dan 0. */
  --safe-top:env(safe-area-inset-top, 0px);
  --safe-bot:env(safe-area-inset-bottom, 0px);
  --safe-l:env(safe-area-inset-left, 0px);
  --safe-r:env(safe-area-inset-right, 0px);
  /* Aire extra bajo la isla SOLO en standalone. Con el safe-area justo el logo
     queda a 13px de la Dynamic Island y se lee como cortado. */
  --hdr-extra:0px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Asap',system-ui,sans-serif}
body{min-height:100vh;font-size:15px;line-height:1.45;padding-bottom:calc(40px + var(--safe-bot))}
.kick{font-family:'Asap Condensed','Asap',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;z-index:900;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.lg-mark{width:78px;height:78px;border-radius:22px;margin-bottom:26px;
  background:linear-gradient(135deg,var(--violet),var(--green));
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(124,92,255,.35)}
.lg-mark svg{width:46px;height:46px;fill:#0E0E14}
.lg-t{font-size:2rem;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}
.lg-s{color:var(--muted);font-size:.95rem;max-width:300px;margin-bottom:32px}
.btn-g{display:flex;align-items:center;gap:11px;background:#fff;color:#1a1a1a;font-weight:600;
  font-size:.95rem;padding:13px 26px;border-radius:11px;transition:transform .15s,box-shadow .15s}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn-g svg{width:19px;height:19px}

#loader{position:fixed;inset:0;z-index:950;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--violet);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- SHELL ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:300;background:rgba(14,14,20,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:calc(11px + var(--hdr-extra) + var(--safe-top)) calc(16px + var(--safe-r)) 11px calc(16px + var(--safe-l));
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.h-l{display:flex;align-items:center;gap:11px;min-width:0}
.h-mark{width:33px;height:33px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--violet),var(--green));
  display:flex;align-items:center;justify-content:center}
.h-mark svg{width:21px;height:21px;fill:#0E0E14}
.h-t{font-size:1.05rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.h-d{font-size:.66rem;color:var(--dim);font-family:'Asap Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.1em}
.h-r{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;transition:.15s}
.ibtn:hover{border-color:var(--violet);color:var(--violet-2)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

#offline{background:var(--red-lt);border-bottom:1px solid rgba(255,77,94,.3);
  padding:11px calc(16px + var(--safe-r)) 11px calc(16px + var(--safe-l));display:flex;align-items:center;gap:11px}
#offline.hide{display:none}
#offline svg{flex:0 0 auto;width:18px;height:18px;stroke:var(--red);stroke-width:2;fill:none}
#offline p{font-size:.82rem;color:#FFA8B1;flex:1;line-height:1.35}
#offline b{color:var(--red)}
#offline button{flex:0 0 auto;background:var(--red);color:#fff;border-radius:9px;
  padding:9px 15px;font-size:.8rem;font-weight:700;min-height:38px;
  font-family:'Asap Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase}
nav.tabs{position:sticky;top:calc(57px + var(--hdr-extra) + var(--safe-top));z-index:290;background:var(--bg);
  border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:76px;padding:13px 10px 11px;font-family:'Asap Condensed',sans-serif;
  font-size:.76rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--muted)}
.tab.on{color:var(--violet-2);border-bottom-color:var(--violet)}

main{padding:20px calc(16px + var(--safe-r)) 30px calc(16px + var(--safe-l));max-width:940px;margin:0 auto}
.panel{display:none;animation:pin .3s ease}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ptitle{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;margin-bottom:3px}
.psub{font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec .bar{width:3px;height:16px;border-radius:2px;background:var(--violet)}
.sec h3{font-size:1rem;font-weight:700;letter-spacing:-.02em}
.sec .cnt{margin-left:auto;font-family:'Asap Condensed',sans-serif;font-size:.7rem;
  letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* ---------- INPUTS ---------- */
/* 16px NO es capricho: iOS Safari hace auto-zoom al enfocar un input con letra mas
   chica, y despues hay que achicar la pantalla con los dedos a mano. Es el minimo
   que evita ese zoom. No usar user-scalable=no para taparlo: rompe el zoom manual. */
input[type=date],input[type=time],input[type=number],input[type=text],textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  font-size:16px;color:var(--text);outline:none;transition:.15s;width:100%}
/* 44px: alto minimo comodo para el dedo, y deja todos los campos parejos entre si */
input[type=number],input[type=text]{min-height:44px}
input:focus,textarea:focus{border-color:var(--violet);background:var(--surface3)}

/* iOS Safari renderiza date y time con su propio widget: fondo gris, texto centrado y
   altura distinta al resto. appearance:none lo desactiva y el pseudo-elemento
   ::-webkit-date-and-time-value alinea el texto a la izquierda como en los demas campos. */
input[type=date],input[type=time]{
  -webkit-appearance:none;appearance:none;
  color-scheme:dark;min-height:44px;line-height:1.2;
  font-family:inherit;font-size:16px;font-weight:500;
  display:flex;align-items:center;text-align:left}
input[type=date]::-webkit-date-and-time-value,
input[type=time]::-webkit-date-and-time-value{
  text-align:left;margin:0;min-height:1.2em}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{
  filter:invert(.65);opacity:.7;cursor:pointer;margin-left:auto}
input[type=date]::-webkit-inner-spin-button,
input[type=time]::-webkit-inner-spin-button{display:none;-webkit-appearance:none}
/* en la fila de fecha de Entrenar el campo no ocupa todo el ancho */
.daterow input[type=date]{width:auto;min-width:158px}
.daterow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- EJERCICIO ---------- */
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;transition:.18s}
.ex.done{border-color:rgba(43,224,138,.4);background:linear-gradient(90deg,var(--green-lt),transparent 55%)}
/* --- tarjeta de ejercicio: colapsada por defecto --- */
.ex-head{display:flex;align-items:center;gap:11px;padding:2px 0}
.ex-ttl{flex:1;min-width:0;text-align:left;font-size:.94rem;font-weight:600;line-height:1.3;
  letter-spacing:-.01em;padding:9px 0;color:var(--text);display:block}
/* resumen de lo cargado, visible con el bloque cerrado */
.ex-res{display:block;margin-top:3px;font-family:'Asap Condensed',sans-serif;font-size:.74rem;
  font-weight:700;letter-spacing:.07em;color:var(--muted);font-variant-numeric:tabular-nums}
.ex.done .ex-res{color:var(--green-2)}
.ex.open .ex-res{display:none}
.ex-chev{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.ex-chev svg{width:17px;height:17px;stroke:var(--dim);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.ex.open .ex-chev svg{transform:rotate(180deg);stroke:var(--violet-2)}
.ex.open{border-color:var(--violet)}
/* ---------- ordenar arrastrando (v13) ----------
   touch-action:none SOLO en el agarre: el resto de la tarjeta sigue scrolleando */
.grip{flex:0 0 auto;width:28px;height:36px;margin-right:-8px;display:flex;align-items:center;
  justify-content:center;touch-action:none;cursor:grab;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip svg{width:10px;height:16px;fill:var(--dim)}
.grip:active svg{fill:var(--violet-2)}
.dragging{position:relative;z-index:60;transition:none!important;cursor:grabbing;
  border-color:var(--violet)!important;box-shadow:0 14px 34px rgba(0,0,0,.6)}
body.arrastrando{-webkit-user-select:none;user-select:none}
.ordbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  margin:-4px 0 12px;padding:9px 12px;border:1px dashed var(--violet);border-radius:var(--r);
  background:var(--violet-lt)}
.ordbar span{font-size:.84rem;font-weight:600;color:var(--violet-2)}
.rut-info{text-align:left;padding:4px 0}
.rut-info .rut-n,.rut-info .rut-c{display:block}
.rutedit{padding:0 0 14px;border-bottom:1px solid var(--hairline)}
#rutlist{margin-bottom:12px}
.rutex{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 12px;margin-bottom:6px;
  background:var(--surface2);border:1px solid var(--border);border-radius:10px}
.rutex-n{flex:1;min-width:0;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rutex-s{flex:0 0 auto;font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.05em;color:var(--muted)}
.musc-grow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.musc-grow .gbtn{min-width:0;padding-left:2px;padding-right:2px}
.ex.done.open{border-color:rgba(43,224,138,.5)}
.ex-det{padding-top:4px;margin-top:8px;border-top:1px solid var(--hairline)}
.ex-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.ex-top{display:flex;align-items:flex-start;gap:11px}

/* --- RIR: reps en reserva --- */
.rirbox{display:flex;align-items:center;gap:10px;margin-top:11px;padding-left:42px;flex-wrap:wrap}
.rirlbl{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.12em;color:var(--dim);display:flex;align-items:center;gap:5px}
.rirq{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;border:1px solid var(--border);font-size:.62rem;cursor:pointer}
.rirpills{display:flex;gap:5px;flex:1}
.rirp{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);color:var(--dim);font-size:.85rem;font-weight:600;transition:.15s}
.rirp.on{background:var(--violet);border-color:var(--violet);color:#fff}

/* --- timer de descanso --- */
.restbox{margin-top:11px;padding-left:42px}
.restbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:40px;border-radius:10px;border:1px dashed var(--border);background:transparent;
  color:var(--muted);font-family:'Asap Condensed',sans-serif;font-size:.8rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;transition:.15s;font-variant-numeric:tabular-nums}
.restbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
/* timer activo: tiempo grande al medio, controles a los costados */
.restrun{display:flex;align-items:center;gap:6px;padding:5px;border-radius:10px;
  border:1px solid var(--cyan);background:var(--cyan-lt)}
.restrun.pausa{border-color:var(--dim);background:var(--surface2)}
.rest-t{flex:1;text-align:center;font-size:1.5rem;font-weight:700;color:var(--cyan);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.restrun.pausa .rest-t{color:var(--muted)}
.rest-ic{width:40px;height:40px;border-radius:9px;background:var(--surface3);
  display:flex;align-items:center;justify-content:center;color:var(--cyan);transition:.15s;flex:0 0 auto}
.restrun.pausa .rest-ic{color:var(--muted)}
.rest-ic svg{width:17px;height:17px;fill:currentColor}
.rest-ic.ln svg{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rest-ic:hover{background:var(--surface)}
.ex-res.tmr{color:var(--cyan)}
.chk{flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:2px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
.chk svg{width:17px;height:17px;stroke:#0E0E14;stroke-width:3.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on svg{opacity:1}
.ex-body{flex:1;min-width:0}
.ex-n{font-size:.94rem;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.gpill{display:inline-block;font-family:'Asap Condensed',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-top:4px}
.gpill.superior{background:var(--violet-lt);color:var(--violet-2)}
.gpill.medio{background:var(--green-lt);color:var(--green-2)}
.gpill.inferior{background:var(--cyan-lt);color:var(--cyan-2)}
.ex-acts{flex:0 0 auto;display:flex;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:.15s}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.iconbtn.yt:hover{border-color:var(--red);color:var(--red)}
.iconbtn.rm:hover{border-color:var(--red);color:var(--red)}

/* grid en vez de flex-wrap: con 3 columnas fijas nunca se parte en dos lineas,
   sin importar el ancho de pantalla ni el tamano de los controles */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px;padding-left:42px}
.fld{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:3px 8px 3px 4px;min-width:0}
.fld input{flex:1 1 auto;width:100%;min-width:0;background:transparent;border:none;padding:9px 2px;
  text-align:center;font-size:16px;font-weight:600;min-height:38px}
.fld input:focus{background:transparent;border:none}
.fld span{font-family:'Asap Condensed',sans-serif;font-size:.68rem;font-weight:700;
  letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.xsep{display:none}
.lastline{margin-top:9px;padding-left:42px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
/* salto de carga: el label va ARRIBA, no al costado. Con "Salto" a la izquierda
   las cinco pills no entraban en 375 y la ultima quedaba cortada. */
.pasoline{margin-top:7px;padding-left:42px}
.pasobtn{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;
  letter-spacing:.05em;color:var(--dim);text-align:left;padding:7px 0;
  border-bottom:1px dashed var(--border)}
.pasobtn b{color:var(--muted);font-weight:700}
.pasobtn:hover{color:var(--muted)}
.pasolbl{display:block;font-family:'Asap Condensed',sans-serif;font-size:.62rem;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  margin:4px 0 7px}
.pasopills{display:flex;gap:5px}
.pasopills .rirp{font-size:.79rem}
@media(max-width:359px){ .pasopills .rirp{font-size:.71rem} }
.meta{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;letter-spacing:.05em;
  color:var(--dim);text-transform:uppercase}
.meta b{color:var(--muted);font-weight:700}
.sug{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:8px 12px;border-radius:20px;transition:.15s;min-height:32px;
  display:inline-flex;align-items:center}
.sug.up{background:var(--green-lt);color:var(--green-2)}
.sug.same{background:var(--surface3);color:var(--muted)}
.sug:hover{filter:brightness(1.3)}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;
  border-radius:11px;font-weight:600;font-size:.94rem;transition:.16s;border:1px solid transparent}
.btn-p{background:var(--violet);color:#fff}
.btn-p:hover{background:var(--violet-2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.32)}
.btn-p:disabled{opacity:.5;transform:none;box-shadow:none;cursor:default}
.btn-o{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-o:hover{border-color:var(--violet);color:var(--violet-2)}
.btn-dash{background:transparent;border:1px dashed var(--border);color:var(--muted);width:100%}
.btn-dash:hover{border-color:var(--violet);color:var(--violet-2);border-style:solid}
.btn-full{width:100%}
.btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- PILLS / TOGGLES ---------- */
.pills{display:inline-flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:3px;gap:2px}
.pill{padding:10px 15px;border-radius:18px;min-height:36px;font-family:'Asap Condensed',sans-serif;font-size:.72rem;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:.15s}
.pill:hover{color:var(--muted)}
.pill.on{background:var(--violet);color:#fff}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 15px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet)}
.kpi.g::before{background:var(--green)}
.kpi.c::before{background:var(--cyan)}
.kpi.x::before{background:var(--border)}
.kpi .kl{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.kpi .kv{font-size:1.75rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .kf{font-family:'Asap Condensed',sans-serif;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}

/* ---------- MACROS ---------- */
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.macro{background:var(--surface2);border-radius:var(--r);padding:14px 12px;text-align:center;
  border:1px solid var(--border)}
.macro .mv{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.macro .ml{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:3px}
.macro.p .mv{color:var(--violet-2)} .macro.g .mv{color:var(--green-2)} .macro.c .mv{color:var(--cyan)}
.simple{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;margin-bottom:7px;transition:.15s}
.simple.done{border-color:rgba(43,224,138,.35)}
.simple .sb{flex:1;min-width:0}
.simple .sn{font-size:.9rem;font-weight:500}
.simple .ss{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:1px}

/* ---------- HISTORIAL ---------- */
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden;transition:.15s}
.hcard.open{border-color:var(--violet)}
.hhead{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left}
.hbadge{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--violet-lt);color:var(--violet-2);line-height:1}
.hbadge .d{font-size:1.05rem;font-weight:700}
.hbadge .m{font-family:'Asap Condensed',sans-serif;font-size:.55rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.hb{flex:1;min-width:0}
.hd{font-size:.92rem;font-weight:600;text-transform:capitalize}
.hm{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin-top:1px}
.hchev{flex:0 0 auto;width:16px;height:16px;stroke:var(--dim);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.hcard.open .hchev{transform:rotate(180deg);stroke:var(--violet-2)}
.hdet{border-top:1px solid var(--hairline);padding:4px 14px 14px}
.hnote{font-size:.82rem;color:var(--muted);font-style:italic;padding:10px 0 4px;line-height:1.4}
.hex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline)}
.hex:last-child{border-bottom:none}
.hdot{flex:0 0 auto;width:7px;height:7px;border-radius:50%}
.hdot.superior{background:var(--violet)} .hdot.medio{background:var(--green)} .hdot.inferior{background:var(--cyan)}
.hdot.cardio{background:var(--green)}
/* --- cardio --- */
.hcard.cardio.open{border-color:var(--green)}
.hcard.cardio .hchev{stroke:var(--dim)}
.hcard.cardio.open .hchev{stroke:var(--green-2)}
.hbadge.cardio{background:var(--green-lt);color:var(--green-2)}
.hbadge.cardio svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.hex-n{flex:1;min-width:0;font-size:.86rem}
.hex-v{flex:0 0 auto;font-family:'Asap Condensed',sans-serif;font-size:.76rem;font-weight:700;
  letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- CALENDARIO ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead .mname{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.caldow{text-align:center;font-family:'Asap Condensed',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-bottom:6px}
.calday{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:.85rem;color:var(--dim);border:1px solid transparent;
  font-variant-numeric:tabular-nums;transition:.15s;position:relative}
.calday.out{opacity:.25}
.calday.today{border-color:var(--border);color:var(--text)}
.calday.hit{background:var(--violet-lt);color:var(--violet-2);font-weight:700;border-color:var(--violet)}
.calday.hit:hover{background:var(--violet);color:#fff}
.calday.onlycardio{background:var(--green-lt);color:var(--green-2);border-color:var(--green)}
.calday.onlycardio:hover{background:var(--green);color:#0E0E14}
.calday .bubs{display:flex;gap:3px;margin-top:3px}
.bub{width:5px;height:5px;border-radius:50%;background:var(--violet-2);display:inline-block;flex:0 0 auto}
.bub.cardio{background:var(--green-2)}
.callegend{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:center}

/* ---------- TABLA ---------- */
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{background:var(--surface2);font-family:'Asap Condensed',sans-serif;font-size:.66rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:10px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:.9rem}
.chartbox{position:relative;height:260px}
.hint{font-size:.82rem;color:var(--muted);line-height:1.5}

/* ---------- MODAL ---------- */
body.modal-open{position:fixed;width:100%;overflow:hidden}
#modal-ov{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;padding:0}
#modal-ov.open{display:flex}
#modal-box{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  padding:20px 18px calc(26px + var(--safe-bot));
  animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mttl{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mttl h3{font-size:1.15rem;font-weight:700;letter-spacing:-.03em}
.mx{font-size:1.2rem;color:var(--dim);padding:8px 12px;min-height:38px;min-width:38px}
.mx:hover{color:var(--text)}
.catlist{max-height:230px;overflow-y:auto;margin-bottom:6px}
.catitem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;width:100%;
  text-align:left;transition:.15s;border:1px solid transparent}
.catitem:hover{background:var(--surface2);border-color:var(--border)}
.catitem .cn{flex:1;min-width:0;font-size:.89rem}
.catitem .cs{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.07em;color:var(--dim)}
/* sugerencias para compensar musculos flojos */
.sugbox{background:var(--green-lt);border:1px solid rgba(43,224,138,.3);border-radius:var(--r);
  padding:12px 11px 8px;margin-bottom:14px}
.sug-item{align-items:flex-start}
.sug-item:hover{background:rgba(43,224,138,.12);border-color:var(--green)}
.sug-item .cn{line-height:1.3}
/* barras de balance semanal por musculo */
.mrow{margin-bottom:12px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.mname2{font-family:'Asap Condensed',sans-serif;font-size:.74rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase}
.mval{font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:700;
  color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.mbar{position:relative;height:10px;border-radius:5px;background:var(--surface3);overflow:hidden}
.mbar .zona{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.05);
  border-left:1px dashed var(--dim);border-right:1px dashed var(--dim)}
.mbar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.mfill-bajo{background:var(--red)} .mfill-ok{background:var(--green)} .mfill-alto{background:var(--cyan)}
/* objetivo semanal editable */
.metabox{display:flex;align-items:center;justify-content:space-between;gap:14px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;padding:4px;flex:0 0 auto}
.stbtn{width:40px;height:40px;border-radius:9px;background:var(--surface3);color:var(--text);
  font-size:1.25rem;font-weight:600;line-height:1;transition:.15s;
  display:flex;align-items:center;justify-content:center}
.stbtn:hover:not(:disabled){background:var(--violet);color:#fff}
.stbtn:disabled{opacity:.3;cursor:default}
.stval{min-width:34px;text-align:center;font-size:1.3rem;font-weight:700}

/* ---------- PROGRESO v12 ---------- */
.hero{padding:16px}
.hero-top{display:flex;align-items:center;gap:16px}
.ring{width:76px;height:76px;flex:0 0 auto}
.ring-t{font-family:'Asap',system-ui,sans-serif;font-size:19px;font-weight:700;
  font-variant-numeric:tabular-nums}
/* el keyframe arranca en la circunferencia entera (2*PI*30 = 188.5) y termina en
   el dashoffset inline de cada anillo: sin fill-mode, el estado final es el del
   atributo, asi que un solo keyframe sirve para cualquier porcentaje */
@keyframes ringin{from{stroke-dashoffset:188.5}}
.ring-f{animation:ringin .7s cubic-bezier(.22,1,.36,1)}
.hero-b{flex:1;min-width:0}
.hero-h{font-size:1.3rem;font-weight:700;letter-spacing:-.035em;line-height:1.15;margin-top:3px}
.hero-m{font-family:'Asap Condensed',sans-serif;font-size:.79rem;font-weight:600;
  letter-spacing:.05em;color:var(--muted);margin-top:4px}
.hero-l{margin-top:13px;padding-top:12px;border-top:1px solid var(--hairline);
  font-size:.9rem;font-weight:600}
.hero-f{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:13px;padding-top:12px;border-top:1px solid var(--hairline)}
.stepper.sm{padding:3px}
.stepper.sm .stbtn{width:34px;height:34px;border-radius:8px;font-size:1rem}
.stepper.sm .stval{min-width:26px;font-size:1.05rem}
.pr-up{flex:0 0 auto;color:var(--green);font-size:.72rem;line-height:1}
.prow{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--hairline)}
.prow:last-child{border-bottom:none}
.prow-n{flex:1;min-width:0;font-size:.86rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{flex:0 0 auto;width:72px;height:24px}
.prow-v{flex:0 0 auto;text-align:right;min-width:76px;line-height:1.3;
  font-family:'Asap Condensed',sans-serif;font-size:.77rem;font-weight:700;
  letter-spacing:.04em;font-variant-numeric:tabular-nums}
.prow-p{font-size:.73rem}
.rec-v{font-size:2.4rem;font-weight:700;letter-spacing:-.045em;line-height:1;
  color:var(--green-2);font-variant-numeric:tabular-nums;margin-top:5px}
.rec-s{font-family:'Asap Condensed',sans-serif;font-size:.78rem;font-weight:600;
  letter-spacing:.05em;color:var(--muted);margin-top:5px}
@media(max-width:359px){
  .spark{width:54px}
  .prow-n{font-size:.82rem}
  .prow-v{min-width:70px;font-size:.74rem}
}
/* --- corridas del dia, en Entrenar --- */
.cardio-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid rgba(59,224,208,.35);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;transition:.15s}
.cardio-row:hover{border-color:var(--cyan)}
.cardio-ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--cyan-lt);
  display:flex;align-items:center;justify-content:center}
.cardio-ic svg{width:18px;height:18px;stroke:var(--cyan);stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.cardio-b{flex:1;min-width:0;display:block}
.cardio-n{display:block;font-size:.9rem;font-weight:600}
.cardio-d{display:block;font-family:'Asap Condensed',sans-serif;font-size:.74rem;font-weight:700;
  letter-spacing:.06em;color:var(--cyan);margin-top:2px;font-variant-numeric:tabular-nums}

/* --- rutinas guardadas --- */
.rutbar{display:flex;align-items:center;gap:7px;margin:0 0 16px;overflow-x:auto;
  scrollbar-width:none;padding-bottom:2px}
.rutbar::-webkit-scrollbar{display:none}
.rutchip{flex:0 0 auto;display:flex;align-items:center;gap:5px;min-height:34px;padding:7px 13px;
  border-radius:20px;border:1px solid var(--border);background:var(--surface2);
  font-family:'Asap Condensed',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.06em;
  color:var(--text);white-space:nowrap;transition:.15s}
.rutchip:hover{border-color:var(--violet);color:var(--violet-2)}
.rutchip .st{color:var(--violet-2)}
.rutchip.add{border-style:dashed;color:var(--muted)}
.rutrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--hairline)}
.rut-star{flex:0 0 auto;width:38px;height:38px;border-radius:9px;font-size:1.1rem;
  color:var(--dim);background:var(--surface2);border:1px solid var(--border)}
.rut-star.on{color:var(--violet-2);border-color:var(--violet);background:var(--violet-lt)}
.rut-info{flex:1;min-width:0}
.rut-n{font-size:.92rem;font-weight:600}
.rut-c{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-top:1px}
.rut-usar{flex:0 0 auto;min-height:38px;padding:8px 15px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-family:'Asap Condensed',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase}
.rut-usar:hover{border-color:var(--violet);color:var(--violet-2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:6px 12px;font-family:'Asap Condensed',sans-serif;font-size:.74rem;
  font-weight:700;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums}
.chip.viejo{background:var(--red-lt);border-color:rgba(255,77,94,.4);color:#FFA8B1}
.chip.ok{color:var(--muted)}
.mdiv{display:flex;align-items:center;gap:11px;margin:16px 0 13px}
.mdiv::before,.mdiv::after{content:'';flex:1;height:1px;background:var(--border)}
.mdiv span{font-family:'Asap Condensed',sans-serif;font-size:.64rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.grow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.gbtn{padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
  font-family:'Asap Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);transition:.15s}
.gbtn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.f3 .fl{font-family:'Asap Condensed',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}

#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bot));transform:translate(-50%,100px);z-index:800;
  background:var(--surface3);border:1px solid var(--border);border-radius:11px;padding:13px 20px;
  font-size:.88rem;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.28s;max-width:88vw;
  text-align:center;line-height:1.5}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.ok{border-color:var(--green);color:var(--green-2)}
#toast.err{border-color:var(--red);color:#FFA8B1}

/* Cuando la app corre agregada a la pantalla de inicio (sin barra de Safari),
   el contenido queda pegado a la isla. Este respiro no aplica en el navegador. */
@media (display-mode:standalone), (display-mode:fullscreen){
  :root{ --hdr-extra:14px; }
}
@media(min-width:720px){
  body{font-size:15.5px}
  main{padding:28px 32px 40px}
  .ptitle{font-size:1.95rem}
  #modal-ov{align-items:center;padding:24px}
  #modal-box{border-radius:18px}
}
</style>
</head>

function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

var MESES  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS   = ['domingo','lunes','martes','mi&eacute;rcoles','jueves','viernes','s&aacute;bado'];
var DOW    = ['Lun','Mar','Mi&eacute;','Jue','Vie','S&aacute;b','Dom'];

function parseISO(s){ var p=String(s||'').split('-'); return new Date(+p[0],(+p[1])-1,+p[2]); }
function fDate(s){ var d=parseISO(s); return isNaN(d)?s:DIAS[d.getDay()]+' '+d.getDate()+' '+MESESL[d.getMonth()]; }
function fShort(s){ var d=parseISO(s); return isNaN(d)?s:d.getDate()+' '+MESES[d.getMonth()]; }
function monday(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekKey(iso){ return isoOf(monday(parseISO(iso))); }
function monthKey(iso){ return String(iso).slice(0,7); }

function slug(s){
  /* pasa a minusculas, saca acentos y deja solo a-z 0-9 separados por guiones.
     Hecho a mano char por char para no meter acentos ni escapes en el archivo. */
  var t = String(s||'').toLowerCase(), o = '';
  for(var i=0;i<t.length;i++){
    var c = t.charCodeAt(i);
    if((c>=97 && c<=122) || (c>=48 && c<=57)) o += t.charAt(i);
    else if(c>=224 && c<=229) o += 'a';
    else if(c>=232 && c<=235) o += 'e';
    else if(c>=236 && c<=239) o += 'i';
    else if(c>=242 && c<=246) o += 'o';
    else if(c>=249 && c<=252) o += 'u';
    else if(c===241) o += 'n';
    else o += '-';
  }
  while(o.indexOf('--')!==-1) o = o.split('--').join('-');
  if(o.charAt(0)==='-') o = o.substring(1);
  if(o.charAt(o.length-1)==='-') o = o.substring(0,o.length-1);
  return o.substring(0,40);
}
function nf(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
/* hasta 2 decimales: Diego carga pesos como 11,25 kg y redondear a 1 decimal
   los mostraba como 11,3, que no es lo que cargo. */
function fKg(v){ var n=parseFloat(v); return isNaN(n)?'':(Math.round(n*100)/100).toString().replace('.',','); }
/* distancias: 2 decimales, como los muestra la app Fitness */
function fKm(v){ var n=parseFloat(v); return isNaN(n)?'':n.toFixed(2).replace('.',','); }
function fInt(v){ return Math.round(nf(v)).toLocaleString('es-AR'); }

function toast(msg,type,ms){

/* catalogo completo: rutina base + sugerencias + lo que Diego haya creado a mano */
function allKnown(){
  var out = {};
  RUTINA_BASE.concat(CATALOGO).forEach(function(e){ out[e.id]=e; });
  if(D && D.sessions){
    D.sessions.forEach(function(s){
      (s.order||Object.keys(s.items)).forEach(function(id){
        if(out[id]) return;
        var it=s.items[id]; if(!it) return;
        out[id] = {id:id, n:esc(it.name), p:it.name, g:it.group||'superior',
                   s:nf(it.series)||3, r:nf(it.reps)||12, custom:true};
      });
    });
  }
  return out;
}
function exDef(id){ return allKnown()[id] || null; }

/* ==================================================================
   NOMBRES (v13)
   Los ejercicios se reconocen por su ID, nunca por el nombre: renombrar no toca
   el historial ni los records. El nombre que manda es, en este orden:
   1. el que Diego acaba de poner en este celular (localStorage, hasta que guarde)
   2. el ultimo guardado en la planilla (ese viaja entre dispositivos)
   3. el del catalogo
   ================================================================== */
function nombresLocal(){
  try{ return JSON.parse(localStorage.getItem('gym_nombres') || '{}') || {}; }catch(e){ return {}; }
}
function nombreGuardado(id){
  var ss = (D && D.sessions) ? D.sessions : [];
  for(var i=0;i<ss.length;i++){
    var it = ss[i].items[id];
    if(it && it.name) return String(it.name);
  }
  return '';
}
/* nombre plano, sin entidades: el que va a la planilla y a la busqueda de YouTube */
function nombrePlano(id, fallback){
  var loc = nombresLocal()[id];
  if(loc) return loc;
  var g = nombreGuardado(id);
  if(g) return g;
  var e = exDef(id);
  return e ? e.p : (fallback || id);
}
function dispName(id, fallback){
  var e = exDef(id);
  var loc = nombresLocal()[id];
  if(loc) return (e && !e.custom && loc === e.p) ? e.n : esc(loc);
  if(e && !e.custom){
    /* el catalogo tiene la version con acentos; si el guardado es el mismo, uso esa */
    var g = nombreGuardado(id);
    return (g && g !== e.p) ? esc(g) : e.n;
  }
  return e ? e.n : esc(fallback||id);
}

/* El ultimo registro HECHO de un ejercicio antes de la fecha en pantalla, tenga o no
   peso. lastRecord() en cambio exige peso: sirve para sugerir, no para precargar. */
function ultimoItem(exId){
  var ss = (D && D.sessions) ? D.sessions : [];
  for(var i=0;i<ss.length;i++){
    if(ss[i].date >= curDate) continue;
    var it = ss[i].items[exId];
    if(it && it.done) return {weight:it.weight, series:it.series, reps:it.reps, date:ss[i].date};
  }
  return null;
}
/* Un ejercicio nuevo del borrador arranca con lo que Diego hizo la ultima vez:
   peso, series y reps. Desde ahi sube o baja a mano; la sugerencia de subir sigue
   estando, pero ya no se aplica sola.
   Si esa ultima vez se olvido de anotar el peso (el remo del 13/09), usa el ultimo
   que si anoto. base = {name, group, series, reps} para cuando nunca lo hizo. */
function precargar(id, base){
  var u = ultimoItem(id), rec = lastRecord(id);
  var w = '';
  if(u && nf(u.weight) > 0) w = String(u.weight);
  else if(rec && nf(rec.weight) > 0) w = String(rec.weight);
  return {
    name: nombrePlano(id, base.name),
    group: base.group || 'superior',
    weight: w,
    series: String((u && u.series) || base.series || 3),
    reps: String((u && u.reps) || base.reps || 12),
    rir: '', done: false
  };
}

/* ==================================================================
   PROGRESION
   ================================================================== */
function lastRecord(exId){
  if(!D || !D.sessions) return null;
  for(var i=0;i<D.sessions.length;i++){
    /* solo sesiones ANTERIORES: al editar una del 25/08 no tiene sentido que el
       "ultimo" y la sugerencia salgan de una del 31/08 */
    if(D.sessions[i].date >= curDate) continue;
    var it = D.sessions[i].items[exId];
    if(it && it.weight!=='' && !isNaN(parseFloat(it.weight))){
      return {weight:parseFloat(it.weight), series:it.series, reps:it.reps,
              done:it.done===true, date:D.sessions[i].date};
    }
  }
  return null;
}
function suggest(rec, exId){
  if(!rec) return null;
  if(!rec.done) return {v:rec.weight, up:false};
  return {v: subirPeso(exId, rec.weight), up:true};
}

/* ==================================================================
   PASO DE CARGA
   Las maquinas no suben de a un kilo. El remo salta de 13 a 16,5; el multipower
   con discos chicos va de a 1,25; las mancuernas de a 1 o 2. Sugerir "+5%
   redondeado a 0,5" daba pesos que no existen en el gimnasio (21 kg en la
   sentadilla, 13,5 en el remo).

   El paso sale del historial del ejercicio: el salto mas chico que Diego
   realmente hizo alguna vez es, por definicion, un escalon de esa maquina.
   Se puede fijar a mano, como el descanso, y vive en localStorage porque es
   una propiedad del gimnasio, no del entrenamiento.
   ================================================================== */
var PASO_DEF = 2.5;
var PASOS = ['1','1.25','2.5','5'];

function pasoGuardado(id){
  try{
    var v = parseFloat(localStorage.getItem('gym_paso_'+id));
    if(v > 0) return v;
  }catch(e){}
  return null;
}
function setPaso(id, v){
  var n = parseFloat(v);
  try{
    if(n > 0) localStorage.setItem('gym_paso_'+id, String(n));
    else localStorage.removeItem('gym_paso_'+id);
  }catch(e){}
  openPaso = null;   /* elegiste: se cierra solo */
  buildTrain();
}
function togglePaso(id){ openPaso = (openPaso===id) ? null : id; buildTrain(); }
function pasoDe(id){
  var fijo = pasoGuardado(id);
  if(fijo) return fijo;
  var vals = [];
  ((D && D.sessions) ? D.sessions : []).slice()
    .sort(function(a,b){ return a.date<b.date?-1:1; })
    .forEach(function(s){
      var it = s.items[id];
      if(it && it.done && nf(it.weight) > 0) vals.push(nf(it.weight));
    });
  var min = 0;
  for(var i=1;i<vals.length;i++){
    var d = Math.abs(vals[i] - vals[i-1]);
    if(d > 0.01 && (!min || d < min)) min = d;
  }
  if(min) return Math.round(min*100)/100;
  /* sin historial de saltos: por la carga. Menos de 12 kg suele ser mancuerna
     o aislamiento, donde 2,5 kg de un saque es demasiado. */
  var ult = vals.length ? vals[vals.length-1] : 0;
  if(ult && ult < 12) return 1;
  var e = exDef(id);
  return (e && e.paso) || PASO_DEF;
}
/* siguiente peso que existe de verdad: uno o mas escalones, los que hagan falta
   para llegar al +5%. Nunca devuelve un valor intermedio que no se puede cargar. */
function subirPeso(id, w){
  var p = pasoDe(id);
  var n = Math.ceil((w*0.05) / p);
  if(n < 1) n = 1;
  return Math.round((w + n*p)*100)/100;
}

   ================================================================== */
/* volumen de un item = peso x series x reps  (0 si no hay peso cargado) */
function itemVol(it){ return nf(it.weight) * nf(it.series) * nf(it.reps); }
function itemReps(it){ return nf(it.series) * nf(it.reps); }

/* porGrupo guarda las TRES metricas por tren, no solo el volumen: el trabajo de peso
   corporal (oblicuos, captain chair) suma 0 kg pero si suma series y reps. */
function statsOf(sessions){
  var g0 = function(){ return {vol:0, series:0, reps:0}; };
  var o = {vol:0, series:0, reps:0, ses:sessions.length,
           porGrupo:{superior:g0(), medio:g0(), inferior:g0()}};
  sessions.forEach(function(s){
    for(var id in s.items){
      var it = s.items[id];
      if(!it.done) continue;
      var v = itemVol(it), r = itemReps(it), se = nf(it.series);
      var g = it.group || 'superior';
      if(!o.porGrupo[g]) g = 'superior';
      o.vol += v; o.series += se; o.reps += r;
      o.porGrupo[g].vol += v;
      o.porGrupo[g].series += se;
      o.porGrupo[g].reps += r;
    }
  });
  return o;
}

/* ==================================================================
   BALANCE POR MUSCULO
   La base de las sugerencias y de los KPIs utiles de Progreso.
   ================================================================== */
/* Palabras que delatan el musculo de un ejercicio cargado a mano. Primero los
   nombres de musculo explicitos y despues maquinas y movimientos, para que
   "curl femoral" caiga en piernas y no en biceps. Se compara contra slug() del
   nombre, que ya viene sin acentos: nunca regex sobre acentos. */
var MUSC_PALABRAS = [
  ['jalon','espalda'], ['press-frances','triceps'],
  ['tricep','triceps'], ['bicep','biceps'], ['gluteo','gluteos'],
  ['cuadricep','piernas'], ['femoral','piernas'], ['isquio','piernas'],
  ['gemelo','piernas'], ['pantorrilla','piernas'],
  ['hombro','hombros'], ['deltoide','hombros'],
  ['pecho','pecho'], ['pectoral','pecho'],
  ['abdominal','core'], ['oblicuo','core'], ['lumbar','core'],
  ['dorsal','espalda'], ['espalda','espalda'],
  ['frances','triceps'], ['fondo','triceps'], ['copa','triceps'],
  ['martillo','biceps'], ['curl','biceps'],
  ['hip-thrust','gluteos'], ['puente','gluteos'], ['abductor','gluteos'], ['patada','gluteos'],
  ['prensa','piernas'], ['sentadilla','piernas'], ['pierna','piernas'], ['aductor','piernas'],
  ['estocada','piernas'], ['zancada','piernas'], ['rodilla','piernas'], ['peso-muerto','piernas'],
  ['vuelo','hombros'], ['lateral','hombros'], ['militar','hombros'],
  ['apertura','pecho'], ['banca','pecho'], ['peck','pecho'],
  ['plancha','core'], ['crunch','core'], ['espinal','core'],
  ['remo','espalda'], ['dominada','espalda'], ['polea','espalda']
];
function muscPorNombre(nombre){
  var t = slug(nombre);
  for(var i=0;i<MUSC_PALABRAS.length;i++){
    if(t.indexOf(MUSC_PALABRAS[i][0]) !== -1) return MUSC_PALABRAS[i][1];
  }
  return '';
}
function muscLocal(){
  try{ return JSON.parse(localStorage.getItem('gym_musc') || '{}') || {}; }catch(e){ return {}; }
}
/* Musculo de un ejercicio: el del catalogo. Si es cargado a mano: el que Diego eligio,
   o el que delata su nombre, y recien al final el que se deduce del tren.
   Hasta v12 iba directo al tren, asi que "Triceps" (tren superior) contaba como
   ESPALDA: el 13/09 Progreso seguia diciendo que triceps nunca se habia trabajado. */
function muscOf(id, it){
  var e = exDef(id);
  if(e && e.m) return e.m;
  var ov = muscLocal()[id];
  if(ov && MUSCULOS[ov]) return ov;
  var pn = muscPorNombre(nombrePlano(id, it && it.name));
  if(pn) return pn;
  var g = (it && it.group) || (e && e.g) || 'superior';
  return g==='medio' ? 'core' : (g==='inferior' ? 'piernas' : 'espalda');
}

/* Por cada musculo: series de la semana en curso, series por semana promedio,
   dias desde la ultima vez y total historico. */
function muscleStats(wk){
  var out = {};
  MORDER.forEach(function(m){ out[m] = {sem:0, dias:null, ult:'', total:0, semanas:{}}; });

  var ss = (D && D.sessions) ? D.sessions : [];
  var wkNow = wk || weekKey(todayISO());
  var hoy = parseISO(todayISO());

  ss.forEach(function(s){
    var wk = weekKey(s.date);
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it = s.items[id];
      if(!it || !it.done) return;
      var m = muscOf(id, it);
      if(!out[m]) return;
      var ser = nf(it.series);
      out[m].total += ser;
      out[m].semanas[wk] = (out[m].semanas[wk]||0) + ser;
      if(wk === wkNow) out[m].sem += ser;
      if(!out[m].ult || s.date > out[m].ult) out[m].ult = s.date;
    });
  });

  MORDER.forEach(function(m){
    var o = out[m];
    if(o.ult) o.dias = Math.round((hoy - parseISO(o.ult)) / 86400000);
    var ks = Object.keys(o.semanas);
    o.prom = ks.length ? Math.round(o.semanas[ks.sort()[ks.length-1]]) : 0;
  });
  return out;
}

/* Ordena los musculos del mas descuidado al mas trabajado.
   Pesa lo que falta para el minimo semanal y los dias sin tocarlo. */
function muscleGaps(wk){
  var st = muscleStats(wk);
  var arr = MORDER.map(function(m){
    var o = st[m];
    var falta = Math.max(0, SERIES_MIN - o.sem);
    var dias = (o.dias === null) ? 60 : Math.min(o.dias, 60);
    return {m:m, sem:o.sem, dias:o.dias, total:o.total, falta:falta,
            score: falta * 10 + dias * 2};
  });
  arr.sort(function(a,b){ return b.score - a.score; });
  return arr;
}

/* Ejercicios que vienen con el mismo peso varias sesiones seguidas */
function estancados(minSes){
  minSes = minSes || 4;
  var ss = (D && D.sessions) ? D.sessions : [];
  var asc = ss.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var hist = {};
  asc.forEach(function(s){
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it = s.items[id];
      if(!it || !it.done || !nf(it.weight)) return;
      (hist[id] = hist[id] || []).push({d:s.date, w:nf(it.weight), name:it.name});
    });
  });
  var out = [];
  for(var id in hist){
    var a = hist[id], last = a[a.length-1].w, n = 0;
    for(var i=a.length-1; i>=0; i--){ if(a[i].w === last) n++; else break; }
    if(n >= minSes) out.push({id:id, name:a[0].name, w:last, n:n, desde:a[a.length-n].d});
  }
  out.sort(function(a,b){ return b.n - a.n; });
  return out;
}

/* ==================================================================
   RUTINAS GUARDADAS (hasta 3)
   Diego siempre sacaba los mismos ejercicios de la rutina base. En vez de borrarlos en
   cada sesion, guarda su propio set. Viven en la planilla, no en localStorage: si borra
   el cache de Safari no los pierde.
   ================================================================== */
var MAX_RUTINAS = 3;
var rutSlot = 0, rutNombre = '';

function rutinas(){ return (D && D.rutinas) ? D.rutinas : []; }
function rutinaDefault(){
  var rs = rutinas();
  for(var i=0;i<rs.length;i++) if(rs[i].def) return rs[i];
  return null;
}
/* el set de ejercicios que hay en pantalla, listo para guardar */
function rutinaActual(){
  return draftOrder.map(function(id){
    var st = draft[id] || {};
    return {id:id, s:String(st.series||''), r:String(st.reps||''),
            n:st.name||'', g:st.group||'superior'};
  });
}
/* carga una rutina en la sesion en curso, conservando lo que ya tenia cargado */
function usarRutina(slot){
  var r = null;
  rutinas().forEach(function(x){ if(x.slot===slot) r = x; });
  if(!r) return;
  var previo = {};
  draftOrder.forEach(function(id){ if(draft[id]) previo[id] = draft[id]; });

  draft = {}; draftOrder = [];
  (r.ex||[]).forEach(function(e){
    var def = exDef(e.id);
    draft[e.id] = previo[e.id] || precargar(e.id, {
      name: e.n || (def ? def.p : e.id),
      group: e.g || (def ? def.g : 'superior'),
      series: e.s || (def ? def.s : 3), reps: e.r || (def ? def.r : 12)
    });
    draftOrder.push(e.id);
  });
  draftDirty = true;
  openEx = null;
  buildTrain();
  toast('Rutina <b>'+esc(r.nombre)+'</b> cargada','ok');
}

function openRutinas(){
  rutSlot = 0; rutNombre = ''; rutEdit = null; rutEditEx = null;
  renderRutinas();
  openModal();
}

function renderRutinas(){
  var rs = rutinas();
  var h = '';
  h += '<div class="mttl"><h3>Mis rutinas</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';
  h += '<div class="hint" style="margin-bottom:14px">Guard&aacute; hasta '+MAX_RUTINAS+' sets de ejercicios. '+
       'La marcada con estrella es la que se carga sola en una sesi&oacute;n nueva.</div>';

  if(rs.length){
    rs.forEach(function(r){
      var ed = (rutEdit === r.slot);
      h += '<div class="rutrow">';
      h += '<button class="rut-star'+(r.def?' on':'')+'" onclick="marcarDefault('+r.slot+')">'+
           (r.def?'&#9733;':'&#9734;')+'</button>';
      /* tocar el nombre despliega sus ejercicios para ordenarlos */
      h += '<button class="rut-info" onclick="toggleRutEdit('+r.slot+')">'+
           '<span class="rut-n">'+esc(r.nombre)+'</span>'+
           '<span class="rut-c">'+(r.ex||[]).length+' ejercicios &middot; '+
           (ed ? 'cerrar &#9650;' : 'ordenar &#9660;')+'</span></button>';
      h += '<button class="rut-usar" onclick="usarRutina('+r.slot+');closeModal()">Usar</button>';
      h += '<button class="mx" onclick="borrarRutina('+r.slot+')">&#10005;</button>';
      h += '</div>';
      if(ed){
        h += '<div class="rutedit">';
        h += '<div class="hint" style="margin:10px 0">Arrastr&aacute; desde los puntitos para cambiar el orden.</div>';
        h += '<div id="rutlist">';
        (rutEditEx||[]).forEach(function(e){
          h += '<div class="rutex" data-drag="'+esc(e.id)+'">'+
               '<span class="rutex-n">'+dispName(e.id, e.n)+'</span>'+
               '<span class="rutex-s">'+esc(e.s)+'x'+esc(e.r)+'</span>'+
               gripHTML('rutlist')+'</div>';
        });
        h += '</div>';
        h += '<button class="btn btn-p btn-full" id="btn-rutord" onclick="guardarOrdenRutina()">Guardar orden</button>';
        h += '</div>';
      }
    });
  } else {
    h += '<div class="empty" style="padding:18px">Todav&iacute;a no guardaste ninguna.</div>';
  }

  h += '<div class="mdiv"><span>guardar la de ahora</span></div>';
  h += '<div class="hint" style="margin-bottom:10px">Se guardan los <b>'+draftOrder.length+
       ' ejercicios</b> que ten&eacute;s en pantalla, con sus series y reps. Los pesos no.</div>';
  h += '<div style="margin-bottom:12px"><div class="fl kick" style="margin-bottom:5px">Nombre</div>'+
       '<input type="text" id="rut-nombre" placeholder="Ej: Mi rutina" value="'+esc(rutNombre)+'" '+
       'oninput="rutNombre=this.value"></div>';
  h += '<div class="fl kick" style="margin-bottom:6px">Guardar en</div><div class="grow">';
  for(var i=1;i<=MAX_RUTINAS;i++){
    var ocupada = null;
    rs.forEach(function(x){ if(x.slot===i) ocupada = x; });
    h += '<button class="gbtn rut-slot'+(rutSlot===i?' on':'')+'" data-s="'+i+'" onclick="setRutSlot('+i+')">'+
         (ocupada ? esc(ocupada.nombre).slice(0,10) : 'Libre '+i)+'</button>';
  }
  h += '</div>';
  h += '<button class="btn btn-p btn-full" id="btn-rut" onclick="guardarRutina()">Guardar rutina</button>';

  $('modal-box').innerHTML = h;
}
function setRutSlot(i){
  rutSlot = i;
  var bs = document.querySelectorAll('#modal-box .rut-slot');
  for(var k=0;k<bs.length;k++) bs[k].classList.toggle('on', +bs[k].dataset.s === i);
}

function guardarRutina(){
  var nombre = (rutNombre||'').trim();
  if(!nombre){ toast('Pon&eacute;le un nombre','err'); return; }
  if(!rutSlot){ toast('Eleg&iacute; d&oacute;nde guardarla','err'); return; }
  if(!draftOrder.length){ toast('No hay ejercicios para guardar','err'); return; }

  var rs = rutinas().filter(function(r){ return r.slot !== rutSlot; });
  var hayDef = false;
  rs.forEach(function(r){ if(r.def) hayDef = true; });
  rs.push({slot:rutSlot, nombre:nombre, ex:rutinaActual(), def: !hayDef});
  rs.sort(function(a,b){ return a.slot-b.slot; });

  apiPost('saveRutinas', {rutinas:rs}, $('btn-rut'))
    .then(function(){ closeModal(); toast('Rutina guardada','ok'); fetchData(true); })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}
function marcarDefault(slot){
  var rs = rutinas().map(function(r){
    return {slot:r.slot, nombre:r.nombre, ex:r.ex, def: r.slot===slot};
  });
  apiPost('saveRutinas', {rutinas:rs})
    .then(function(){ if(D) D.rutinas = rs; renderRutinas(); buildTrain(); fetchData(true); })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}
function borrarRutina(slot){
  var r = null;
  rutinas().forEach(function(x){ if(x.slot===slot) r = x; });
  if(!r) return;
  if(!window.confirm('Borrar la rutina "'+r.nombre+'"?')) return;
  var rs = rutinas().filter(function(x){ return x.slot !== slot; });
  apiPost('saveRutinas', {rutinas:rs})
    .then(function(){ if(D) D.rutinas = rs; renderRutinas(); buildTrain(); toast('Rutina borrada','ok'); fetchData(true); })
    .catch(function(e){ toast('No pude borrar: '+e.message,'err'); });
}

/* ==================================================================
   ORDEN DE LOS EJERCICIOS (v13)
   En la sesion del dia: se arrastra y el orden viaja con la sesion guardada.
   En una rutina: se ordena desde el modal de rutinas.
   La rutina de arranque manda el orden de un dia nuevo. Si Diego reordena el dia
   y tiene rutina de arranque, aparece un boton para llevarse ese orden a la rutina:
   si no, al dia siguiente volveria el orden viejo y pareceria que no se guardo.
   ================================================================== */
var rutEdit = null, rutEditEx = null;   // rutina desplegada en el modal y su copia de trabajo
var ordenCambiado = false;              // Diego reordeno la sesion en pantalla

function toggleRutEdit(slot){
  if(rutEdit === slot){ rutEdit = null; rutEditEx = null; }
  else {
    var r = null;
    rutinas().forEach(function(x){ if(x.slot === slot) r = x; });
    rutEdit = slot;
    rutEditEx = r ? (r.ex||[]).slice() : [];
  }
  renderRutinas();
}
function guardarOrdenRutina(){
  if(rutEdit === null || !rutEditEx) return;
  var rs = rutinas().map(function(r){
    return {slot:r.slot, nombre:r.nombre, ex: r.slot === rutEdit ? rutEditEx : r.ex, def:r.def};
  });
  apiPost('saveRutinas', {rutinas:rs}, $('btn-rutord'))
    .then(function(){
      if(D) D.rutinas = rs;
      rutEdit = null; rutEditEx = null;
      renderRutinas(); buildTrain();
      toast('Orden guardado','ok');
      fetchData(true);
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* la sesion en pantalla tiene los ejercicios de la rutina de arranque en otro orden */
function ordenDistinto(){
  var rd = rutinaDefault();
  if(!rd || !rd.ex) return false;
  var enRut = rd.ex.map(function(e){ return e.id; })
                .filter(function(id){ return draftOrder.indexOf(id) !== -1; });
  var enDraft = draftOrder.filter(function(id){ return enRut.indexOf(id) !== -1; });
  return enRut.join('|') !== enDraft.join('|');
}
/* reordena la rutina de arranque como la sesion en pantalla. Los ejercicios que la
   rutina tiene y hoy no estan quedan al final, en el orden que tenian. */
function guardarOrdenEnRutina(){
  var rd = rutinaDefault();
  if(!rd) return;
  var pos = {};
  draftOrder.forEach(function(id, i){ pos[id] = i; });
  var ex = rd.ex.slice().sort(function(a, b){
    var pa = (pos[a.id] === undefined) ? 1e6 + rd.ex.indexOf(a) : pos[a.id];
    var pb = (pos[b.id] === undefined) ? 1e6 + rd.ex.indexOf(b) : pos[b.id];
    return pa - pb;
  });
  var rs = rutinas().map(function(r){
    return {slot:r.slot, nombre:r.nombre, ex: r.slot === rd.slot ? ex : r.ex, def:r.def};
  });
  apiPost('saveRutinas', {rutinas:rs}, $('btn-ordrut'))
    .then(function(){
      if(D) D.rutinas = rs;
      ordenCambiado = false;
      buildTrain();
      toast('Orden guardado en <b>'+esc(rd.nombre)+'</b>','ok');
      fetchData(true);
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* ---- arrastrar para ordenar ----
   Pointer events, sin librerias. El agarre es solo el icono de puntitos, con
   touch-action:none: asi el resto de la tarjeta sigue scrolleando la pagina normal
   y tocar el nombre sigue abriendo el ejercicio.
   La posicion se recalcula en cada cuadro contra el lugar natural del elemento
   (transform en cero, se mide, se vuelve a aplicar): funciona igual si la lista se
   reordena debajo o si la pantalla scrollea sola cerca de los bordes. */
var drag = null;
var DRAG_FIN = {
  exlist: function(ids){
    draftOrder = ids;
    draftDirty = true;
    ordenCambiado = true;
    buildTrain();
  },
  rutlist: function(ids){
    var porId = {};
    (rutEditEx||[]).forEach(function(e){ porId[e.id] = e; });
    rutEditEx = ids.map(function(id){ return porId[id]; }).filter(Boolean);
    /* el DOM ya esta en el orden nuevo: no hace falta re-renderizar el modal */
  }
};

function gripHTML(listId){
  return '<span class="grip" onpointerdown="dragStart(event,\''+listId+'\')" title="Arrastrar para ordenar">'+
         '<svg viewBox="0 0 10 16" aria-hidden="true">'+
         '<circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/>'+
         '<circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/>'+
         '<circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></svg></span>';
}

function dragStart(ev, listId){
  if(drag) return;
  if(ev.pointerType === 'mouse' && ev.button !== 0) return;
  var handle = ev.currentTarget || ev.target;
  var item = handle.closest('[data-drag]');
  var list = $(listId);
  if(!item || !list) return;
  ev.preventDefault();
  var r = item.getBoundingClientRect();
  drag = {listId:listId, list:list, item:item, pid:ev.pointerId,
          grab: ev.clientY - r.top, y: ev.clientY, movido:false, raf:0,
          scroller: item.closest('#modal-box')};
  try{ handle.setPointerCapture(ev.pointerId); }catch(e){}
  item.classList.add('dragging');
  document.body.classList.add('arrastrando');
  document.addEventListener('pointermove', dragMove, {passive:false});
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
  drag.raf = requestAnimationFrame(dragTick);
}
function dragMove(ev){
  if(!drag || ev.pointerId !== drag.pid) return;
  ev.preventDefault();
  drag.y = ev.clientY;
  drag.movido = true;
  dragPos();
}
function dragPos(){
  var it = drag.item, list = drag.list, sigue = true;
  while(sigue){
    sigue = false;
    var prev = it.previousElementSibling, next = it.nextElementSibling;
    if(prev && prev.hasAttribute('data-drag')){
      var pr = prev.getBoundingClientRect();
      if(drag.y < pr.top + pr.height/2){ list.insertBefore(it, prev); sigue = true; continue; }
    }
    if(next && next.hasAttribute('data-drag')){
      var nr = next.getBoundingClientRect();
      if(drag.y > nr.top + nr.height/2){ list.insertBefore(next, it); sigue = true; }
    }
  }
  it.style.transform = '';
  var top = it.getBoundingClientRect().top;
  it.style.transform = 'translateY('+(drag.y - drag.grab - top)+'px)';
}
/* scroll automatico cerca de los bordes: sin esto no se puede llevar el primer
   ejercicio al final de una lista mas larga que la pantalla */
function dragTick(){
  if(!drag) return;
  if(drag.movido){
    var sc = drag.scroller, top, bot;
    if(sc){ var sr = sc.getBoundingClientRect(); top = sr.top; bot = sr.bottom; }
    else {
      var nav = document.querySelector('nav.tabs');
      top = nav ? nav.getBoundingClientRect().bottom : 0;
      bot = window.innerHeight;
    }
    var zona = 70, v = 0;
    if(drag.y < top + zona) v = -Math.ceil((top + zona - drag.y) / 5);
    else if(drag.y > bot - zona) v = Math.ceil((drag.y - (bot - zona)) / 5);
    if(v){
      if(sc) sc.scrollTop += v; else window.scrollBy(0, v);
      dragPos();
    }
  }
  drag.raf = requestAnimationFrame(dragTick);
}
function dragEnd(ev){
  if(!drag || (ev && ev.pointerId !== undefined && ev.pointerId !== drag.pid)) return;
  cancelAnimationFrame(drag.raf);
  document.removeEventListener('pointermove', dragMove, {passive:false});
  document.removeEventListener('pointerup', dragEnd);
  document.removeEventListener('pointercancel', dragEnd);
  var d = drag;
  drag = null;
  d.item.classList.remove('dragging');
  d.item.style.transform = '';
  document.body.classList.remove('arrastrando');
  var ids = [].slice.call(d.list.querySelectorAll('[data-drag]'))
              .map(function(x){ return x.getAttribute('data-drag'); });
  if(d.movido && DRAG_FIN[d.listId]) DRAG_FIN[d.listId](ids);
}

/* ==================================================================
   RENOMBRAR (v13)
   Cambia solo lo que se ve. El ID no se toca, asi que records, progresion y
   estancados siguen iguales. Queda en el celular al instante y en la planilla
   cuando se guarda la sesion (la columna Ejercicio lleva el nombre nuevo).
   ================================================================== */
var renId = null, renNombre = '', renMusc = '';

function openRenombrar(id){
  renId = id;
  renNombre = nombrePlano(id, draft[id] ? draft[id].name : '');
  renMusc = muscOf(id, draft[id]);
  renderRenombrar();
  openModal();
}
function renderRenombrar(){
  var def = exDef(renId);
  var h = '';
  h += '<div class="mttl"><h3>Renombrar ejercicio</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';
  h += '<div class="hint" style="margin-bottom:14px">Tu historial y tus r&eacute;cords <b>no se tocan</b>: '+
       'la app reconoce cada ejercicio por un c&oacute;digo interno, no por el nombre.</div>';
  h += '<div class="fl kick" style="margin-bottom:5px">Nombre</div>'+
       '<input type="text" id="ren-n" value="'+esc(renNombre)+'" oninput="renNombre=this.value" style="margin-bottom:16px">';
  /* los del catalogo ya tienen musculo fijo; los cargados a mano lo pueden corregir */
  if(!def || def.custom){
    h += '<div class="fl kick" style="margin-bottom:6px">M&uacute;sculo</div><div class="musc-grow">';
    MORDER.forEach(function(m){

  }
  h += '<button class="btn btn-p btn-full" onclick="guardarNombre()">Guardar</button>';
  if(def && !def.custom && nombrePlano(renId) !== def.p){
    h += '<button class="btn btn-o btn-full" style="margin-top:8px" onclick="restaurarNombre()">Volver al nombre original</button>';
  }

/* solo cambia clases: re-renderizar borraria el nombre que se esta escribiendo */
function setRenMusc(m){
  renMusc = m;
  var bs = document.querySelectorAll('#modal-box .musc-btn');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.m === m);

function guardarNombre(){
  var n = (renNombre||'').trim();
  if(!n){ toast('Escrib&iacute; un nombre','err'); return; }
  var def = exDef(renId);
  var map = nombresLocal();
  map[renId] = n;
  try{ localStorage.setItem('gym_nombres', JSON.stringify(map)); }catch(e){}
  if(!def || def.custom){
    /* si el musculo elegido es el mismo que delata el nombre, no fijo nada:
       asi un renombre futuro lo vuelve a deducir */
    var mm = muscLocal();
    if(renMusc && renMusc !== muscPorNombre(n)) mm[renId] = renMusc; else delete mm[renId];
    try{ localStorage.setItem('gym_musc', JSON.stringify(mm)); }catch(e){}
  }
  if(draft[renId]){ draft[renId].name = n; draftDirty = true; }
  closeModal();
  render();
  toast('Renombrado &middot; guard&aacute; la sesi&oacute;n para que quede en la planilla','ok');
}
function restaurarNombre(){
  var def = exDef(renId);
  if(!def) return;
  renNombre = def.p;
  guardarNombre();
}

  var cHoy = cardioList().filter(function(c){ return c.date === curDate; });
