<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E14">
<!-- Safari en iOS cachea el HTML con ganas: sin esto, despues de subir una version nueva
     el celular sigue corriendo la vieja por horas. Ver APP_VER mas abajo. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gym Bro</title>
<meta name="apple-mobile-web-app-title" content="Gym Bro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%232BE08A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%230E0E14'/%3E%3Cg fill='url(%23g)'%3E%3Crect x='3' y='13' width='3' height='6' rx='1.3'/%3E%3Crect x='6.5' y='10' width='4' height='12' rx='1.6'/%3E%3Crect x='10.5' y='14.4' width='11' height='3.2' rx='1.4'/%3E%3Crect x='21.5' y='10' width='4' height='12' rx='1.6'/%3E%3Crect x='26' y='13' width='3' height='6' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%232BE08A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%230E0E14'/%3E%3Cg fill='url(%23g)'%3E%3Crect x='3' y='13' width='3' height='6' rx='1.3'/%3E%3Crect x='6.5' y='10' width='4' height='12' rx='1.6'/%3E%3Crect x='10.5' y='14.4' width='11' height='3.2' rx='1.4'/%3E%3Crect x='21.5' y='10' width='4' height='12' rx='1.6'/%3E%3Crect x='26' y='13' width='3' height='6' rx='1.3'/%3E%3C/g%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@300;400;500;600;700&family=Asap+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0E0E14; --surface:#16161F; --surface2:#1D1D28; --surface3:#24242F;
  --border:#2A2A38; --hairline:#22222E;
  --text:#ECECF2; --muted:#8A8A9C; --dim:#5E5E70;
  --violet:#7C5CFF; --violet-2:#9D85FF; --violet-lt:rgba(124,92,255,.14);
  --green:#2BE08A; --green-2:#5BEDA8; --green-lt:rgba(43,224,138,.13);
  --cyan:#3BE0D0; --cyan-2:#6BEBDE; --cyan-lt:rgba(59,224,208,.13);
  --red:#FF4D5E; --red-lt:rgba(255,77,94,.13);
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Asap',system-ui,sans-serif}
body{min-height:100vh;font-size:15px;line-height:1.45;padding-bottom:40px}
.kick{font-family:'Asap Condensed','Asap',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;z-index:900;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.lg-mark{width:78px;height:78px;border-radius:22px;margin-bottom:26px;
  background:linear-gradient(135deg,var(--violet),var(--green));
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(124,92,255,.35)}
.lg-mark svg{width:46px;height:46px;fill:#0E0E14}
.lg-t{font-size:2rem;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}
.lg-s{color:var(--muted);font-size:.95rem;max-width:300px;margin-bottom:32px}
.btn-g{display:flex;align-items:center;gap:11px;background:#fff;color:#1a1a1a;font-weight:600;
  font-size:.95rem;padding:13px 26px;border-radius:11px;transition:transform .15s,box-shadow .15s}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn-g svg{width:19px;height:19px}

#loader{position:fixed;inset:0;z-index:950;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--violet);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- SHELL ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:300;background:rgba(14,14,20,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.h-l{display:flex;align-items:center;gap:11px;min-width:0}
.h-mark{width:33px;height:33px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--violet),var(--green));
  display:flex;align-items:center;justify-content:center}
.h-mark svg{width:21px;height:21px;fill:#0E0E14}
.h-t{font-size:1.05rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.h-d{font-size:.66rem;color:var(--dim);font-family:'Asap Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.1em}
.h-r{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;transition:.15s}
.ibtn:hover{border-color:var(--violet);color:var(--violet-2)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

#offline{background:var(--red-lt);border-bottom:1px solid rgba(255,77,94,.3);
  padding:11px 16px;display:flex;align-items:center;gap:11px}
#offline.hide{display:none}
#offline svg{flex:0 0 auto;width:18px;height:18px;stroke:var(--red);stroke-width:2;fill:none}
#offline p{font-size:.82rem;color:#FFA8B1;flex:1;line-height:1.35}
#offline b{color:var(--red)}
#offline button{flex:0 0 auto;background:var(--red);color:#fff;border-radius:9px;
  padding:9px 15px;font-size:.8rem;font-weight:700;min-height:38px;
  font-family:'Asap Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase}
nav.tabs{position:sticky;top:57px;z-index:290;background:var(--bg);
  border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:76px;padding:13px 10px 11px;font-family:'Asap Condensed',sans-serif;
  font-size:.76rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--muted)}
.tab.on{color:var(--violet-2);border-bottom-color:var(--violet)}

main{padding:20px 16px 30px;max-width:940px;margin:0 auto}
.panel{display:none;animation:pin .3s ease}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ptitle{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;margin-bottom:3px}
.psub{font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec .bar{width:3px;height:16px;border-radius:2px;background:var(--violet)}
.sec h3{font-size:1rem;font-weight:700;letter-spacing:-.02em}
.sec .cnt{margin-left:auto;font-family:'Asap Condensed',sans-serif;font-size:.7rem;
  letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* ---------- INPUTS ---------- */
/* 16px NO es capricho: iOS Safari hace auto-zoom al enfocar un input con letra mas
   chica, y despues hay que achicar la pantalla con los dedos a mano. Es el minimo
   que evita ese zoom. No usar user-scalable=no para taparlo: rompe el zoom manual. */
input[type=date],input[type=time],input[type=number],input[type=text],textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  font-size:16px;color:var(--text);outline:none;transition:.15s;width:100%}
/* 44px: alto minimo comodo para el dedo, y deja todos los campos parejos entre si */
input[type=number],input[type=text]{min-height:44px}
input:focus,textarea:focus{border-color:var(--violet);background:var(--surface3)}

/* iOS Safari renderiza date y time con su propio widget: fondo gris, texto centrado y
   altura distinta al resto. appearance:none lo desactiva y el pseudo-elemento
   ::-webkit-date-and-time-value alinea el texto a la izquierda como en los demas campos. */
input[type=date],input[type=time]{
  -webkit-appearance:none;appearance:none;
  color-scheme:dark;min-height:44px;line-height:1.2;
  font-family:inherit;font-size:16px;font-weight:500;
  display:flex;align-items:center;text-align:left}
input[type=date]::-webkit-date-and-time-value,
input[type=time]::-webkit-date-and-time-value{
  text-align:left;margin:0;min-height:1.2em}
input[type=date]::-webkit-calendar-picker-indicator,
input[type=time]::-webkit-calendar-picker-indicator{
  filter:invert(.65);opacity:.7;cursor:pointer;margin-left:auto}
input[type=date]::-webkit-inner-spin-button,
input[type=time]::-webkit-inner-spin-button{display:none;-webkit-appearance:none}
/* en la fila de fecha de Entrenar el campo no ocupa todo el ancho */
.daterow input[type=date]{width:auto;min-width:158px}
.daterow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- EJERCICIO ---------- */
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;transition:.18s}
.ex.done{border-color:rgba(43,224,138,.4);background:linear-gradient(90deg,var(--green-lt),transparent 55%)}
/* --- tarjeta de ejercicio: colapsada por defecto --- */
.ex-head{display:flex;align-items:center;gap:11px;padding:2px 0}
.ex-ttl{flex:1;min-width:0;text-align:left;font-size:.94rem;font-weight:600;line-height:1.3;
  letter-spacing:-.01em;padding:9px 0;color:var(--text);display:block}
/* resumen de lo cargado, visible con el bloque cerrado */
.ex-res{display:block;margin-top:3px;font-family:'Asap Condensed',sans-serif;font-size:.74rem;
  font-weight:700;letter-spacing:.07em;color:var(--muted);font-variant-numeric:tabular-nums}
.ex.done .ex-res{color:var(--green-2)}
.ex.open .ex-res{display:none}
.ex-chev{flex:0 0 auto;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.ex-chev svg{width:17px;height:17px;stroke:var(--dim);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.ex.open .ex-chev svg{transform:rotate(180deg);stroke:var(--violet-2)}
.ex.open{border-color:var(--violet)}
.ex.done.open{border-color:rgba(43,224,138,.5)}
.ex-det{padding-top:4px;margin-top:8px;border-top:1px solid var(--hairline)}
.ex-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 4px}
.ex-top{display:flex;align-items:flex-start;gap:11px}

/* --- RIR: reps en reserva --- */
.rirbox{display:flex;align-items:center;gap:10px;margin-top:11px;padding-left:42px;flex-wrap:wrap}
.rirlbl{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.12em;color:var(--dim);display:flex;align-items:center;gap:5px}
.rirq{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;
  border-radius:50%;border:1px solid var(--border);font-size:.62rem;cursor:pointer}
.rirpills{display:flex;gap:5px;flex:1}
.rirp{flex:1;min-width:0;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);color:var(--dim);font-size:.85rem;font-weight:600;transition:.15s}
.rirp.on{background:var(--violet);border-color:var(--violet);color:#fff}

/* --- timer de descanso --- */
.restbox{margin-top:11px;padding-left:42px}
.restbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:40px;border-radius:10px;border:1px dashed var(--border);background:transparent;
  color:var(--muted);font-family:'Asap Condensed',sans-serif;font-size:.8rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;transition:.15s;font-variant-numeric:tabular-nums}
.restbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.restbtn.corriendo{border-style:solid;border-color:var(--cyan);color:var(--cyan);
  background:var(--cyan-lt);font-size:1.05rem}
.restbtn.listo{border-style:solid;border-color:var(--green);color:var(--green-2);
  background:var(--green-lt)}
.chk{flex:0 0 auto;width:32px;height:32px;border-radius:9px;border:2px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
.chk svg{width:17px;height:17px;stroke:#0E0E14;stroke-width:3.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on svg{opacity:1}
.ex-body{flex:1;min-width:0}
.ex-n{font-size:.94rem;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.gpill{display:inline-block;font-family:'Asap Condensed',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-top:4px}
.gpill.superior{background:var(--violet-lt);color:var(--violet-2)}
.gpill.medio{background:var(--green-lt);color:var(--green-2)}
.gpill.inferior{background:var(--cyan-lt);color:var(--cyan-2)}
.ex-acts{flex:0 0 auto;display:flex;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:.15s}
.iconbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.iconbtn.yt:hover{border-color:var(--red);color:var(--red)}
.iconbtn.rm:hover{border-color:var(--red);color:var(--red)}

/* grid en vez de flex-wrap: con 3 columnas fijas nunca se parte en dos lineas,
   sin importar el ancho de pantalla ni el tamano de los controles */
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:11px;padding-left:42px}
.fld{display:flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:3px 8px 3px 4px;min-width:0}
.fld input{flex:1 1 auto;width:100%;min-width:0;background:transparent;border:none;padding:9px 2px;
  text-align:center;font-size:16px;font-weight:600;min-height:38px}
.fld input:focus{background:transparent;border:none}
.fld span{font-family:'Asap Condensed',sans-serif;font-size:.68rem;font-weight:700;
  letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.xsep{display:none}
.lastline{margin-top:9px;padding-left:42px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.meta{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;letter-spacing:.05em;
  color:var(--dim);text-transform:uppercase}
.meta b{color:var(--muted);font-weight:700}
.sug{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:8px 12px;border-radius:20px;transition:.15s;min-height:32px;
  display:inline-flex;align-items:center}
.sug.up{background:var(--green-lt);color:var(--green-2)}
.sug.same{background:var(--surface3);color:var(--muted)}
.sug:hover{filter:brightness(1.3)}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;
  border-radius:11px;font-weight:600;font-size:.94rem;transition:.16s;border:1px solid transparent}
.btn-p{background:var(--violet);color:#fff}
.btn-p:hover{background:var(--violet-2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.32)}
.btn-p:disabled{opacity:.5;transform:none;box-shadow:none;cursor:default}
.btn-o{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-o:hover{border-color:var(--violet);color:var(--violet-2)}
.btn-dash{background:transparent;border:1px dashed var(--border);color:var(--muted);width:100%}
.btn-dash:hover{border-color:var(--violet);color:var(--violet-2);border-style:solid}
.btn-full{width:100%}
.btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- PILLS / TOGGLES ---------- */
.pills{display:inline-flex;background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:3px;gap:2px}
.pill{padding:10px 15px;border-radius:18px;min-height:36px;font-family:'Asap Condensed',sans-serif;font-size:.72rem;
  font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:.15s}
.pill:hover{color:var(--muted)}
.pill.on{background:var(--violet);color:#fff}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 15px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet)}
.kpi.g::before{background:var(--green)}
.kpi.c::before{background:var(--cyan)}
.kpi.x::before{background:var(--border)}
.kpi .kl{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.kpi .kv{font-size:1.75rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .kf{font-family:'Asap Condensed',sans-serif;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}

/* ---------- MACROS ---------- */
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.macro{background:var(--surface2);border-radius:var(--r);padding:14px 12px;text-align:center;
  border:1px solid var(--border)}
.macro .mv{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.macro .ml{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:3px}
.macro.p .mv{color:var(--violet-2)} .macro.g .mv{color:var(--green-2)} .macro.c .mv{color:var(--cyan)}
.simple{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;margin-bottom:7px;transition:.15s}
.simple.done{border-color:rgba(43,224,138,.35)}
.simple .sb{flex:1;min-width:0}
.simple .sn{font-size:.9rem;font-weight:500}
.simple .ss{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:1px}

/* ---------- HISTORIAL ---------- */
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:9px;overflow:hidden;transition:.15s}
.hcard.open{border-color:var(--violet)}
.hhead{display:flex;align-items:center;gap:13px;padding:13px 14px;width:100%;text-align:left}
.hbadge{flex:0 0 auto;width:40px;height:40px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;background:var(--violet-lt);color:var(--violet-2);line-height:1}
.hbadge .d{font-size:1.05rem;font-weight:700}
.hbadge .m{font-family:'Asap Condensed',sans-serif;font-size:.55rem;font-weight:700;

.hb{flex:1;min-width:0}
.hd{font-size:.92rem;font-weight:600;text-transform:capitalize}
.hm{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin-top:1px}
.hchev{flex:0 0 auto;width:16px;height:16px;stroke:var(--dim);stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round;transition:.2s}
.hcard.open .hchev{transform:rotate(180deg);stroke:var(--violet-2)}
.hdet{border-top:1px solid var(--hairline);padding:4px 14px 14px}
.hnote{font-size:.82rem;color:var(--muted);font-style:italic;padding:10px 0 4px;line-height:1.4}
.hex{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hairline)}
.hex:last-child{border-bottom:none}
.hdot{flex:0 0 auto;width:7px;height:7px;border-radius:50%}
.hdot.superior{background:var(--violet)} .hdot.medio{background:var(--green)} .hdot.inferior{background:var(--cyan)}
.hdot.cardio{background:var(--green)}
/* --- cardio --- */
.hcard.cardio.open{border-color:var(--green)}
.hcard.cardio .hchev{stroke:var(--dim)}
.hcard.cardio.open .hchev{stroke:var(--green-2)}
.hbadge.cardio{background:var(--green-lt);color:var(--green-2)}
.hbadge.cardio svg{width:19px;height:19px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.hex-n{flex:1;min-width:0;font-size:.86rem}
.hex-v{flex:0 0 auto;font-family:'Asap Condensed',sans-serif;font-size:.76rem;font-weight:700;
  letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- CALENDARIO ---------- */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calhead .mname{font-size:1.05rem;font-weight:700;letter-spacing:-.02em;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.caldow{text-align:center;font-family:'Asap Condensed',sans-serif;font-size:.6rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-bottom:6px}
.calday{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:.85rem;color:var(--dim);border:1px solid transparent;
  font-variant-numeric:tabular-nums;transition:.15s;position:relative}
.calday.out{opacity:.25}
.calday.today{border-color:var(--border);color:var(--text)}
.calday.hit{background:var(--violet-lt);color:var(--violet-2);font-weight:700;border-color:var(--violet)}
.calday.hit:hover{background:var(--violet);color:#fff}
.calday.onlycardio{background:var(--green-lt);color:var(--green-2);border-color:var(--green)}
.calday.onlycardio:hover{background:var(--green);color:#0E0E14}
.calday .bubs{display:flex;gap:3px;margin-top:3px}
.bub{width:5px;height:5px;border-radius:50%;background:var(--violet-2);display:inline-block;flex:0 0 auto}
.bub.cardio{background:var(--green-2)}
.callegend{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:center}

/* ---------- TABLA ---------- */
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{background:var(--surface2);font-family:'Asap Condensed',sans-serif;font-size:.66rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:10px;text-align:left;
  border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
.empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:.9rem}
.chartbox{position:relative;height:260px}
.hint{font-size:.82rem;color:var(--muted);line-height:1.5}

body.modal-open{position:fixed;width:100%;overflow:hidden}
#modal-ov{position:fixed;inset:0;z-index:700;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);

#modal-ov.open{display:flex}
#modal-box{background:var(--surface);border:1px solid var(--border);border-radius:18px 18px 0 0;

@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.mttl{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mttl h3{font-size:1.15rem;font-weight:700;letter-spacing:-.03em}
.mx{font-size:1.2rem;color:var(--dim);padding:8px 12px;min-height:38px;min-width:38px}
.mx:hover{color:var(--text)}
.catlist{max-height:230px;overflow-y:auto;margin-bottom:6px}
.catitem{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:10px;width:100%;

.catitem:hover{background:var(--surface2);border-color:var(--border)}
.catitem .cn{flex:1;min-width:0;font-size:.89rem}
.catitem .cs{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.07em;color:var(--dim)}
/* sugerencias para compensar musculos flojos */
.sugbox{background:var(--green-lt);border:1px solid rgba(43,224,138,.3);border-radius:var(--r);

.sug-item{align-items:flex-start}
.sug-item:hover{background:rgba(43,224,138,.12);border-color:var(--green)}
.sug-item .cn{line-height:1.3}
/* barras de balance semanal por musculo */
.mrow{margin-bottom:12px}
.mtop{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;gap:8px}
.mname2{font-family:'Asap Condensed',sans-serif;font-size:.74rem;font-weight:700;

.mval{font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:700;

.mbar{position:relative;height:10px;border-radius:5px;background:var(--surface3);overflow:hidden}
.mbar .zona{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.05);

.mbar .fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px}
.mfill-bajo{background:var(--red)} .mfill-ok{background:var(--green)} .mfill-alto{background:var(--cyan)}

.metabox{display:flex;align-items:center;justify-content:space-between;gap:14px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface2);
  border:1px solid var(--border);border-radius:12px;padding:4px;flex:0 0 auto}
.stbtn{width:40px;height:40px;border-radius:9px;background:var(--surface3);color:var(--text);
  font-size:1.25rem;font-weight:600;line-height:1;transition:.15s;
  display:flex;align-items:center;justify-content:center}
.stbtn:hover:not(:disabled){background:var(--violet);color:#fff}
.stbtn:disabled{opacity:.3;cursor:default}
.stval{min-width:34px;text-align:center;font-size:1.3rem;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);

  font-weight:700;letter-spacing:.06em}
.chip b{font-variant-numeric:tabular-nums}
.chip.viejo{background:var(--red-lt);border-color:rgba(255,77,94,.4);color:#FFA8B1}
.chip.ok{color:var(--muted)}
.mdiv{display:flex;align-items:center;gap:11px;margin:16px 0 13px}
.mdiv::before,.mdiv::after{content:'';flex:1;height:1px;background:var(--border)}
.mdiv span{font-family:'Asap Condensed',sans-serif;font-size:.64rem;font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.grow{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.gbtn{padding:10px 6px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);
  font-family:'Asap Condensed',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:.09em;

.gbtn.on{background:var(--violet);border-color:var(--violet);color:#fff}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.f3 .fl{font-family:'Asap Condensed',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:.13em;

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,100px);z-index:800;

#toast.show{transform:translate(-50%,0);opacity:1}
#toast.ok{border-color:var(--green);color:var(--green-2)}
#toast.err{border-color:var(--red);color:#FFA8B1}

@media(min-width:720px){

  main{padding:28px 32px 40px}
  .ptitle{font-size:1.95rem}
  #modal-ov{align-items:center;padding:24px}

}

/* ==================================================================
   UTILS
   ================================================================== */
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function jsq(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

var MESES  = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAS   = ['domingo','lunes','martes','mi&eacute;rcoles','jueves','viernes','s&aacute;bado'];
var DOW    = ['Lun','Mar','Mi&eacute;','Jue','Vie','S&aacute;b','Dom'];

function parseISO(s){ var p=String(s||'').split('-'); return new Date(+p[0],(+p[1])-1,+p[2]); }
function fDate(s){ var d=parseISO(s); return isNaN(d)?s:DIAS[d.getDay()]+' '+d.getDate()+' '+MESESL[d.getMonth()]; }
function fShort(s){ var d=parseISO(s); return isNaN(d)?s:d.getDate()+' '+MESES[d.getMonth()]; }
function monday(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekKey(iso){ return isoOf(monday(parseISO(iso))); }
function monthKey(iso){ return String(iso).slice(0,7); }

function slug(s){
  /* pasa a minusculas, saca acentos y deja solo a-z 0-9 separados por guiones.
     Hecho a mano char por char para no meter acentos ni escapes en el archivo. */
  var t = String(s||'').toLowerCase(), o = '';
  for(var i=0;i<t.length;i++){
    var c = t.charCodeAt(i);
    if((c>=97 && c<=122) || (c>=48 && c<=57)) o += t.charAt(i);
    else if(c>=224 && c<=229) o += 'a';
    else if(c>=232 && c<=235) o += 'e';
    else if(c>=236 && c<=239) o += 'i';
    else if(c>=242 && c<=246) o += 'o';
    else if(c>=249 && c<=252) o += 'u';
    else if(c===241) o += 'n';
    else o += '-';
  }
  while(o.indexOf('--')!==-1) o = o.split('--').join('-');
  if(o.charAt(0)==='-') o = o.substring(1);
  if(o.charAt(o.length-1)==='-') o = o.substring(0,o.length-1);
  return o.substring(0,40);
}
function nf(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
/* hasta 2 decimales: Diego carga pesos como 11,25 kg y redondear a 1 decimal
   los mostraba como 11,3, que no es lo que cargo. */
function fKg(v){ var n=parseFloat(v); return isNaN(n)?'':(Math.round(n*100)/100).toString().replace('.',','); }
/* distancias: 2 decimales, como los muestra la app Fitness */
function fKm(v){ var n=parseFloat(v); return isNaN(n)?'':n.toFixed(2).replace('.',','); }
function fInt(v){ return Math.round(nf(v)).toLocaleString('es-AR'); }

function toast(msg,type){
  var el=$('toast'); el.innerHTML=msg; el.className=(type||'')+' show';
  clearTimeout(el._t); el._t=setTimeout(function(){ el.className=el.className.replace('show',''); },3200);
}

/* catalogo completo: rutina base + sugerencias + lo que Diego haya creado a mano */
function allKnown(){
  var out = {};
  RUTINA_BASE.concat(CATALOGO).forEach(function(e){ out[e.id]=e; });
  if(D && D.sessions){
    D.sessions.forEach(function(s){
      (s.order||Object.keys(s.items)).forEach(function(id){
        if(out[id]) return;
        var it=s.items[id]; if(!it) return;
        out[id] = {id:id, n:esc(it.name), p:it.name, g:it.group||'superior',
                   s:nf(it.series)||3, r:nf(it.reps)||12, custom:true};
      });
    });
  }
  return out;
}
function exDef(id){ return allKnown()[id] || null; }
function dispName(id, fallback){
  var e = exDef(id);
  return e ? e.n : esc(fallback||id);
}

/* ==================================================================
   PROGRESION
   ================================================================== */
function lastRecord(exId){
  if(!D || !D.sessions) return null;
  for(var i=0;i<D.sessions.length;i++){
    /* solo sesiones ANTERIORES: al editar una del 25/08 no tiene sentido que el
       "ultimo" y la sugerencia salgan de una del 31/08 */
    if(D.sessions[i].date >= curDate) continue;
    var it = D.sessions[i].items[exId];
    if(it && it.weight!=='' && !isNaN(parseFloat(it.weight))){
      return {weight:parseFloat(it.weight), series:it.series, reps:it.reps,
              done:it.done===true, date:D.sessions[i].date};
    }
  }
  return null;
}
function suggest(rec){
  if(!rec) return null;
  if(!rec.done) return {v:rec.weight, up:false};
  var v = Math.round(rec.weight*1.05*2)/2;
  if(v < rec.weight+0.5) v = rec.weight+0.5;
  return {v:v, up:true};
}

/* ==================================================================
   VOLUMEN / ESTADISTICAS
   ================================================================== */
/* volumen de un item = peso x series x reps  (0 si no hay peso cargado) */
function itemVol(it){ return nf(it.weight) * nf(it.series) * nf(it.reps); }
function itemReps(it){ return nf(it.series) * nf(it.reps); }

/* porGrupo guarda las TRES metricas por tren, no solo el volumen: el trabajo de peso
   corporal (oblicuos, captain chair) suma 0 kg pero si suma series y reps. */
function statsOf(sessions){
  var g0 = function(){ return {vol:0, series:0, reps:0}; };
  var o = {vol:0, series:0, reps:0, ses:sessions.length,
           porGrupo:{superior:g0(), medio:g0(), inferior:g0()}};
  sessions.forEach(function(s){
    for(var id in s.items){
      var it = s.items[id];
      if(!it.done) continue;
      var v = itemVol(it), r = itemReps(it), se = nf(it.series);
      var g = it.group || 'superior';
      if(!o.porGrupo[g]) g = 'superior';
      o.vol += v; o.series += se; o.reps += r;
      o.porGrupo[g].vol += v;
      o.porGrupo[g].series += se;
      o.porGrupo[g].reps += r;
    }
  });
  return o;
}

/* ==================================================================
   BALANCE POR MUSCULO
   La base de las sugerencias y de los KPIs utiles de Progreso.
   ================================================================== */
/* musculo de un ejercicio: el del catalogo, o derivado del tren si es uno cargado a mano */
function muscOf(id, it){
  var e = exDef(id);
  if(e && e.m) return e.m;
  var g = (it && it.group) || (e && e.g) || 'superior';
  return g==='medio' ? 'core' : (g==='inferior' ? 'piernas' : 'espalda');
}

/* Por cada musculo: series de la semana en curso, series por semana promedio,
   dias desde la ultima vez y total historico. */
function muscleStats(){
  var out = {};
  MORDER.forEach(function(m){ out[m] = {sem:0, dias:null, ult:'', total:0, semanas:{}}; });

  var ss = (D && D.sessions) ? D.sessions : [];
  var wkNow = weekKey(todayISO());
  var hoy = parseISO(todayISO());

  ss.forEach(function(s){
    var wk = weekKey(s.date);
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it = s.items[id];
      if(!it || !it.done) return;
      var m = muscOf(id, it);
      if(!out[m]) return;
      var ser = nf(it.series);
      out[m].total += ser;
      out[m].semanas[wk] = (out[m].semanas[wk]||0) + ser;
      if(wk === wkNow) out[m].sem += ser;
      if(!out[m].ult || s.date > out[m].ult) out[m].ult = s.date;
    });
  });

  MORDER.forEach(function(m){
    var o = out[m];
    if(o.ult) o.dias = Math.round((hoy - parseISO(o.ult)) / 86400000);
    var ks = Object.keys(o.semanas);
    o.prom = ks.length ? Math.round(o.semanas[ks.sort()[ks.length-1]]) : 0;
  });
  return out;
}

/* Ordena los musculos del mas descuidado al mas trabajado.
   Pesa lo que falta para el minimo semanal y los dias sin tocarlo. */
function muscleGaps(){
  var st = muscleStats();
  var arr = MORDER.map(function(m){
    var o = st[m];
    var falta = Math.max(0, SERIES_MIN - o.sem);
    var dias = (o.dias === null) ? 60 : Math.min(o.dias, 60);
    return {m:m, sem:o.sem, dias:o.dias, total:o.total, falta:falta,
            score: falta * 10 + dias * 2};
  });
  arr.sort(function(a,b){ return b.score - a.score; });
  return arr;
}

/* Ejercicios que vienen con el mismo peso varias sesiones seguidas */
function estancados(minSes){
  minSes = minSes || 4;
  var ss = (D && D.sessions) ? D.sessions : [];
  var asc = ss.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var hist = {};
  asc.forEach(function(s){
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it = s.items[id];
      if(!it || !it.done || !nf(it.weight)) return;
      (hist[id] = hist[id] || []).push({d:s.date, w:nf(it.weight), name:it.name});
    });
  });
  var out = [];
  for(var id in hist){
    var a = hist[id], last = a[a.length-1].w, n = 0;
    for(var i=a.length-1; i>=0; i--){ if(a[i].w === last) n++; else break; }
    if(n >= minSes) out.push({id:id, name:a[0].name, w:last, n:n, desde:a[a.length-n].d});
  }
  out.sort(function(a,b){ return b.n - a.n; });
  return out;
}

               '<button class="iconbtn rm" onclick="removeEx(\''+id+'\')" title="Sacar de esta sesi&oacute;n">'+

      h +=     '<div class="fld"><input type="number" step="1" min="0" inputmode="numeric" '+

/* Un ejercicio abierto a la vez. Arrancan todos cerrados: con 11 ejercicios abiertos
   la lista mide varias pantallas y hay que scrollear mucho para encontrar el que toca. */
function toggleOpen(id){
  openEx = (openEx===id) ? null : id;
  pararDescanso();
  buildTrain();
  if(openEx){
    setTimeout(function(){
      var el = $('ex-'+openEx);
      if(el) el.scrollIntoView({block:'nearest'});
    }, 30);
  }
}
function setRir(id,v){
  if(!draft[id]) return;
  draft[id].rir = (draft[id].rir===v) ? '' : v;   /* volver a tocar lo saca */
  draftDirty = true;
  buildTrain();
}
/* descanso sugerido del ejercicio, con lo que Diego haya elegido para el si lo cambio */
function restDe(id){
  var e = exDef(id);
  var base = (e && e.d) ? e.d : 90;
  try{
    var v = parseInt(localStorage.getItem('gym_rest_'+id)||'', 10);
    if(v>0) return v;
  }catch(err){}
  return base;
}

/* ---- timer de descanso ----
   Se cuenta contra un timestamp, no sumando ticks: en iOS el setInterval se frena
   cuando la pantalla se bloquea, y el descanso quedaria corriendo mal. */
var restTimer = null, audioCtx = null;
function iniciarDescanso(id, seg){
  pararDescanso();
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC && !audioCtx) audioCtx = new AC();   /* crear en el gesto: iOS no deja despues */
  }catch(e){}
  restTimer = { id:id, hasta: Date.now() + seg*1000 };
  restTimer.tick = setInterval(pintarDescanso, 250);
  pintarDescanso();
}
function pararDescanso(termino){
  if(restTimer && restTimer.tick) clearInterval(restTimer.tick);
  if(restTimer && !termino){
    var b = $('rest-btn-'+restTimer.id);
    if(b) b.classList.remove('corriendo');
    var el = $('rest-'+restTimer.id);
    if(el) el.innerHTML = 'Descansar '+fDur(restDe(restTimer.id));
  }
  restTimer = null;
}
function pintarDescanso(){
  if(!restTimer) return;
  var falta = Math.round((restTimer.hasta - Date.now())/1000);
  var el = $('rest-'+restTimer.id), b = $('rest-btn-'+restTimer.id);
  if(!el){ pararDescanso(); return; }          /* se cerro el ejercicio */
  if(falta > 0){
    el.textContent = fDur(falta);
    if(b) b.classList.add('corriendo');
    return;
  }
  el.innerHTML = 'Listo &middot; a la siguiente';
  if(b){ b.classList.remove('corriendo'); b.classList.add('listo'); }
  beep();
  var idFin = restTimer.id;
  pararDescanso(true);
  setTimeout(function(){
    var e2=$('rest-'+idFin), b2=$('rest-btn-'+idFin);
    if(e2) e2.innerHTML = 'Descansar '+fDur(restDe(idFin));
    if(b2) b2.classList.remove('listo');
  }, 6000);
}
function beep(){
  try{
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    [0, 0.22].forEach(function(t){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type='sine'; o.frequency.value=880;
      var t0=audioCtx.currentTime+t;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
      o.start(t0); o.stop(t0+0.2);
    });
  }catch(e){}
}

function pickDate(v){ if(!v) return; curDate=v; draftDirty=false; openEx=null; pararDescanso(); loadDraft(); buildTrain(); }
function toggleEx(id){ if(draft[id]){ draft[id].done=!draft[id].done; draftDirty=true; buildTrain(); } }
function setF(id,f,v){ if(draft[id]){ draft[id][f]=String(v||'').trim(); draftDirty=true; } }
function applySug(id,v){ if(draft[id]){ draft[id].weight=String(v); draftDirty=true; buildTrain(); } }
function removeEx(id){
  var i=draftOrder.indexOf(id);
  if(i>=0) draftOrder.splice(i,1);
  delete draft[id];
  draftDirty=true;
  buildTrain();
}
function yt(q){ window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' tecnica ejercicio'),'_blank'); }

function sessionFor(date){
  if(!D || !D.sessions) return null;
  for(var i=0;i<D.sessions.length;i++) if(D.sessions[i].date===date) return D.sessions[i];
  return null;
}

/* arma el borrador: la sesion guardada de esa fecha, o la rutina base */
function loadDraft(){
  draft={}; draftOrder=[]; notesDraft='';
  var s = sessionFor(curDate);
  if(s){
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it=s.items[id]; if(!it) return;
      draft[id]={name:it.name, group:it.group||'superior', weight:it.weight||'',
                 series:it.series||'', reps:it.reps||'', rir:it.rir||'', done:it.done===true};
      draftOrder.push(id);
    });
    notesDraft = s.notes||'';
  } else {
    RUTINA_BASE.forEach(function(e){
      draft[e.id]={name:e.p, group:e.g, weight:'', series:String(e.s), reps:String(e.r), rir:'', done:false};
      draftOrder.push(e.id);
    });
  }
}

/* ---------------- MODAL: AGREGAR EJERCICIO ---------------- */
function openAdd(){
  newGroup='superior';
  newEx = {name:'', w:'', s:'3', r:'12'};
  renderAdd('');
  openModal();
}
/* con el modal abierto se bloquea el scroll del fondo: si no, al llegar al final del
   modal el gesto sigue scrolleando la pagina de atras */
var _scrollY = 0;
function openModal(){
  _scrollY = window.scrollY;
  document.body.classList.add('modal-open');
  document.body.style.top = (-_scrollY)+'px';
  $('modal-ov').classList.add('open');
}
function closeModal(){
  $('modal-ov').classList.remove('open');
  document.body.classList.remove('modal-open');
  document.body.style.top = '';
  window.scrollTo(0, _scrollY);
}

function renderAdd(q){
  var known = allKnown();
  var term = slug(q);
  var list = [];
  for(var id in known){
    if(draftOrder.indexOf(id)!==-1) continue;          // ya esta en la sesion
    var e = known[id];
    if(term && slug(e.p).indexOf(term)===-1) continue;
    list.push(e);
  }
  /* el catalogo se ordena por musculo mas descuidado primero, y alfabetico dentro de cada uno */
  var prio = {};
  muscleGaps().forEach(function(gp, i){ prio[gp.m] = i; });
  list.sort(function(a,b){
    var pa = prio[a.m] === undefined ? 99 : prio[a.m];
    var pb = prio[b.m] === undefined ? 99 : prio[b.m];
    if(pa !== pb) return pa - pb;
    return a.p<b.p ? -1 : 1;
  });

  var h='';
  h += '<div class="mttl"><h3>Agregar ejercicio</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';

  /* --- sugerencias para compensar lo que viene flojo --- */
  if(!term){
    var gaps = muscleGaps().filter(function(x){ return x.falta > 0 || x.dias === null || x.dias >= 7; });
    var sug = [];
    gaps.forEach(function(gp){
      if(sug.length >= 3) return;
      var yaHay = false;
      draftOrder.forEach(function(id){ if(muscOf(id, draft[id]) === gp.m) yaHay = true; });
      if(yaHay) return;
      /* del catalogo completo, el primero de ese musculo que no este en la sesion */
      for(var id in known){
        if(sug.length >= 3) break;
        if(draftOrder.indexOf(id) !== -1) continue;
        var e = known[id];
        if(e.m !== gp.m) continue;
        sug.push({e:e, gap:gp});
        break;
      }
    });

    if(sug.length){
      h += '<div class="sugbox">';
      h += '<div class="kick" style="color:var(--green-2);margin-bottom:9px">Te falta trabajar esto</div>';
      sug.forEach(function(x){
        var motivo = (x.gap.dias === null) ? 'nunca lo hiciste'
                   : (x.gap.dias >= 7 ? 'hace ' + x.gap.dias + ' d&iacute;as'
                                      : x.gap.sem + '/' + SERIES_MIN + ' series esta semana');
        h += '<button class="catitem sug-item" onclick="addFromCat(\''+x.e.id+'\')">'+
             '<span class="hdot '+x.e.g+'"></span>'+
             '<span class="cn">'+x.e.n+'<br><span class="cs" style="color:var(--green-2)">'+
             MUSCULOS[x.gap.m].lbl+' &middot; '+motivo+'</span></span>'+
             '<span class="cs">'+x.e.s+'x'+x.e.r+'</span></button>';
      });
      h += '</div>';
    }
  }

  h += '<input type="text" id="add-q" placeholder="Buscar..." value="'+esc(q)+'" oninput="renderAdd(this.value)" style="margin-bottom:12px">';

  h += '<div class="catlist">';
  if(!list.length){
    h += '<div class="empty" style="padding:18px">Sin resultados. Cargalo a mano abajo.</div>';
  } else {
    list.slice(0,40).forEach(function(e){
      h += '<button class="catitem" onclick="addFromCat(\''+e.id+'\')">'+
           '<span class="hdot '+e.g+'"></span>'+
           '<span class="cn">'+e.n+'</span>'+
           '<span class="cs">'+e.s+'x'+e.r+'</span></button>';
    });
  }
  h += '</div>';

  h += '<div class="mdiv"><span>o cargalo a mano</span></div>';
  /* los valores salen de newEx, no del DOM: renderAdd corre en cada tecla del buscador
     y antes eso borraba lo que el usuario ya habia cargado a mano */
  h += '<div style="margin-bottom:12px"><div class="fl kick" style="margin-bottom:5px">Nombre del ejercicio o m&aacute;quina</div>'+
       '<input type="text" id="add-name" placeholder="Ej: Prensa 45 Nautilus" value="'+esc(newEx.name)+'" oninput="newEx.name=this.value"></div>';
  h += '<div class="fl kick" style="margin-bottom:6px">Tren</div><div class="grow">';
  GORDER.forEach(function(g){
    h += '<button class="gbtn tren-btn'+(newGroup===g?' on':'')+'" data-g="'+g+'" onclick="setNewGroup(\''+g+'\')">'+GRUPOS[g].lbl+'</button>';
  });
  h += '</div>';
  h += '<div class="f3">'+
       '<div><div class="fl">Kg</div><input type="number" step="0.5" min="0" inputmode="decimal" id="add-w" placeholder="&mdash;" value="'+esc(newEx.w)+'" oninput="newEx.w=this.value"></div>'+
       '<div><div class="fl">Series</div><input type="number" step="1" min="0" inputmode="numeric" id="add-s" value="'+esc(newEx.s)+'" oninput="newEx.s=this.value"></div>'+
       '<div><div class="fl">Reps</div><input type="number" step="1" min="0" inputmode="numeric" id="add-r" value="'+esc(newEx.r)+'" oninput="newEx.r=this.value"></div>'+
       '</div>';
  h += '<button class="btn btn-p btn-full" onclick="addCustom()">Agregar a la sesi&oacute;n</button>';

  $('modal-box').innerHTML = h;
  var qi=$('add-q');
  if(qi && q){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); }
}

/* solo cambia clases: re-renderizar aca borraba el nombre y los kg ya cargados */
function setNewGroup(g){
  newGroup=g;
  var bs=document.querySelectorAll('#modal-box .tren-btn');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.g===g);
}

function addFromCat(id){
  var e = allKnown()[id];
  if(!e) return;
  draft[id] = {name:e.p, group:e.g, weight:'', series:String(e.s), reps:String(e.r), rir:'', done:false};
  draftOrder.push(id);
  openEx = id;
  var rec = lastRecord(id);
  if(rec){
    var sg = suggest(rec);
    if(sg) draft[id].weight = String(sg.v);
    if(rec.series) draft[id].series = String(rec.series);
    if(rec.reps) draft[id].reps = String(rec.reps);
  }
  closeModal(); buildTrain();
  toast(e.n+' agregado','ok');
}

function addCustom(){
  var name = (newEx.name||'').trim();
  if(!name){ toast('Escrib&iacute; el nombre del ejercicio','err'); return; }
  var id = 'x-'+slug(name);
  if(!id || id==='x-'){ toast('Nombre inv&aacute;lido','err'); return; }
  if(draftOrder.indexOf(id)!==-1){ toast('Ese ejercicio ya est&aacute; en la sesi&oacute;n','err'); return; }
  if(nf(newEx.w) < 0){ toast('El peso no puede ser negativo','err'); return; }
  draft[id] = {
    name:name, group:newGroup,
    weight:String(newEx.w||'').trim(),
    series:String(newEx.s||'3').trim(),
    reps:String(newEx.r||'12').trim(),
    rir:'', done:false
  };
  draftOrder.push(id);
  openEx = id;
  draftDirty = true;
  closeModal(); buildTrain();
  toast('Agregado &middot; tildalo cuando lo hagas','ok');
}

/* ---------------- GUARDAR ---------------- */
function saveSession(){
  var items={}, order=[];
  var any=false;
  draftOrder.forEach(function(id){
    var st=draft[id]; if(!st) return;
    items[id]={name:st.name, group:st.group, weight:st.weight||'',
               series:st.series||'', reps:st.reps||'', rir:st.rir||'', done:st.done===true};
    order.push(id);
    if(st.done) any=true;
  });
  if(!any){ toast('No marcaste ning&uacute;n ejercicio como hecho','err'); return; }

  var negativos = order.filter(function(id){ return nf(items[id].weight) < 0; });
  if(negativos.length){ toast('Hay pesos negativos: revis&aacute; los kg','err'); return; }

  apiPost('saveSession', {date:curDate, items:items, order:order, notes:notesDraft}, $('btn-save'))
    .then(function(){
      draftDirty = false;
      toast('Sesi&oacute;n guardada &middot; '+fShort(curDate),'ok');
      fetchData(true);
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* ==================================================================
   CARDIO
   Espeja la pantalla de detalle de la app Fitness. Se carga a mano:
   HealthKit no expone los entrenamientos a Atajos (verificado 31/08/2026).
   ================================================================== */
var CARDIO_TIPOS = ['Correr','Andar','Bici','Otro'];

function cardioList(){ return (D && D.cardio) ? D.cardio : []; }

/* duracion en segundos -> "11:10" o "1:05:30" */
function fDur(seg){
  var s = Math.round(nf(seg));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), q = s%60;
  var mm = (h && m<10 ? '0' : '')+m;
  return (h ? h+':' : '') + mm + ':' + (q<10?'0':'') + q;
}
/* ritmo en segundos por km -> "7'50&quot;" */
function fRitmo(segKm){
  var s = Math.round(nf(segKm));
  if(!s) return '';
  return Math.floor(s/60)+'&#39;'+((s%60)<10?'0':'')+(s%60)+'&quot;';
}
function ritmoDe(seg, km){
  var k = nf(km);
  return k>0 ? Math.round(nf(seg)/k) : 0;
}
function cardioStats(list){
  var o = {km:0, seg:0, kcal:0, n:list.length};
  list.forEach(function(c){
    o.km += nf(c.km); o.seg += nf(c.dur); o.kcal += nf(c.kcalTot) || nf(c.kcalAct);
  });
  return o;
}

/* ---- modal de carga ---- */
function openCardio(id){
  var ex = null;
  if(id){ cardioList().forEach(function(c){ if(c.id===id) ex=c; }); }
  if(ex){
    cardioDraft = JSON.parse(JSON.stringify(ex));
    if(!cardioDraft.parciales) cardioDraft.parciales = [];
  } else {
    /* la hora arranca con la actual: es lo que distingue dos corridas del mismo dia,
       y si queda vacia la segunda pisa a la primera */
    var ah = new Date();
    cardioDraft = {
      id:'', date:todayISO(), time:pad(ah.getHours())+':'+pad(ah.getMinutes()), type:'Correr',
      dur:'', km:'', kcalAct:'', kcalTot:'', cadencia:'', desnivel:'', ritmo:'',
      parciales:[], notes:''
    };
  }
  renderCardio();
  openModal();
}

function renderCardio(){
  var c = cardioDraft;
  var mm = Math.floor(nf(c.dur)/60), ss = Math.round(nf(c.dur)%60);
  var ritmoCalc = ritmoDe(c.dur, c.km);

  h += '<div class="mttl"><h3>'+(c.id?'Editar corrida':'Registrar corrida')+'</h3>'+

  h += '<div class="hint" style="margin-bottom:14px">Copi&aacute; los n&uacute;meros de la pantalla de detalle de la app Fitness.</div>';

  /* tipo */
  h += '<div class="fl kick" style="margin-bottom:6px">Tipo</div><div class="grow" style="grid-template-columns:repeat(4,1fr)">';
  CARDIO_TIPOS.forEach(function(t){
    h += '<button class="gbtn tipo-btn'+(c.type===t?' on':'')+'" data-t="'+t+'" onclick="setTipo(\''+t+'\')">'+t+'</button>';
  });
  h += '</div>';

  /* fecha y hora */
  h += '<div class="f3" style="grid-template-columns:1fr 1fr">'+
       '<div><div class="fl">Fecha</div><input type="date" id="c-date" value="'+esc(c.date)+'" onchange="setCardio(\'date\',this.value)"></div>'+
       '<div><div class="fl">Hora de inicio</div><input type="time" id="c-time" value="'+esc(c.time)+'" onchange="setCardio(\'time\',this.value)"></div>'+
       '</div>';

  /* duracion y distancia */
  h += '<div class="f3">'+
       '<div><div class="fl">Min</div><input type="number" min="0" inputmode="numeric" id="c-min" value="'+(mm||'')+'" oninput="setDur()"></div>'+
       '<div><div class="fl">Seg</div><input type="number" min="0" max="59" inputmode="numeric" id="c-seg" value="'+(ss||'')+'" oninput="setDur()"></div>'+
       '<div><div class="fl">Distancia km</div><input type="number" step="0.01" inputmode="decimal" id="c-km" value="'+esc(c.km)+'" oninput="setCardio(\'km\',this.value)"></div>'+
       '</div>';

  /* calorias y cadencia */
  h += '<div class="f3">'+
       '<div><div class="fl">Kcal activas</div><input type="number" inputmode="numeric" id="c-ka" value="'+esc(c.kcalAct)+'" oninput="setCardio(\'kcalAct\',this.value)"></div>'+
       '<div><div class="fl">Kcal totales</div><input type="number" inputmode="numeric" id="c-kt" value="'+esc(c.kcalTot)+'" oninput="setCardio(\'kcalTot\',this.value)"></div>'+
       '<div><div class="fl">Cadencia PPM</div><input type="number" inputmode="numeric" id="c-cad" value="'+esc(c.cadencia)+'" oninput="setCardio(\'cadencia\',this.value)"></div>'+
       '</div>';

  h += '<div style="margin-bottom:14px"><div class="fl kick" style="margin-bottom:5px">Desnivel (m) &mdash; opcional</div>'+
       '<input type="number" inputmode="numeric" id="c-desn" value="'+esc(c.desnivel||'')+'" placeholder="&mdash;" oninput="setCardio(\'desnivel\',this.value)"></div>';

  /* ritmo calculado */
  h += '<div class="card" style="background:var(--surface2);padding:11px 13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'+
       '<span class="kick">Ritmo medio</span>'+
       '<span class="num" id="c-ritmo" style="font-weight:700;font-size:1.05rem;color:var(--cyan)">'+
       (ritmoCalc ? fRitmo(ritmoCalc)+' /km' : '&mdash;')+'</span></div>';

  /* parciales */
  h += '<div class="mdiv"><span>parciales (opcional)</span></div>';
  if(!c.parciales) c.parciales = [];
  if(c.parciales.length){
    h += '<div class="tw" style="margin-bottom:9px"><table><thead><tr>'+
         '<th>Km</th><th>Tiempo</th><th>Ritmo</th><th>PPM</th><th></th></tr></thead><tbody>';
    c.parciales.forEach(function(p,i){
      h += '<tr>'+
           '<td>'+(i+1)+'</td>'+
           '<td>'+fDur(p.seg)+'</td>'+
           '<td>'+(fRitmo(p.seg)||'&mdash;')+'</td>'+
           '<td>'+(p.cadencia||'&mdash;')+'</td>'+
           '<td class="r"><button class="mx" style="padding:0 4px" onclick="delParcial('+i+')">&#10005;</button></td>'+
           '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="f3">'+
       '<div><div class="fl">Min</div><input type="number" min="0" inputmode="numeric" id="p-min" placeholder="9"></div>'+
       '<div><div class="fl">Seg</div><input type="number" min="0" max="59" inputmode="numeric" id="p-seg" placeholder="10"></div>'+
       '<div><div class="fl">PPM</div><input type="number" inputmode="numeric" id="p-cad" placeholder="132"></div>'+
       '</div>';
  h += '<button class="btn btn-dash" style="margin-bottom:16px" onclick="addParcial()">'+
       '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar parcial</button>';

  /* notas */
  h += '<div style="margin-bottom:14px"><div class="fl kick" style="margin-bottom:5px">Notas</div>'+
       '<input type="text" id="c-notes" value="'+esc(c.notes)+'" placeholder="Cinta, calle, sensaciones..." oninput="setCardio(\'notes\',this.value)"></div>';

  h += '<button class="btn btn-p btn-full" id="btn-cardio" onclick="saveCardio()">Guardar corrida</button>';
  if(c.id){
    h += '<button class="btn btn-o btn-full" style="margin-top:9px;color:var(--red);border-color:rgba(255,77,94,.4)" '+
         'onclick="delCardio(\''+jsq(c.id)+'\')">Borrar esta corrida</button>';
  }

  $('modal-box').innerHTML = h;
}

/* NUNCA re-renderizar el modal desde un oninput: destruye el <input>, baja el teclado
   virtual y, con type=number, borra lo tipeado a medio escribir ("1." vale "" para el
   navegador, asi que 1.25 terminaba guardandose como 25). Solo se refresca el ritmo. */
function setCardio(k,v){
  cardioDraft[k] = String(v||'').trim();
  if(k==='km' || k==='dur') pintarRitmo();
}
function setDur(){
  var m = nf($('c-min').value), s = nf($('c-seg').value);
  cardioDraft.dur = String(m*60 + s);
  pintarRitmo();
}
/* actualiza solo el nodo del ritmo, sin tocar el resto del formulario */
function pintarRitmo(){
  var el = $('c-ritmo');
  if(!el) return;
  var r = ritmoDe(cardioDraft.dur, cardioDraft.km);
  el.innerHTML = r ? fRitmo(r)+' /km' : '&mdash;';
}
/* el tipo cambia clases, no re-renderiza */
function setTipo(t){
  cardioDraft.type = t;
  var bs = document.querySelectorAll('#modal-box .tipo-btn');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.t===t);
}
function addParcial(){
  var m = nf($('p-min').value), s = nf($('p-seg').value), cad = $('p-cad').value;
  if(!m && !s){ toast('Carg&aacute; el tiempo del parcial','err'); return; }
  cardioDraft.parciales.push({seg: m*60+s, cadencia: String(cad||'').trim()});
  renderCardio();   /* aca si: cambia la tabla de parciales */
}
function delParcial(i){ cardioDraft.parciales.splice(i,1); renderCardio(); }

function saveCardio(){
  var c = cardioDraft;
  if(!c.date){ toast('Falta la fecha','err'); return; }
  if(!nf(c.dur) && !nf(c.km)){ toast('Carg&aacute; al menos duraci&oacute;n o distancia','err'); return; }
  c.ritmo = String(ritmoDe(c.dur, c.km));
  if(!c.id) c.id = c.date + 'T' + (c.time || '00:00');
  apiPost('saveCardio', c, $('btn-cardio'))
    .then(function(){ closeModal(); toast('Corrida guardada','ok'); fetchData(true); })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}
/* pide confirmacion: el boton es rojo, ancho completo y esta pegado abajo de "Guardar" */
function delCardio(id){
  var c = null;
  cardioList().forEach(function(x){ if(x.id===id) c=x; });
  var q = c ? (c.type+' del '+fShort(c.date)+(c.time?' '+c.time:'')) : 'esta corrida';
  if(!window.confirm('Borrar ' + q + '?\n\nNo se puede deshacer.')) return;
  apiPost('deleteCardio', {id:id})
    .then(function(){ closeModal(); toast('Corrida borrada','ok'); fetchData(true); })
    .catch(function(e){ toast('No pude borrar: '+e.message,'err'); });
}

/* ---------------- HISTORIAL ---------------- */
function buildHist(){
  var ss = (D && D.sessions) ? D.sessions : [];
  var h='';
  h += '<div class="ptitle">Historial</div>';
  h += '<div class="psub">'+ss.length+' sesiones registradas</div>';

  /* semana y racha */
  var byWeek={};
  ss.forEach(function(s){ var k=weekKey(s.date); (byWeek[k]=byWeek[k]||{})[s.date]=true; });
  var meta = metaSemanal();
  var thisWeek = byWeek[weekKey(todayISO())] ? Object.keys(byWeek[weekKey(todayISO())]).length : 0;
  var streak=0, cur=monday(new Date());
  for(var i=0;i<200;i++){
    cur.setDate(cur.getDate()-7);
    var n = byWeek[isoOf(cur)] ? Object.keys(byWeek[isoOf(cur)]).length : 0;
    if(n>=meta) streak++; else break;
  }

  h += '<div class="kpis">';
  h += kpi('Esta semana', thisWeek+'/'+meta,
       thisWeek>=meta ? 'Semana cumplida' : 'Falta'+((meta-thisWeek)===1?' 1':'n '+(meta-thisWeek)),
       thisWeek>=meta?'g':'');
  h += kpi('Racha', streak+(streak===1?' semana':' semanas'), 'consecutivas con '+meta+'+', 'g');
  h += kpi('Total', ss.length, 'sesiones', 'c');
  h += '</div>';

  /* objetivo editable */
  h += '<div class="card metabox">';
  h += '<div><div class="kick">Objetivo semanal</div>'+

function setHistView(v){ histView=v; buildHist(); }

/* Mezcla sesiones de gym y corridas en una sola linea de tiempo, mas nuevo primero.
   Cada entrada lleva una clave unica: 'g:<fecha>' para gym, 'c:<id>' para cardio. */
function timeline(ss){
  var out = [];
  ss.forEach(function(s){ out.push({k:'g:'+s.date, kind:'gym', date:s.date, time:'23:59', s:s}); });
  cardioList().forEach(function(c){ out.push({k:'c:'+c.id, kind:'cardio', date:c.date, time:c.time||'00:00', c:c}); });
  out.sort(function(a,b){
    var ka=a.date+'T'+a.time, kb=b.date+'T'+b.time;
    return ka<kb ? 1 : (ka>kb ? -1 : 0);
  });
  return out;
}

function listHTML(ss){
  var items = timeline(ss);
  if(!items.length) return '<div class="empty">Todav&iacute;a no hay nada guardado.</div>';
  var h='';
  items.forEach(function(e){
    h += (e.kind==='gym') ? gymCardHTML(e) : cardioCardHTML(e);
  });
  return h;
}

function gymCardHTML(e){
  var s = e.s;
  var ids = s.order && s.order.length ? s.order : Object.keys(s.items);
  var hechos = ids.filter(function(id){ return s.items[id] && s.items[id].done; });
  var st = statsOf([s]);
  var d = parseISO(s.date);
  var open = openSession===e.k;

  var h = '<div class="hcard'+(open?' open':'')+'">';
  h +=   '<button class="hhead" onclick="toggleSession(\''+e.k+'\')">';
  h +=     '<div class="hbadge"><div class="d">'+d.getDate()+'</div><div class="m">'+MESES[d.getMonth()]+'</div></div>';
  h +=     '<div class="hb"><div class="hd">'+fDate(s.date)+'</div>'+
           '<div class="hm">Gym &middot; '+hechos.length+' ejercicios &middot; '+fInt(st.vol)+' kg</div></div>';
  h +=     '<svg class="hchev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  h +=   '</button>';

  if(open){
    h += '<div class="hdet">';
    if(s.notes) h += '<div class="hnote">&ldquo;'+esc(s.notes)+'&rdquo;</div>';
    ids.forEach(function(id){
      var it=s.items[id]; if(!it || !it.done) return;
      var det = [];
      if(it.weight) det.push(fKg(it.weight)+' kg');
      if(it.series && it.reps) det.push(esc(it.series)+'x'+esc(it.reps));
      h += '<div class="hex">'+
           '<span class="hdot '+(it.group||'superior')+'"></span>'+
           '<span class="hex-n">'+dispName(id, it.name)+'</span>'+
           '<span class="hex-v">'+(det.length?det.join(' &middot; '):'&mdash;')+'</span></div>';
    });
    var noHechos = ids.filter(function(id){ return s.items[id] && !s.items[id].done; });
    if(noHechos.length){
      h += '<div class="hm" style="margin-top:10px">No hechos: '+
           noHechos.map(function(id){ return dispName(id, s.items[id].name); }).join(', ')+'</div>';
    }
    h += '<div style="display:flex;gap:8px;margin-top:14px">'+
         '<button class="btn btn-o" style="flex:1;padding:9px" onclick="editSession(\''+s.date+'\')">Editar</button>'+
         '</div>';
    h += '</div>';
  }
  return h + '</div>';
}

function cardioCardHTML(e){
  var c = e.c;
  var d = parseISO(c.date);
  var open = openSession===e.k;
  var resumen = [];
  if(nf(c.km)) resumen.push(fKm(c.km)+' km');
  if(nf(c.dur)) resumen.push(fDur(c.dur));
  var ritmo = nf(c.ritmo) || ritmoDe(c.dur, c.km);

  var h = '<div class="hcard cardio'+(open?' open':'')+'">';
  h +=   '<button class="hhead" onclick="toggleSession(\''+jsq(e.k)+'\')">';
  h +=     '<div class="hbadge cardio">'+
           '<svg viewBox="0 0 24 24"><path d="M13 4a1 1 0 1 0 0-.001M8 21l2-5 3-2 1-4 3 3 3 1M6 12l2-4 4-1"/></svg>'+
           '</div>';
  h +=     '<div class="hb"><div class="hd">'+esc(c.type)+' &middot; '+fShort(c.date)+(c.time?' '+esc(c.time):'')+'</div>'+
           '<div class="hm">'+(resumen.length?resumen.join(' &middot; '):'sin datos')+
           (ritmo?' &middot; '+fRitmo(ritmo)+'/km':'')+'</div></div>';
  h +=     '<svg class="hchev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  h +=   '</button>';

  if(open){
    h += '<div class="hdet">';
    if(c.notes) h += '<div class="hnote">&ldquo;'+esc(c.notes)+'&rdquo;</div>';
    var filas = [
      ['Duraci&oacute;n', nf(c.dur) ? fDur(c.dur) : ''],
      ['Distancia', nf(c.km) ? fKm(c.km)+' km' : ''],
      ['Kcal activas', nf(c.kcalAct) ? fInt(c.kcalAct)+' kcal' : ''],
      ['Kcal totales', nf(c.kcalTot) ? fInt(c.kcalTot)+' kcal' : ''],
      ['Cadencia media', nf(c.cadencia) ? fInt(c.cadencia)+' ppm' : ''],
      ['Desnivel', nf(c.desnivel) ? fInt(c.desnivel)+' m' : ''],
      ['Ritmo medio', ritmo ? fRitmo(ritmo)+' /km' : '']
    ];
    filas.forEach(function(f){
      if(!f[1]) return;
      h += '<div class="hex"><span class="hdot cardio"></span>'+
           '<span class="hex-n">'+f[0]+'</span><span class="hex-v">'+f[1]+'</span></div>';
    });
    if(c.parciales && c.parciales.length){
      h += '<div class="hm" style="margin:12px 0 6px">Parciales</div>';
      h += '<div class="tw"><table><thead><tr><th>Km</th><th>Tiempo</th><th>Ritmo</th><th class="r">PPM</th></tr></thead><tbody>';
      c.parciales.forEach(function(p,i){
        h += '<tr><td>'+(i+1)+'</td><td>'+fDur(p.seg)+'</td><td>'+(fRitmo(p.seg)||'&mdash;')+'</td>'+
             '<td class="r">'+(p.cadencia||'&mdash;')+'</td></tr>';
      });
      h += '</tbody></table></div>';
    }
    h += '<div style="display:flex;gap:8px;margin-top:14px">'+
         '<button class="btn btn-o" style="flex:1;padding:9px" onclick="openCardio(\''+jsq(c.id)+'\')">Editar</button>'+
         '</div>';
    h += '</div>';
  }
  return h + '</div>';
}

function toggleSession(k){ openSession = (openSession===k)?null:k; buildHist(); }
function editSession(date){ curDate=date; loadDraft(); buildTrain(); switchTab('train'); }

function calendarHTML(ss){
  /* arranca en el mes de la ultima actividad, no en el mes actual:
     si hoy es 1 del mes, abrir en un calendario vacio no sirve de nada */
  if(!calRef){
    var ult = null;
    if(ss.length) ult = ss[0].date;
    var cl = cardioList();
    if(cl.length && (!ult || cl[0].date > ult)) ult = cl[0].date;
    calRef = ult ? parseISO(ult) : new Date();
  }
  var y=calRef.getFullYear(), m=calRef.getMonth();

  /* cada dia puede tener gym, cardio o los dos */
  var hits={};
  ss.forEach(function(s){ (hits[s.date]=hits[s.date]||{}).gym = true; });
  cardioList().forEach(function(c){ (hits[c.date]=hits[c.date]||{}).cardio = true; });

  var start=monday(new Date(y,m,1));
  var today=todayISO();

  var h='';
  h += '<div class="card">';
  h += '<div class="calhead">'+
       '<button class="ibtn" onclick="calMove(-1)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>'+
       '<div class="mname">'+MESESL[m]+' '+y+'</div>'+
       '<button class="ibtn" onclick="calMove(1)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>'+
       '</div>';
  h += '<div class="calgrid">';
  DOW.forEach(function(d){ h += '<div class="caldow">'+d+'</div>'; });

  var cur=new Date(start);
  var nGym=0, nCar=0;
  for(var i=0;i<42;i++){
    var iso=isoOf(cur);
    var out = cur.getMonth()!==m;
    var hit = hits[iso];
    if(!out && hit){ if(hit.gym) nGym++; if(hit.cardio) nCar++; }
    var cls='calday'+(out?' out':'')+(hit?' hit':'')+(iso===today?' today':'');
    if(hit && !hit.gym && hit.cardio) cls += ' onlycardio';
    var bubs='';
    if(hit){
      bubs = '<span class="bubs">'+
             (hit.gym?'<span class="bub"></span>':'')+
             (hit.cardio?'<span class="bub cardio"></span>':'')+'</span>';
    }
    h += '<button class="'+cls+'"'+(hit?' onclick="jumpTo(\''+iso+'\')"':'')+'>'+
         cur.getDate()+bubs+'</button>';
    cur.setDate(cur.getDate()+1);
    if(i>=34 && cur.getMonth()!==m) break;
  }
  h += '</div>';
  h += '<div class="callegend" style="gap:16px;flex-wrap:wrap">'+
       '<span style="display:flex;align-items:center;gap:6px"><span class="bub"></span>'+
       '<span class="kick">'+nGym+' gym</span></span>'+
       '<span style="display:flex;align-items:center;gap:6px"><span class="bub cardio"></span>'+
       '<span class="kick">'+nCar+' cardio</span></span></div>';
  h += '</div>';
  return h;
}
function calMove(n){
  if(!calRef) calRef=new Date();
  calRef = new Date(calRef.getFullYear(), calRef.getMonth()+n, 1);
  buildHist();
}
/* abre lo primero que haya ese dia: el gym si existe, si no la corrida */
function jumpTo(iso){
  histView='lista';
  var k = null;
  (D && D.sessions ? D.sessions : []).forEach(function(s){ if(s.date===iso && !k) k='g:'+s.date; });
  if(!k) cardioList().forEach(function(c){ if(c.date===iso && !k) k='c:'+c.id; });
  openSession = k;
  buildHist();
  /* scrollear a la tarjeta, no al tope: para un dia viejo quedaba 1000px abajo del fold
     y parecia que el toque no habia hecho nada */
  setTimeout(function(){
    var abierta = document.querySelector('#p-hist .hcard.open');
    if(abierta) abierta.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
  }, 30);
}

/* ---------------- PROGRESO ---------------- */
function buildProg(){
  var ss = (D && D.sessions) ? D.sessions : [];
  var h='';
  h += '<div class="ptitle">Progreso</div>';
  h += '<div class="psub">Trabajo por tren</div>';

  if(!ss.length){
    $('p-prog').innerHTML = h + '<div class="empty">Todav&iacute;a no hay sesiones para analizar.</div>';
    return;
  }

  /* agrupacion */
  h += '<div style="display:flex;justify-content:center;margin-bottom:9px">';
  h += '<div class="pills">'+
       '<button class="pill'+(progBy==='session'?' on':'')+'" onclick="setProgBy(\'session\')">Por sesi&oacute;n</button>'+
       '<button class="pill'+(progBy==='week'?' on':'')+'" onclick="setProgBy(\'week\')">Por semana</button>'+
       '<button class="pill'+(progBy==='month'?' on':'')+'" onclick="setProgBy(\'month\')">Por mes</button>'+
       '</div></div>';

  /* metrica */
  h += '<div style="display:flex;justify-content:center;margin-bottom:18px">';
  h += '<div class="pills">';
  ['vol','series','reps'].forEach(function(m){
    h += '<button class="pill'+(progMetric===m?' on':'')+'" onclick="setProgMetric(\''+m+'\')">'+METRICAS[m].lbl+'</button>';
  });
  h += '</div></div>';

  var buckets = bucketize(ss, progBy);
  var visibles = buckets.slice(-bucketCount(progBy));
  var todas = [];
  visibles.forEach(function(b){ todas = todas.concat(b.sessions); });
  var st = statsOf(todas);

  h += '<div class="kpis">';
  h += kpi('Volumen', fInt(st.vol)+' kg', rangeLabel(progBy), progMetric==='vol'?'':'x');
  h += kpi('Series', fInt(st.series), 'series efectivas', 'g');
  h += kpi('Repeticiones', fInt(st.reps), 'reps totales', 'c');
  h += kpi('Sesiones', st.ses, 'entrenamientos');
  h += '</div>';

  /* aviso: el volumen en kg no ve el peso corporal */
  if(progMetric==='vol'){
    var sinPeso = 0;
    todas.forEach(function(s){
      for(var id in s.items){ var it=s.items[id]; if(it.done && !(nf(it.weight)>0)) sinPeso++; }
    });
    if(sinPeso){
      h += '<div class="card" style="display:flex;gap:10px;align-items:flex-start;background:var(--surface2)">'+
           '<svg style="width:16px;height:16px;flex:0 0 auto;stroke:var(--cyan);stroke-width:2;fill:none;margin-top:2px" viewBox="0 0 24 24">'+
           '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01" stroke-linecap="round"/></svg>'+
           '<div class="hint">El volumen en kg <b>no cuenta los ejercicios de peso corporal</b> '+
           '(abdominales, captain&#39;s chair). En este rango hay <b>'+sinPeso+'</b> de esos. '+
           'Mir&aacute; <b>Series</b> o <b>Repeticiones</b> para ver ese trabajo.</div></div>';
    }
  }

  /* ---- balance semanal por musculo ---- */
  var mst = muscleStats();
  var gaps = muscleGaps();
  h += secHd('Balance de esta semana','green', 'series por m&uacute;sculo');
  h += '<div class="card">';
  h += '<div class="hint" style="margin-bottom:14px">La referencia para que un m&uacute;sculo crezca es '+
       '<b>'+SERIES_MIN+' a '+SERIES_MAX+' series por semana</b>. La franja marcada es ese rango.</div>';
  MORDER.forEach(function(m){
    var o = mst[m];
    var pct = Math.min(100, (o.sem / (SERIES_MAX*1.4)) * 100);
    var z1 = (SERIES_MIN/(SERIES_MAX*1.4))*100, z2 = (SERIES_MAX/(SERIES_MAX*1.4))*100;
    var cls = o.sem < SERIES_MIN ? 'mfill-bajo' : (o.sem <= SERIES_MAX ? 'mfill-ok' : 'mfill-alto');
    var col = o.sem < SERIES_MIN ? 'var(--red)' : (o.sem <= SERIES_MAX ? 'var(--green-2)' : 'var(--cyan)');
    h += '<div class="mrow">';
    h += '<div class="mtop"><span class="mname2" style="color:'+col+'">'+MUSCULOS[m].lbl+'</span>'+
         '<span class="mval">'+o.sem+' de '+SERIES_MIN+'&ndash;'+SERIES_MAX+'</span></div>';
    h += '<div class="mbar"><div class="zona" style="left:'+z1.toFixed(1)+'%;right:'+(100-z2).toFixed(1)+'%"></div>'+
         '<div class="fill '+cls+'" style="width:'+pct.toFixed(1)+'%"></div></div>';
    h += '</div>';
  });
  var flojos = gaps.filter(function(x){ return x.falta > 0; });
  if(flojos.length){
    h += '<div class="hint" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline)">'+
         'Lo m&aacute;s atrasado: <b>'+flojos.slice(0,3).map(function(x){ return MUSCULOS[x.m].lbl; }).join(', ')+
         '</b>. En <b>Entrenar &rarr; Agregar ejercicio</b> te los sugiere primero.</div>';
  }
  h += '</div>';

  /* ---- dias sin trabajar cada musculo ---- */
  h += secHd('Cu&aacute;ndo tocaste cada cosa','cyan','');
  h += '<div class="card"><div class="chips">';
  gaps.slice().sort(function(a,b){
    var da = a.dias===null?9999:a.dias, db = b.dias===null?9999:b.dias;
    return db - da;
  }).forEach(function(x){
    var viejo = (x.dias === null) || x.dias >= 7;
    var txt = (x.dias === null) ? 'nunca' : (x.dias === 0 ? 'hoy' : (x.dias === 1 ? 'ayer' : 'hace '+x.dias+' d'));
    h += '<span class="chip '+(viejo?'viejo':'ok')+'">'+MUSCULOS[x.m].lbl+' <b>'+txt+'</b></span>';
  });
  h += '</div></div>';

  /* ---- ejercicios estancados ---- */
  var est = estancados(4);
  if(est.length){
    h += secHd('Estancados','violet', est.length+(est.length===1?' ejercicio':' ejercicios'));
    h += '<div class="card">';
    h += '<div class="hint" style="margin-bottom:12px">Ven&iacute;s con el mismo peso hace varias sesiones. '+
         'Si las complet&aacute;s sin drama, es momento de subir.</div>';
    est.forEach(function(e){
      var sug = Math.max(e.w+0.5, Math.round(e.w*1.05*2)/2);
      h += '<div class="hex">'+
           '<span class="hdot '+((exDef(e.id)||{}).g||'superior')+'"></span>'+
           '<span class="hex-n">'+dispName(e.id, e.name)+'<br>'+
           '<span class="hm">'+e.n+' sesiones en '+fKg(e.w)+' kg &middot; desde el '+fShort(e.desde)+'</span></span>'+
           '<span class="hex-v" style="color:var(--green-2)">&#9650; '+fKg(sug)+' kg</span></div>';
    });
    h += '</div>';
  }

  h += secHd(METRICAS[progMetric].lbl+' por tren','violet', byLabel(progBy));
  h += '<div class="card"><div class="chartbox"><canvas id="cv-vol"></canvas></div>';
  h += '<div style="display:flex;gap:14px;justify-content:center;margin-top:12px;flex-wrap:wrap">';
  GORDER.forEach(function(g){
    h += '<span style="display:flex;align-items:center;gap:6px">'+
         '<span style="width:9px;height:9px;border-radius:2px;background:'+GRUPOS[g].col+'"></span>'+
         '<span class="kick" style="color:var(--muted)">'+GRUPOS[g].lbl+'</span></span>';
  });
  h += '</div>';
  if(progBy!=='session' && visibles.length && isCurrentBucket(visibles[visibles.length-1].key, progBy)){
    h += '<div style="text-align:center;margin-top:9px"><span class="kick" style="color:var(--dim)">'+
         '* '+(progBy==='week'?'semana':'mes')+' en curso, todav&iacute;a suma</span></div>';
  }
  h += '</div>';

  /* reparto total por tren, segun la metrica elegida */
  h += secHd('Reparto del trabajo','green', METRICAS[progMetric].lbl.toLowerCase());
  var totG = st.porGrupo;
  var sum = totG.superior[progMetric]+totG.medio[progMetric]+totG.inferior[progMetric];
  h += '<div class="card">';
  GORDER.forEach(function(g){
    var val = totG[g][progMetric];
    var pct = sum>0 ? (val/sum*100) : 0;
    h += '<div style="margin-bottom:13px">';
    h += '<div style="display:flex;justify-content:space-between;margin-bottom:5px">'+
         '<span class="kick" style="color:var(--text)">'+GRUPOS[g].lbl+'</span>'+
         '<span class="kick num">'+fInt(val)+(METRICAS[progMetric].u?' '+METRICAS[progMetric].u:'')+
         ' &middot; '+Math.round(pct)+'%</span></div>';
    h += '<div style="height:8px;border-radius:5px;background:var(--surface3);overflow:hidden">'+
         '<div style="height:100%;width:'+pct.toFixed(1)+'%;background:'+GRUPOS[g].col+';border-radius:5px"></div></div>';
    h += '</div>';
  });
  h += '</div>';

  /* por ejercicio */
  h += secHd('Por ejercicio','cyan','hist&oacute;rico completo');
  var porEx = {};
  ss.forEach(function(s){
    for(var id in s.items){
      var it=s.items[id]; if(!it.done) continue;
      if(!porEx[id]) porEx[id]={id:id, name:it.name, group:it.group||'superior', veces:0, vol:0, max:0, last:null, lastDate:''};
      var e=porEx[id];
      e.veces++;
      e.vol += itemVol(it);
      var w=nf(it.weight);
      if(w>e.max) e.max=w;
      if(e.last===null && it.weight!==''){ e.last=w; e.lastDate=s.date; }
    }
  });
  var lista=[];
  for(var k in porEx) lista.push(porEx[k]);
  lista.sort(function(a,b){ return b.vol-a.vol; });

  h += '<div class="tw"><table><thead><tr>'+
       '<th>Ejercicio</th><th class="r">Veces</th><th class="r">&Uacute;ltimo</th><th class="r">M&aacute;ximo</th><th class="r">Volumen</th>'+
       '</tr></thead><tbody>';
