       '<button class="pill'+(trabajoBy!=='mes'?' on':'')+'" onclick="setTrabajoBy(\'sem\')">Por semana</button>'+
       '<button class="pill'+(trabajoBy==='mes'?' on':'')+'" onclick="setTrabajoBy(\'mes\')">Por mes</button></div></div>';
  h += '<div class="chartbox" style="height:210px"><canvas id="cv-sem"></canvas></div>';
  h += '<div style="text-align:center;margin-top:10px"><span class="kick" style="color:var(--dim)">'+
       (trabajoBy==='mes' ? 'cada barra es un mes' : 'cada barra es una semana, de lunes a domingo')+
       ' &middot; la l&iacute;nea es tu promedio</span></div></div>';
  return h;
}

/* ---- 5. que te falta: solo lo que esta fuera de rango lleva barra ----
   v16: campana para que te lo recuerde en la proxima sesion, y cruz para ocultar un
   musculo que no te interesa (Diego: "no tengo interes en hacer gluteos"). */
function balanceHTML(){
  /* Un lunes la semana en curso esta en cero y las ocho barras quedan iguales
     en "0 de 10", que no dice nada. Como el hero, caigo a la semana pasada. */
  var wk = weekKey(todayISO()), rot = 'semana en curso';
  var hayEstaSemana = ((D && D.sessions) ? D.sessions : [])
        .some(function(s){ return weekKey(s.date) === wk; });
  if(!hayEstaSemana){
    var prev = null;
    semanas().forEach(function(w){ if(w.ses > 0 && w.key < wk && (!prev || w.key > prev)) prev = w.key; });
    if(prev){ wk = prev; rot = 'semana pasada'; }
  }
  var mst = muscleStats(wk);
  var gaps = muscleGaps(wk);
  var ocl = ocultos();
  var fuera = [], dentro = [], pasados = [];
  MORDER.forEach(function(m){
    if(ocl.indexOf(m) !== -1) return;
    var o = mst[m];
    if(o.sem < SERIES_MIN) fuera.push(m);
    else if(o.sem <= SERIES_MAX) dentro.push(m);
    else pasados.push(m);
  });
  var orden = gaps.map(function(x){ return x.m; }).filter(function(m){ return fuera.indexOf(m) >= 0; });

  var h = secHd('Qu&eacute; te falta','red', rot);
  h += '<div class="card">';
  if(!orden.length && !dentro.length && !pasados.length && !ocl.length){
    h += '<div class="hint">Todav&iacute;a no entrenaste esta semana.</div></div>';
    return h;
  }
  h += '<div class="hint" style="margin-bottom:14px">Para que un m&uacute;sculo crezca hacen falta '+
       '<b>'+SERIES_MIN+' a '+SERIES_MAX+' series por semana</b>. Toc&aacute; la campana y te lo recuerdo en la pr&oacute;xima sesi&oacute;n.</div>';
  orden.forEach(function(m){
    var o = mst[m];
    var pct = Math.min(100, (o.sem/(SERIES_MAX*1.4))*100);
    var z1 = (SERIES_MIN/(SERIES_MAX*1.4))*100, z2 = (SERIES_MAX/(SERIES_MAX*1.4))*100;
    var dias = (o.dias === null) ? 'nunca'
             : (o.dias === 0 ? 'hoy' : (o.dias === 1 ? 'ayer' : 'hace '+o.dias+' d&iacute;as'));
    var on = tieneRec('m:'+m);
    h += '<div class="mrow"><div class="mtop">'+
         '<span class="mname2" style="color:var(--red)">'+MUSCULOS[m].lbl+'</span>'+
         '<span class="macts"><span class="mval">'+Math.round(o.sem)+' de '+SERIES_MIN+' &middot; '+dias+'</span>'+
         '<button class="bell'+(on?' on':'')+'" onclick="toggleRecordar(\'musc\',\''+m+'\')" title="Recordarme">'+ICO_BELL+'</button>'+
         '<button class="bell" onclick="ocultarMusc(\''+m+'\')" title="No me interesa">&#10005;</button></span></div>'+
         '<div class="mbar"><div class="zona" style="left:'+z1.toFixed(1)+'%;right:'+(100-z2).toFixed(1)+'%"></div>'+
         '<div class="fill mfill-bajo" style="width:'+pct.toFixed(1)+'%"></div></div></div>';
  });
  var pie = [];
  if(dentro.length)  pie.push('<b style="color:var(--green-2)">En rango</b>: '+
    dentro.map(function(m){ return MUSCULOS[m].lbl.toLowerCase()+' '+Math.round(mst[m].sem); }).join(', '));
  if(pasados.length) pie.push('<b style="color:var(--cyan)">Pasados de '+SERIES_MAX+'</b>: '+
    pasados.map(function(m){ return MUSCULOS[m].lbl.toLowerCase()+' '+Math.round(mst[m].sem); }).join(', '));
  if(ocl.length) pie.push('<b>Ocultos</b>: '+ocl.map(function(m){
    return MUSCULOS[m].lbl.toLowerCase()+' <button class="lnk" onclick="mostrarMusc(\''+m+'\')">mostrar</button>';
  }).join(', '));
  if(pie.length){
    h += '<div class="hint" style="margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline)">'+
         pie.join('<br>')+'</div>';
  }
  h += '</div>';
  return h;
}

/* ---- 7. cardio: el record es la distancia, no el ritmo ---- */
/* Las corridas en orden, marcando las que fueron record al momento de correrlas. */
function corridas(){
  var l = cardioList().filter(function(c){
    return (c.type||'Correr') === 'Correr' && nf(c.km) > 0;
  });
  l.sort(function(a,b){
    var ka = a.date+'T'+(a.time||'00:00'), kb = b.date+'T'+(b.time||'00:00');
    return ka<kb ? -1 : (ka>kb ? 1 : 0);
  });
  var max = 0;
  return l.map(function(c){
    var k = nf(c.km), pr = k > max;
    if(pr) max = k;
    return {c:c, km:k, pr:pr};
  });
}

/* Las corridas agrupadas por dia. Diego casi siempre sale dos veces (una corta y una
   larga): una barra por corrida eran 14 barras, el eje salteaba la mitad de las fechas
   y la corrida del dia quedaba sin etiqueta. Por dia son la mitad y cada una lleva fecha.
   larga = la mas larga del dia (es la unica que puede ser record: supera a todo lo
   anterior, incluida la corta de ese mismo dia). resto = la suma de las otras. */
function diasCorrida(){
  var map = {}, orden = [];
  corridas().forEach(function(x){
    var d = x.c.date;
    if(!map[d]){ map[d] = {date:d, runs:[], larga:0, total:0, pr:false}; orden.push(d); }
    var o = map[d];
    o.runs.push(x);
    o.total += x.km;
    if(x.km > o.larga) o.larga = x.km;
    if(x.pr) o.pr = true;
  });
  return orden.map(function(d){
    var o = map[d];
    o.resto = Math.max(0, o.total - o.larga);
    return o;
  });
}

/* Chart.js dibuja adentro de un canvas: no entiende var(--...), asi que los
   colores hay que leerlos con cssv() en el momento de dibujar. Por eso TT y PAL
   son FUNCIONES y no constantes: al cambiar de tema, render() rehace los graficos
   y estas vuelven a leer los valores nuevos. */
function TTo(){
  return {backgroundColor:cssv('--surface3','#24242F'), borderColor:cssv('--border','#2A2A38'),
          borderWidth:1, titleColor:cssv('--text','#ECECF2'), bodyColor:cssv('--muted','#8A8A9C'),
          padding:10, displayColors:false};
}
function PAL(){
  return {ac:cssv('--violet','#7C5CFF'), ac2:cssv('--violet-2','#9D85FF'),
          ok:cssv('--green','#2BE08A'), cy:cssv('--cyan','#3BE0D0'),
          tick:cssv('--dim','#5E5E70'), grid:cssv('--hairline','#22222E'),
          bar:cssv('--chart-bar','#3A3A4A'), txt:cssv('--text','#ECECF2'),
          acRGB:cssv('--violet-rgb','124,92,255')};
}

function drawProgCharts(){

  /* series por semana: un color, sin apilar. En 320px de ancho tres segmentos

           backgroundColor: ws.map(function(w){ return w.actual ? PAL().ac2 : PAL().ac; }),
           borderRadius:5, borderSkipped:false, order:2},
          {type:'line', label:'promedio',

      options:{

            } } }) },
        scales:{

          y:{ beginAtZero:true, grid:{color:PAL().grid}, ticks:{color:PAL().tick, font:{size:11}} }
        }
      }
    });
  }

  /* cardio: una barra por dia, apilada. Abajo la corrida larga (verde si fue record,
     violeta si es el ultimo dia, gris si no); arriba, en tenue, las salidas cortas.
     El segmento de abajo coincide con el numero del record, asi que el 3,95 grande
     y la barra verde dicen lo mismo. */
  var cc = $('cv-cardio');

        datasets:[
          {label:'larga',
           data: ds.map(function(o){ return Math.round(o.larga*100)/100; }),
           backgroundColor: ds.map(function(o){
             return o.pr ? PAL().ok : (o.date === ultimo ? PAL().ac : PAL().bar);
           }),
           borderRadius:4, borderSkipped:false},
          {label:'cortas',
           data: ds.map(function(o){ return Math.round(o.resto*100)/100; }),
           backgroundColor:PAL().bar,
           borderRadius:4, borderSkipped:false}
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false}, tooltip: Object.assign({}, TTo(), {

            title:function(items){ return fShort(ds[items[0].dataIndex].date); },

                return (x.c.time ? x.c.time+'  ' : '')+fKm(x.km)+' km'+(x.pr ? '  record' : '');
              });

              return l;

          y:{ stacked:true, beginAtZero:true, grid:{color:PAL().grid},
              ticks:{color:PAL().tick, font:{size:10}, callback:function(v){ return v+' km'; }} }
        }
      }
    });

  h += '<div class="card">';
  h += '<div class="pcal-nav"><button class="sug same" onclick="planMover(-1)">&#8249;</button>'+
       '<span class="kick">'+MESESL[mo]+' '+y+'</span><button class="sug same" onclick="planMover(1)">&#8250;</button></div>';
  h += '<div class="pcal">';
  DOW.forEach(function(d){ h += '<div class="pdh">'+d.charAt(0)+'</div>'; });
  var off = (new Date(y, mo, 1).getDay() + 6) % 7;
  for(var i=0;i<off;i++) h += '<div></div>';
  var dias = new Date(y, mo+1, 0).getDate(), cont = {}, diasPasados = 0;
  items.forEach(function(it){ cont[it.id] = 0; });
  for(var d=1; d<=dias; d++){
    var iso = isoOf(new Date(y, mo, d));
    var hs = hechosDe(iso), k = 0;
    items.forEach(function(it){ if(hs.indexOf(it.id) !== -1){ k++; cont[it.id]++; } });
    var fut = iso > hoy;
    if(!fut) diasPasados++;
    var r = items.length ? k / items.length : 0;
    var bg = fut || !r ? '' : (r >= 1 ? 'background:var(--green);color:var(--on-green)'
             : 'background:rgba('+cssv('--violet-rgb','124,92,255')+','+(0.18 + 0.5*r).toFixed(2)+')');
    h += '<button class="pcd'+(fut?' fut':'')+(iso===planDia?' sel':'')+(iso===hoy?' hoy':'')+'" style="'+bg+'"'+
         (fut ? ' disabled' : ' onclick="planDia=\''+iso+'\';buildPlan();window.scrollTo(0,0)"')+'>'+d+'</button>';
  }
  h += '</div>';
  h += '<div class="hint" style="margin:10px 0 12px;font-size:.76rem;text-align:center">Verde: completaste todo &middot; violeta: parte. Toc&aacute; un d&iacute;a para verlo o corregirlo.</div>';
  items.forEach(function(it){
    var pct = diasPasados ? Math.round(cont[it.id]/diasPasados*100) : 0;
    h += '<div class="pstat"><span class="pstat-n">'+esc(it.t)+'</span><span class="mval">'+cont[it.id]+' de '+diasPasados+' d&iacute;as</span></div>'+
         '<div class="mbar" style="height:6px;margin-bottom:10px"><div class="fill mfill-ok" style="width:'+pct+'%"></div></div>';
  });
  h += '</div>';
  return h;
}
function planMover(n){ planMes = new Date(planMes.getFullYear(), planMes.getMonth()+n, 1); buildPlan(); }

function toggleCheck(itId){
  if(planEdit) return;
  var d = planDia || todayISO();
  var l = hechosDe(d).slice(), i = l.indexOf(itId);
  if(i >= 0) l.splice(i, 1); else l.push(itId);
  if(!D.checks) D.checks = {};
  D.checks[d] = l;
  try{ localStorage.setItem('gym_cache', JSON.stringify(D)); }catch(e){}
  buildPlan();
  apiPost('saveCheck', {date:d, items:l}).catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}
function renombrarItem(id, t){
  t = String(t||'').trim();
  if(!t){ buildPlan(); return; }
  guardarChecklist(checklist().map(function(x){ var y = copia(x); if(y.id === id) y.t = t; return y; }));
}
function agregarItem(){
  var t = (nuevoItem||'').trim();
  if(!t){ toast('Escrib&iacute; el &iacute;tem','err'); return; }
  var l = copia(checklist());
  l.push({id:'i'+Date.now().toString(36), t:t});
  nuevoItem = '';
  guardarChecklist(l);
}
function borrarItem(id){
  var it = itemChk(id);
  if(!it || !window.confirm('Borrar "'+it.t+'"?\n\nLos d\u00edas que ya tildaste quedan en la planilla.')) return;
  guardarChecklist(checklist().filter(function(x){ return x.id !== id; }));
}
DRAG_FIN.chklist = function(ids){
  var by = {};
  checklist().forEach(function(x){ by[x.id] = x; });
  guardarChecklist(ids.map(function(i){ return by[i]; }).filter(Boolean));
};

/* Alarma: el Apps Script devuelve un .ics con un evento diario y alarma. Safari
   ofrece agregarlo al Calendario. Una web no puede notificar sola en iOS. */
function openAlarma(id){
  alarmaId = id;
  var it = itemChk(id);
  alarmaHora = (it && it.h) || '09:00';
  var h = '<div class="mttl"><h3>Alarma diaria</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';
  h += '<div class="hint" style="margin-bottom:14px"><b>'+esc(it ? it.t : '')+'</b><br>Se abre Safari y te pregunta si agreg&aacute;s el evento al '+
       'Calendario: suena todos los d&iacute;as a esa hora. Para cambiarla o sacarla, la edit&aacute;s en el Calendario.</div>';
  if(it && it.h) h += '<div class="hint" style="margin-bottom:12px;color:var(--violet-2)">Ya creaste una a las '+esc(it.h)+
       '. Si cre&aacute;s otra, se suma: borr&aacute; la vieja en el Calendario.</div>';
  h += '<div class="fl kick" style="margin-bottom:5px">Hora</div>'+
       '<input type="time" value="'+alarmaHora+'" oninput="alarmaHora=this.value" onchange="alarmaHora=this.value" style="margin-bottom:14px">';
  h += '<button class="btn btn-p btn-full" onclick="crearAlarma()">Agregar al Calendario</button>';
  $('modal-box').innerHTML = h;
  openModal();
}
function crearAlarma(){
  var it = itemChk(alarmaId);
  if(!it) return;
  if(!/^\d{1,2}:\d{2}$/.test(alarmaHora||'')){ toast('Eleg&iacute; una hora','err'); return; }
  var url = API_URL+'?ics=1&t='+encodeURIComponent(it.t)+'&h='+encodeURIComponent(alarmaHora);
  var l = checklist().map(function(x){ var y = copia(x); if(y.id === it.id) y.h = alarmaHora; return y; });
  closeModal();
  setPref('checklist', l);
  buildPlan();
  window.open(url, '_blank');
}

/* ==================================================================
   API
   ================================================================== */
function apiPost(action,payload,btn){
  if(API_URL.indexOf('PEGAR_ACA')===0) return Promise.reject(new Error('Falta la URL del Apps Script'));
  var old='';
  if(btn){ btn.disabled=true; old=btn.innerHTML; btn.innerHTML='Guardando...'; }
  return fetch(API_URL,{
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:action, secret:SECRET, email:userEmail, payload:payload})
  }).then(function(r){ return r.json(); })
    .then(function(j){ if(!j.ok) throw new Error(j.error||'error desconocido'); return j; })
    .finally(function(){ if(btn){ btn.disabled=false; btn.innerHTML=old; } });
}

/* Aviso fijo de que estas viendo datos viejos. Un toast se va solo y deja al usuario
   creyendo que la pantalla esta al dia; esto queda hasta que la conexion vuelve. */
function mostrarOffline(){
  var b = $('offline');
  if(!b) return;
  var cuando = (D && D.lastUpdate) ? D.lastUpdate : '';
  $('offline-txt').innerHTML = 'No pude conectarme. Est&aacute;s viendo los datos guardados' +
    (cuando ? ' del <b>'+cuando+'</b>' : '') + ', puede faltar lo &uacute;ltimo.' +
    (_ultimoError ? '<br><span style="opacity:.75;font-size:.9em">Motivo: '+esc(_ultimoError)+'</span>' : '');
  b.classList.remove('hide');
}
function ocultarOffline(){
  var b = $('offline');
  if(b) b.classList.add('hide');
}
function reintentar(){
  ocultarOffline();
  $('h-update').innerHTML = APP_VER+' &middot; actualizando...';
  _retry = 0;
  fetchData();
}

var _retry=0;
/* trasGuardar: el refresco que sigue a un guardado exitoso. Si falla, el dato YA esta
   en la planilla, asi que el mensaje no debe decir que algo salio mal. */
var _ultimoError = '';

/* Lectura por fetch(), el MISMO camino que usa el guardado.
   Antes esto era JSONP (un <script src>). El 02/09 el guardado funcionaba en el iPhone de
   Diego pero la lectura no: Safari trata distinto un script de otro dominio (prevencion de
   rastreo entre sitios) que una peticion fetch. Con fetch los dos caminos son iguales, y
   ademas se puede saber POR QUE fallo en vez de adivinar.
   El JSONP queda como respaldo por si fetch se topa con CORS en algun contexto. */
function fetchData(trasGuardar){
  if(API_URL.indexOf('PEGAR_ACA')===0){ hideLoad(); toast('Falta la URL del Apps Script','err'); return; }

  var ctrl = null, timer = null;
  try{ ctrl = new AbortController(); }catch(e){}
  var opts = ctrl ? {signal:ctrl.signal} : {};
  if(ctrl) timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, 30000);

  fetch(API_URL+'?t='+Date.now(), opts)
    .then(function(r){
      if(!r.ok) throw new Error('El servidor respondio ' + r.status);
      return r.json();
    })
    .then(function(data){
      if(timer) clearTimeout(timer);
      onDatos(data, trasGuardar);
    })
    .catch(function(e){
      if(timer) clearTimeout(timer);
      var m = String(e && e.message ? e.message : e);
      _ultimoError = (m.indexOf('abort')!==-1) ? 'Tard&oacute; m&aacute;s de 30 segundos' : m;
      /* segundo intento por JSONP: si fetch choca con CORS, esto igual pasa */
      fetchJSONP(trasGuardar);
    });
}

/* respaldo: el metodo viejo, por si fetch no puede */
function fetchJSONP(trasGuardar){
  var old=$('_jp'); if(old) old.remove();
  var cb='gymCb_'+Date.now();
  window[cb]=function(data){
    delete window[cb];
    var s=$('_jp'); if(s) s.remove();
    onDatos(data, trasGuardar);
  };
  var onErr=function(){
    delete window[cb];
    if(_retry<2){ _retry++; setTimeout(function(){ fetchData(trasGuardar); },2500); return; }
    _retry=0; hideLoad();
    if(trasGuardar){
      /* lo importante ya se guardo: no alarmar */
      toast('Guardado. No pude refrescar la pantalla, pero el dato est&aacute; a salvo.','ok');
    } else {
      $('h-update').innerHTML=APP_VER+' &middot; sin conexi&oacute;n';   /* innerHTML: textContent no decodifica la entidad */
      mostrarOffline();
    }
  };
  var sc=document.createElement('script');
  sc.id='_jp'; sc.src=API_URL+'?callback='+cb+'&t='+Date.now(); sc.onerror=onErr;
  document.head.appendChild(sc);
  setTimeout(function(){ if(window[cb]) onErr(); },30000);
}

function onDatos(data, trasGuardar){
  _retry=0; _ultimoError='';
  if(!data || data.error){ hideLoad(); toast((data && data.error) || 'Respuesta vac&iacute;a','err'); return; }
  D=data;
  try{ localStorage.setItem('gym_cache', JSON.stringify(data)); }catch(e){}
  if(D.allowed_emails && D.allowed_emails.length && D.allowed_emails.indexOf(userEmail)===-1){ showDenied(); return; }
  $('h-update').innerHTML=APP_VER+' &middot; '+(D.lastUpdate||'');
  ocultarOffline();
  afterData(); hideLoad();
}

var _first=true;
function afterData(){
  if(_first){
    _first=false;
    curDate=todayISO();
    /* al recargar la pagina se vuelve a la pestana donde estabas */
    try{
      var t=localStorage.getItem('gym_tab');
      if(t && $('p-'+t)) activeTab=t;
    }catch(e){}
  }
  /* si este telefono nunca eligio tema, toma el que quedo guardado en la cuenta */
  sincronizarTema();

  /* refrescar no debe moverte de lugar: se conserva pestana y posicion de scroll */
  var y = window.scrollY;

  /* si hay una sesion a medio cargar, NO se pisa: antes un toque en refrescar borraba
     todo lo tildado sin aviso (estaba pegado al de salir; hoy los dos viven en la ruedita) */
  if(!draftDirty) loadDraft();
  limpiarRecordatorios();
  render();
  switchTab(activeTab, true);
  window.scrollTo(0, y);

  if(draftDirty) toast('Datos actualizados &middot; tu sesi&oacute;n sin guardar sigue ac&aacute;');
}
function tryCache(){
  try{
    var c=localStorage.getItem('gym_cache');
    if(c){ D=JSON.parse(c); if(!D.error){ afterData(); hideLoad(); } }
  }catch(e){}
}

/* ==================================================================
   AUTH
   ================================================================== */
/* La sesion dura 30 dias, no 55 minutos.
   El access_token de Google expira en 1 hora, pero la app NO lo necesita para operar:
   fetchData es JSONP (sin token) y apiPost se valida contra la hoja ACCESO por email.
   El token solo servia para averiguar el mail al ingresar. Atar la sesion a su
   vencimiento hacia que Diego tuviera que loguearse cada hora. */
var SESION_DIAS = 30;
function saveSess(){
  try{
    localStorage.setItem('gym_mail', userEmail);
    localStorage.setItem('gym_exp', String(Date.now() + SESION_DIAS*24*60*60*1000));
    if(accessToken) localStorage.setItem('gym_tok', accessToken);
  }catch(e){}
}
function loadSess(){
  try{
    var exp=parseInt(localStorage.getItem('gym_exp')||'0',10);
    var em=(localStorage.getItem('gym_mail')||'').toLowerCase().trim();
    if(em && exp>Date.now()){
      userEmail=em;
      accessToken=localStorage.getItem('gym_tok')||null;
      return true;
    }
  }catch(e){}
  return false;
}
function clearSess(){
  try{
    localStorage.removeItem('gym_tok');
    localStorage.removeItem('gym_exp');
    localStorage.removeItem('gym_mail');
  }catch(e){}
}
function showApp(){ $('login-screen').style.display='none'; $('app').style.display='block'; }
function showDenied(){
  hideLoad();
  $('app').style.display='none'; $('login-screen').style.display='none';
  $('denied-mail').textContent = userEmail+' no esta en la lista de acceso.';
  $('denied').style.display='flex';
}
function hideLoad(){ $('loader').style.display='none'; }

function initAuth(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){ setTimeout(initAuth,250); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id:CLIENT_ID, scope:'openid email profile',
    callback:function(r){
      if(r.error) return;
      accessToken=r.access_token;
      fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+accessToken}})
        .then(function(res){ return res.json(); })
        .then(function(info){ userEmail=(info.email||'').toLowerCase().trim(); })
        .catch(function(){})
        .then(function(){ saveSess(); showApp(); tryCache(); fetchData(); });
    }
  });
  if(loadSess()){ showApp(); tryCache(); fetchData(); }
  else { hideLoad(); $('login-screen').style.display='flex'; }
}

   INIT
   ================================================================== */


window.addEventListener('load', function(){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    (function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.t); }); })(tabs[i]);
  }
  $('btn-login').addEventListener('click', function(){ tokenClient.requestAccessToken({prompt:'select_account'}); });
  /* Actualizar y Salir se fueron adentro de la ruedita, junto al selector de tema */
  $('btn-set').addEventListener('click', openAjustes);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });
  aplicarTema(temaActual());
  initAuth();
});
