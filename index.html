<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E0E14">
<title>Gym &middot; Programa Diego</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E0E14'/%3E%3Cpath d='M8 12v8M24 12v8M11 16h10' stroke='%237C5CFF' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Asap:wght@300;400;500;600;700&family=Asap+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#0E0E14; --surface:#16161F; --surface2:#1D1D28; --surface3:#24242F;
  --border:#2A2A38; --hairline:#22222E;
  --text:#ECECF2; --muted:#8A8A9C; --dim:#5E5E70;
  --violet:#7C5CFF; --violet-2:#9D85FF; --violet-lt:rgba(124,92,255,.14);
  --green:#2BE08A; --green-2:#5BEDA8; --green-lt:rgba(43,224,138,.13);
  --cyan:#3BE0D0; --cyan-lt:rgba(59,224,208,.13);
  --red:#FF4D5E; --red-lt:rgba(255,77,94,.13);
  --r-sm:8px; --r:12px; --r-lg:16px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:'Asap',system-ui,sans-serif}
body{min-height:100vh;font-size:15px;line-height:1.45;padding-bottom:40px}
.cond{font-family:'Asap Condensed','Asap',sans-serif}
.kick{font-family:'Asap Condensed','Asap',sans-serif;font-size:.62rem;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}

/* ---------- LOGIN ---------- */
#login-screen{position:fixed;inset:0;z-index:900;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.lg-mark{width:78px;height:78px;border-radius:22px;margin-bottom:26px;
  background:linear-gradient(135deg,var(--violet),var(--green));
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 40px rgba(124,92,255,.35)}
.lg-mark svg{width:40px;height:40px;stroke:#0E0E14;stroke-width:3;fill:none;stroke-linecap:round}
.lg-t{font-size:2rem;font-weight:700;letter-spacing:-.04em;margin-bottom:6px}
.lg-s{color:var(--muted);font-size:.95rem;max-width:300px;margin-bottom:32px}
.btn-g{display:flex;align-items:center;gap:11px;background:#fff;color:#1a1a1a;font-weight:600;
  font-size:.95rem;padding:13px 26px;border-radius:11px;transition:transform .15s,box-shadow .15s}
.btn-g:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.btn-g svg{width:19px;height:19px}

/* ---------- LOADER ---------- */
#loader{position:fixed;inset:0;z-index:950;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--violet);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- APP SHELL ---------- */
#app{display:none}
header{position:sticky;top:0;z-index:300;background:rgba(14,14,20,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:11px 16px;
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.h-l{display:flex;align-items:center;gap:11px;min-width:0}
.h-mark{width:33px;height:33px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--violet),var(--green));
  display:flex;align-items:center;justify-content:center}
.h-mark svg{width:18px;height:18px;stroke:#0E0E14;stroke-width:3.2;fill:none;stroke-linecap:round}
.h-t{font-size:1.05rem;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.h-d{font-size:.66rem;color:var(--dim);font-family:'Asap Condensed',sans-serif;
  text-transform:uppercase;letter-spacing:.1em}
.h-r{display:flex;align-items:center;gap:7px;flex:0 0 auto}
.ibtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;transition:.15s}
.ibtn:hover{border-color:var(--violet);color:var(--violet-2)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- BANNER ---------- */
#banner{background:var(--red-lt);border-bottom:1px solid rgba(255,77,94,.3);
  padding:11px 16px;display:flex;align-items:flex-start;gap:11px}
#banner.hide{display:none}
#banner .bi{flex:0 0 auto;width:18px;height:18px;stroke:var(--red);stroke-width:2;fill:none;margin-top:1px}
#banner p{font-size:.83rem;color:#FFA8B1;flex:1;line-height:1.4}
#banner b{color:var(--red);font-weight:700}
#banner button{flex:0 0 auto;color:var(--red);opacity:.75;font-size:1.1rem;line-height:1;padding:2px 4px}

/* ---------- TABS ---------- */
nav.tabs{position:sticky;top:56px;z-index:290;background:var(--bg);
  border-bottom:1px solid var(--border);display:flex;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:88px;padding:13px 14px 11px;font-family:'Asap Condensed',sans-serif;
  font-size:.76rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);
  border-bottom:2px solid transparent;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--muted)}
.tab.on{color:var(--violet-2);border-bottom-color:var(--violet)}

main{padding:20px 16px 30px;max-width:940px;margin:0 auto}
.panel{display:none;animation:pin .3s ease}
.panel.on{display:block}
@keyframes pin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.ptitle{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;margin-bottom:3px}
.psub{font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dim);margin-bottom:20px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;margin-bottom:14px}
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec .bar{width:3px;height:16px;border-radius:2px;background:var(--violet)}
.sec h3{font-size:1rem;font-weight:700;letter-spacing:-.02em}
.sec .cnt{margin-left:auto;font-family:'Asap Condensed',sans-serif;font-size:.7rem;
  letter-spacing:.1em;color:var(--dim);text-transform:uppercase}

/* ---------- DISCOS A/B/C ---------- */
.discs{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:18px}
.disc{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:15px 8px 13px;text-align:center;transition:.18s;overflow:hidden}
.disc:hover{border-color:var(--surface3);transform:translateY(-2px)}
.disc .ring{width:46px;height:46px;border-radius:50%;margin:0 auto 9px;
  border:4px solid var(--border);display:flex;align-items:center;justify-content:center;
  font-size:1.15rem;font-weight:700;color:var(--dim);transition:.18s}
.disc .dn{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);line-height:1.25;transition:.18s}
.disc.on{background:var(--surface2)}
.disc.on .dn{color:var(--text)}
.disc[data-d="A"].on{border-color:var(--violet)}
.disc[data-d="A"].on .ring{border-color:var(--violet);color:var(--violet-2);background:var(--violet-lt)}
.disc[data-d="B"].on{border-color:var(--green)}
.disc[data-d="B"].on .ring{border-color:var(--green);color:var(--green-2);background:var(--green-lt)}
.disc[data-d="C"].on{border-color:var(--cyan)}
.disc[data-d="C"].on .ring{border-color:var(--cyan);color:var(--cyan);background:var(--cyan-lt)}
.disc .dot{position:absolute;top:8px;right:9px;width:6px;height:6px;border-radius:50%;background:var(--green)}

/* ---------- FILA DE FECHA ---------- */
.daterow{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.daterow label{flex:0 0 auto}
input[type=date],input[type=number],input[type=text],textarea{
  background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;
  font-size:.9rem;color:var(--text);outline:none;transition:.15s;width:100%}
input:focus,textarea:focus{border-color:var(--violet);background:var(--surface3)}
input[type=date]{color-scheme:dark;width:auto;min-width:150px}

/* ---------- EJERCICIO ---------- */
.ex{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;transition:.18s}
.ex.done{border-color:rgba(43,224,138,.4);background:linear-gradient(90deg,var(--green-lt),transparent 55%)}
.ex-top{display:flex;align-items:flex-start;gap:12px}
.chk{flex:0 0 auto;width:26px;height:26px;border-radius:8px;border:2px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:.15s;margin-top:1px}
.chk svg{width:14px;height:14px;stroke:#0E0E14;stroke-width:3.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.chk.on svg{opacity:1}
.ex-body{flex:1;min-width:0}
.ex-n{font-size:.94rem;font-weight:600;line-height:1.3;letter-spacing:-.01em}
.ex-s{font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--violet-2);margin-top:2px}
.ex-yt{flex:0 0 auto;width:31px;height:31px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface2);display:flex;align-items:center;justify-content:center;transition:.15s}
.ex-yt:hover{border-color:var(--red);color:var(--red)}
.ex-yt svg{width:15px;height:15px;stroke:currentColor;stroke-width:2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.ex-bot{display:flex;align-items:center;gap:9px;margin-top:11px;padding-left:38px;flex-wrap:wrap}
.wbox{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);
  border-radius:9px;padding:4px 10px 4px 4px}
.wbox input{width:62px;background:transparent;border:none;padding:5px 4px;text-align:center;
  font-size:.95rem;font-weight:600}
.wbox input:focus{background:transparent;border:none}
.wbox span{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;
  letter-spacing:.09em;color:var(--dim);text-transform:uppercase}
.meta{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;letter-spacing:.05em;
  color:var(--dim);text-transform:uppercase}
.meta b{color:var(--muted);font-weight:700}
.sug{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:3px 9px;border-radius:20px;transition:.15s}
.sug.up{background:var(--green-lt);color:var(--green-2)}
.sug.same{background:var(--surface3);color:var(--muted)}
.sug:hover{filter:brightness(1.3)}

/* ---------- SIMPLES (calor / estiramientos / habitos) ---------- */
.simple{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:11px 13px;margin-bottom:7px;transition:.15s}
.simple.done{border-color:rgba(43,224,138,.35)}
.simple .sb{flex:1;min-width:0}
.simple .sn{font-size:.9rem;font-weight:500}
.simple .ss{font-family:'Asap Condensed',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--dim);margin-top:1px}

/* ---------- BOTONES ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;
  border-radius:11px;font-weight:600;font-size:.94rem;transition:.16s;border:1px solid transparent}
.btn-p{background:var(--violet);color:#fff}
.btn-p:hover{background:var(--violet-2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(124,92,255,.32)}
.btn-p:disabled{opacity:.5;transform:none;box-shadow:none;cursor:default}
.btn-o{background:var(--surface);border-color:var(--border);color:var(--text)}
.btn-o:hover{border-color:var(--violet);color:var(--violet-2)}
.btn-full{width:100%}
.btn svg{width:17px;height:17px;stroke:currentColor;stroke-width:2.2;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:14px 15px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--violet)}
.kpi.g::before{background:var(--green)}
.kpi.c::before{background:var(--cyan)}
.kpi .kl{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.kpi .kv{font-size:1.85rem;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .kf{font-family:'Asap Condensed',sans-serif;font-size:.68rem;letter-spacing:.06em;
  text-transform:uppercase;color:var(--dim);margin-top:5px}

/* ---------- MACROS ---------- */
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:16px}
.macro{background:var(--surface2);border-radius:var(--r);padding:14px 12px;text-align:center;
  border:1px solid var(--border)}
.macro .mv{font-size:1.5rem;font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.macro .ml{font-family:'Asap Condensed',sans-serif;font-size:.63rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:3px}
.macro.p .mv{color:var(--violet-2)} .macro.g .mv{color:var(--green-2)} .macro.c .mv{color:var(--cyan)}

/* ---------- HISTORIAL ---------- */
.hrow{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r);padding:13px 14px;margin-bottom:8px;transition:.15s}
.hrow:hover{border-color:var(--surface3)}
.hbadge{flex:0 0 auto;width:38px;height:38px;border-radius:11px;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:1.05rem}
.hbadge.A{background:var(--violet-lt);color:var(--violet-2)}
.hbadge.B{background:var(--green-lt);color:var(--green-2)}
.hbadge.C{background:var(--cyan-lt);color:var(--cyan)}
.hb{flex:1;min-width:0}
.hd{font-size:.92rem;font-weight:600}
.hm{font-family:'Asap Condensed',sans-serif;font-size:.71rem;font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--dim);margin-top:1px}
.hn{font-size:.79rem;color:var(--muted);margin-top:4px;font-style:italic;line-height:1.35}
.hpill{flex:0 0 auto;font-family:'Asap Condensed',sans-serif;font-size:.72rem;font-weight:700;
  letter-spacing:.05em;padding:4px 10px;border-radius:20px;background:var(--surface3);color:var(--muted)}
.hpill.full{background:var(--green-lt);color:var(--green-2)}

/* ---------- TABLA ---------- */
table{width:100%;border-collapse:collapse;font-size:.87rem}
th{background:var(--surface2);font-family:'Asap Condensed',sans-serif;font-size:.66rem;font-weight:700;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:10px;text-align:left;
  border-bottom:1px solid var(--border)}
td{padding:10px;border-bottom:1px solid var(--hairline);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}

.empty{text-align:center;padding:36px 20px;color:var(--dim);font-size:.9rem}
.chartbox{position:relative;height:250px}
.hint{font-size:.82rem;color:var(--muted);line-height:1.5}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,100px);z-index:800;
  background:var(--surface3);border:1px solid var(--border);border-radius:11px;padding:13px 20px;
  font-size:.88rem;font-weight:500;box-shadow:var(--shadow);opacity:0;transition:.28s;max-width:88vw;text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.ok{border-color:var(--green);color:var(--green-2)}
#toast.err{border-color:var(--red);color:#FFA8B1}

/* ---------- DESKTOP ---------- */
@media(min-width:720px){
  body{font-size:15.5px}
  main{padding:28px 32px 40px}
  .ptitle{font-size:1.95rem}
  .discs{gap:14px}
  .disc{padding:19px 12px 16px}
  .disc .ring{width:56px;height:56px;font-size:1.35rem}
}
</style>
</head>
<body>

<!-- ============ LOADER ============ -->
<div id="loader"><div class="spin"></div><div class="kick">Cargando</div></div>

<!-- ============ LOGIN ============ -->
<div id="login-screen">
  <div class="lg-mark"><svg viewBox="0 0 24 24"><path d="M5 9v6M19 9v6M8 12h8M3 11v2M21 11v2"/></svg></div>
  <div class="lg-t">Programa de entrenamiento</div>
  <div class="lg-s">Tu rutina, tus pesos y tu progreso. Ingres&aacute; con tu cuenta de Google.</div>
  <button class="btn-g" id="btn-login">
    <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.65l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.11a6.6 6.6 0 0 1 0-4.22V7.05H2.18a11 11 0 0 0 0 9.9l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84c.87-2.6 3.3-4.51 6.16-4.51z"/></svg>
    Ingresar con Google
  </button>
</div>

<!-- ============ ACCESO DENEGADO ============ -->
<div id="denied" style="display:none;position:fixed;inset:0;z-index:900;background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center">
  <div class="lg-t" style="color:var(--red)">Sin acceso</div>
  <div class="lg-s" id="denied-mail"></div>
  <button class="btn btn-o" onclick="location.reload()">Volver</button>
</div>

<!-- ============ APP ============ -->
<div id="app">

<header>
  <div class="h-l">
    <div class="h-mark"><svg viewBox="0 0 24 24"><path d="M5 9v6M19 9v6M8 12h8M3 11v2M21 11v2"/></svg></div>
    <div>
      <div class="h-t">Entrenamiento</div>
      <div class="h-d" id="h-update">&mdash;</div>
    </div>
  </div>
  <div class="h-r">
    <button class="ibtn" id="btn-reload" title="Actualizar">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
    </button>
    <button class="ibtn" id="btn-out" title="Salir">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</header>

<div id="banner">
  <svg class="bi" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <p><b>Pendiente:</b> apto f&iacute;sico con enfoque cardiol&oacute;gico antes de subir intensidad (fumador, +5 a&ntilde;os sedentario).</p>
  <button onclick="closeBanner()" title="Cerrar">&#10005;</button>
</div>

<nav class="tabs">
  <button class="tab on" data-t="train">Entrenar</button>
  <button class="tab" data-t="plan">Plan</button>
  <button class="tab" data-t="prog">Progreso</button>
  <button class="tab" data-t="hist">Historial</button>

/* ==================================================================
   UTILS
   ================================================================== */
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function pad(n){ return (n<10?'0':'')+n; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

var MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS  = ['domingo','lunes','martes','mi&eacute;rcoles','jueves','viernes','s&aacute;bado'];

function parseISO(s){
  var p = String(s||'').split('-');
  return new Date(+p[0], (+p[1])-1, +p[2]);
}
function fDate(s){
  var d = parseISO(s);
  if(isNaN(d)) return s;
  return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()];
}
function fShort(s){
  var d = parseISO(s);
  if(isNaN(d)) return s;
  return d.getDate()+' '+MESES[d.getMonth()];
}
/* lunes de la semana de una fecha */
function monday(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var day = (x.getDay()+6)%7;          // 0=lunes
  x.setDate(x.getDate()-day);
  return x;
}
function weekKey(iso){
  var m = monday(parseISO(iso));
  return m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(m.getDate());
}

function toast(msg, type){
  var el = $('toast');
  el.innerHTML = msg;
  el.className = (type||'')+' show';
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.className = el.className.replace('show',''); }, 3200);
}

function allEx(day){ return DAYS[day].ex; }
function exById(id){

}

/* ==================================================================

   ================================================================== */
/* ultimo registro de un ejercicio: la sesion mas reciente donde tiene peso cargado */
function lastRecord(exId){
  if(!D || !D.sessions) return null;
  for(var i=0;i<D.sessions.length;i++){
    var it = D.sessions[i].items[exId];
    if(it && it.weight !== '' && !isNaN(parseFloat(it.weight))){
      return {weight:parseFloat(it.weight), done:it.done===true, date:D.sessions[i].date};
    }
  }
  return null;
}
/* +5% redondeado a 0,5 con minimo +0,5 si la ultima vez lo completo */
function suggest(rec){
  if(!rec) return null;
  if(!rec.done) return {v:rec.weight, up:false};
  var v = Math.round(rec.weight*1.05*2)/2;
  if(v < rec.weight+0.5) v = rec.weight+0.5;
  return {v:v, up:true};
}
function fKg(v){
  var n = parseFloat(v);
  if(isNaN(n)) return '';
  return (Math.round(n*10)/10).toString().replace('.',',');
}

/* busca una sesion guardada por fecha + dia */
function sessionFor(date, day){
  if(!D || !D.sessions) return null;
  for(var i=0;i<D.sessions.length;i++){
    if(D.sessions[i].date===date && D.sessions[i].day===day) return D.sessions[i];
  }
  return null;
}
/* carga en el borrador lo que haya guardado para esa fecha+dia */
function loadDraft(){
  draft = {}; notesDraft = ''; wcDraft = {};
  var s = sessionFor(curDate, curDay);
  if(s){
    allEx(curDay).forEach(function(e){
      var it = s.items[e.id];
      draft[e.id] = it ? {weight:it.weight||'', done:it.done===true} : {weight:'', done:false};
    });
    notesDraft = s.notes||'';
  } else {
    allEx(curDay).forEach(function(e){ draft[e.id] = {weight:'', done:false}; });
  }
}
/* propone el dia siguiente en la rotacion A -> B -> C -> A */
function nextDay(){
  if(!D || !D.sessions || !D.sessions.length) return 'A';
  var last = D.sessions[0].day;
  return last==='A' ? 'B' : (last==='B' ? 'C' : 'A');
}

    body.forEach(function(b){
      h += '<tr><td>'+fShort(b.date)+'</td><td>'+(b.weight?fKg(b.weight)+' kg':'&mdash;')+'</td>'+
           '<td>'+(b.waist?fKg(b.waist)+' cm':'&mdash;')+'</td></tr>';
    });
    h += '</tbody></table></div>';
  } else {
    h += '<div class="empty">Todav&iacute;a no hay mediciones. Carg&aacute; la primera arriba.</div>';
  }

  $('p-prog').innerHTML = h;
  if(activeTab==='prog') drawChart();
}

function kpi(label, val, foot, cls){
  return '<div class="kpi '+(cls||'')+'"><div class="kl">'+label+'</div>'+
         '<div class="kv">'+val+'</div><div class="kf">'+foot+'</div></div>';
}

function drawChart(){
  var cv = $('cv-w');
  if(!cv || !window.Chart) return;
  if(chart){ chart.destroy(); chart = null; }
  var body = (D && D.body ? D.body : []).slice().reverse();  // ascendente
  var labels = body.map(function(b){ return fShort(b.date); });
  var vals   = body.map(function(b){ return parseFloat(b.weight); });
  chart = new Chart(cv.getContext('2d'), {
    type:'line',
    data:{ labels:labels, datasets:[{
      data:vals, borderColor:'#2BE08A', backgroundColor:'rgba(43,224,138,.12)',
      borderWidth:2.5, tension:.32, fill:true,
      pointBackgroundColor:'#2BE08A', pointBorderColor:'transparent', pointRadius:4, pointHoverRadius:6
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{
        backgroundColor:'#24242F', borderColor:'#2A2A38', borderWidth:1,
        titleColor:'#ECECF2', bodyColor:'#8A8A9C', padding:10, displayColors:false,
        callbacks:{ label:function(c){ return c.parsed.y+' kg'; } }
      }},
      scales:{
        x:{ grid:{color:'#22222E'}, ticks:{color:'#5E5E70', font:{size:11}} },
        y:{ grid:{color:'#22222E'}, ticks:{color:'#5E5E70', font:{size:11},
            callback:function(v){ return v+' kg'; }} }
      }
    }
  });
}

function saveBody(){
  var date = $('b-date').value, w = $('b-w').value, wa = $('b-waist').value;
  if(!date){ toast('Eleg&iacute; una fecha','err'); return; }
  if(!w){ toast('Falta el peso','err'); return; }
  apiPost('saveBody', {date:date, weight:w, waist:wa}, $('btn-body'))
    .then(function(){ toast('Medici&oacute;n guardada','ok'); fetchData(); })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* ---------------- HISTORIAL ---------------- */
function buildHist(){
  var ss = (D && D.sessions) ? D.sessions : [];
  var h = '';
  h += '<div class="ptitle">Historial</div>';
  h += '<div class="psub">'+ss.length+' sesiones registradas</div>';

  /* semana actual */
  var wkNow = weekKey(todayISO());
  var byWeek = {};
  ss.forEach(function(s){
    var k = weekKey(s.date);
    if(!byWeek[k]) byWeek[k] = {};
    byWeek[k][s.date] = true;
  });
  var thisWeek = byWeek[wkNow] ? Object.keys(byWeek[wkNow]).length : 0;

  /* racha: semanas anteriores consecutivas con 3 o mas */
  var streak = 0;
  var cur = monday(new Date());
  for(var i=0;i<200;i++){
    cur.setDate(cur.getDate()-7);
    var k = cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate());
    var n = byWeek[k] ? Object.keys(byWeek[k]).length : 0;
    if(n >= 3) streak++; else break;
  }

  h += '<div class="kpis">';
  h += kpi('Esta semana', thisWeek+'/3', thisWeek>=3?'Semana cumplida':'Faltan '+(3-thisWeek), thisWeek>=3?'g':'');
  h += kpi('Racha', streak+(streak===1?' semana':' semanas'), 'consecutivas con 3+', 'g');
  h += kpi('Total', ss.length, 'sesiones', 'c');
  h += '</div>';

  /* backup en excel */
  if(D && D.sheetId){
    h += '<div class="card" style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">';
    h += '<div style="flex:1;min-width:170px"><div class="kick">Respaldo</div>'+
         '<div class="hint" style="margin-top:3px">Todo vive en la planilla <b>Gym DB</b> de tu Drive.</div></div>';
    h += '<a class="btn btn-o" href="https://docs.google.com/spreadsheets/d/'+D.sheetId+'/export?format=xlsx" target="_blank">'+
         '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Bajar Excel</a>';
    h += '<a class="btn btn-o" href="https://docs.google.com/spreadsheets/d/'+D.sheetId+'/edit" target="_blank">'+
         '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"/></svg>Abrir planilla</a>';
    h += '</div>';
  }

  h += secHd('Sesiones', 'violet', '');
  if(!ss.length){
    h += '<div class="empty">Todav&iacute;a no hay sesiones guardadas.</div>';
  } else {
    ss.forEach(function(s){
      var tot = DAYS[s.day] ? DAYS[s.day].ex.length : Object.keys(s.items).length;
      var n = 0;
      for(var k in s.items) if(s.items[k].done) n++;
      h += '<div class="hrow">';
      h += '<div class="hbadge '+s.day+'">'+s.day+'</div>';
      h += '<div class="hb"><div class="hd">'+fDate(s.date)+'</div>'+
           '<div class="hm">'+(DAYS[s.day]?DAYS[s.day].t:'')+'</div>'+
           (s.notes?'<div class="hn">'+esc(s.notes)+'</div>':'')+'</div>';
      h += '<div class="hpill'+(n>=tot?' full':'')+'">'+n+'/'+tot+'</div>';
      h += '</div>';
    });
  }

  $('p-hist').innerHTML = h;
}

/* ==================================================================
   GUARDAR SESION
   ================================================================== */
function saveSession(){
  var ex = allEx(curDay);
  var items = {}, names = {};
  var any = false;
  ex.forEach(function(e){
    var st = draft[e.id] || {weight:'', done:false};
    items[e.id] = {weight:st.weight||'', done:st.done===true};
    names[e.id] = e.p;
    if(st.done || st.weight) any = true;
  });
  if(!any){ toast('No marcaste ning&uacute;n ejercicio','err'); return; }

  apiPost('saveSession', {date:curDate, day:curDay, items:items, names:names, notes:notesDraft}, $('btn-save'))
    .then(function(){
      toast('Sesi&oacute;n guardada &middot; '+fShort(curDate),'ok');
      fetchData();
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* ==================================================================
   API
   ================================================================== */
function apiPost(action, payload, btn){
  if(API_URL.indexOf('PEGAR_ACA') === 0){
    return Promise.reject(new Error('Falta pegar la URL del Apps Script en index.html'));
  }
  var old = '';
  if(btn){ btn.disabled = true; old = btn.innerHTML; btn.innerHTML = 'Guardando...'; }
  return fetch(API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:action, secret:SECRET, email:userEmail, payload:payload})
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error||'error desconocido');
      return j;
    })
    .finally(function(){ if(btn){ btn.disabled = false; btn.innerHTML = old; } });
}

var _retry = 0;
function fetchData(){
  if(API_URL.indexOf('PEGAR_ACA') === 0){
    hideLoad();
    toast('Falta pegar la URL del Apps Script en index.html','err');
    return;
  }
  var old = $('_jp'); if(old) old.remove();
  var cb = 'gymCb_'+Date.now();
  window[cb] = function(data){
    _retry = 0;
    delete window[cb];
    var s = $('_jp'); if(s) s.remove();
    if(data.error){ hideLoad(); toast(data.error,'err'); return; }
    D = data;
    try{ localStorage.setItem('gym_cache', JSON.stringify(data)); }catch(e){}
    if(D.allowed_emails && D.allowed_emails.length){
      if(D.allowed_emails.indexOf(userEmail) === -1){ showDenied(); return; }
    }
    $('h-update').textContent = 'Actualizado ' + (D.lastUpdate||'');
    afterData();
    hideLoad();
  };
  var onErr = function(){
    delete window[cb];
    if(_retry < 2){ _retry++; setTimeout(fetchData, 2500); }
    else { _retry = 0; hideLoad(); toast('No pude cargar los datos. Prob&aacute; de nuevo.','err'); }
  };
  var sc = document.createElement('script');
  sc.id = '_jp';
  sc.src = API_URL + '?callback=' + cb + '&t=' + Date.now();
  sc.onerror = onErr;
  document.head.appendChild(sc);
  setTimeout(function(){ if(window[cb]) onErr(); }, 20000);
}

var _first = true;
function afterData(){
  if(_first){
    _first = false;
    curDay = nextDay();
    curDate = todayISO();
  }
  loadDraft();
  render();
}

function tryCache(){
  try{
    var c = localStorage.getItem('gym_cache');
    if(c){ D = JSON.parse(c); if(!D.error){ afterData(); hideLoad(); } }
  }catch(e){}
}

/* ==================================================================
   AUTH
   ================================================================== */
function saveSess(){
  try{
    localStorage.setItem('gym_tok', accessToken);
    localStorage.setItem('gym_mail', userEmail);
    localStorage.setItem('gym_exp', String(Date.now()+55*60*1000));
  }catch(e){}
}
function loadSess(){
  try{
    var tok = localStorage.getItem('gym_tok');
    var exp = parseInt(localStorage.getItem('gym_exp')||'0', 10);
    var em  = (localStorage.getItem('gym_mail')||'').toLowerCase().trim();
    if(tok && exp > Date.now() && em){ accessToken = tok; userEmail = em; return true; }
  }catch(e){}
  return false;
}
function showApp(){
  $('login-screen').style.display = 'none';
  $('app').style.display = 'block';
}
function showDenied(){
  hideLoad();
  $('app').style.display = 'none';
  $('login-screen').style.display = 'none';
  $('denied-mail').textContent = userEmail + ' no esta en la lista de acceso.';
  $('denied').style.display = 'flex';
}
function hideLoad(){ $('loader').style.display = 'none'; }

function initAuth(){
  if(!(window.google && google.accounts && google.accounts.oauth2)){
    setTimeout(initAuth, 250);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: 'openid email profile',
    callback: function(r){
      if(r.error) return;
      accessToken = r.access_token;
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+accessToken}})
        .then(function(res){ return res.json(); })
        .then(function(info){ userEmail = (info.email||'').toLowerCase().trim(); })
        .catch(function(){})
        .then(function(){ saveSess(); showApp(); tryCache(); fetchData(); });
    }
  });
  if(loadSess()){
    showApp(); tryCache(); fetchData();
  } else {
    hideLoad();
    $('login-screen').style.display = 'flex';
  }
}

/* ==================================================================
   INIT
   ================================================================== */
function closeBanner(){
  $('banner').classList.add('hide');
  try{ localStorage.setItem('gym_banner','off'); }catch(e){}
}

window.addEventListener('load', function(){
  try{ if(localStorage.getItem('gym_banner')==='off') $('banner').classList.add('hide'); }catch(e){}

  var tabs = document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    (function(b){ b.addEventListener('click', function(){ switchTab(b.dataset.t); }); })(tabs[i]);
  }
  $('btn-login').addEventListener('click', function(){
    tokenClient.requestAccessToken({prompt:'select_account'});
  });
  $('btn-reload').addEventListener('click', function(){ fetchData(); toast('Actualizando...'); });
  $('btn-out').addEventListener('click', function(){
    try{
      localStorage.removeItem('gym_tok');
      localStorage.removeItem('gym_exp');
    }catch(e){}
    if(accessToken && window.google && google.accounts){
      google.accounts.oauth2.revoke(accessToken, function(){ location.reload(); });
    } else { location.reload(); }
  });

  initAuth();
});
