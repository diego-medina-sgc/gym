  h += '<div class="mttl"><h3>Mis rutinas</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';
  h += '<div class="hint" style="margin-bottom:14px">Guard&aacute; hasta '+MAX_RUTINAS+' sets de ejercicios. '+
       'La marcada con estrella es la que se carga sola en una sesi&oacute;n nueva.</div>';

  if(rs.length){
    rs.forEach(function(r){
      var ed = (rutEdit === r.slot);
      h += '<div class="rutrow">';
      h += '<button class="rut-star'+(r.def?' on':'')+'" onclick="marcarDefault('+r.slot+')">'+
           (r.def?'&#9733;':'&#9734;')+'</button>';
      /* tocar el nombre despliega sus ejercicios para ordenarlos */
      h += '<button class="rut-info" onclick="toggleRutEdit('+r.slot+')">'+
           '<span class="rut-n">'+esc(r.nombre)+'</span>'+
           '<span class="rut-c">'+(r.ex||[]).length+' ejercicios &middot; '+
           (ed ? 'cerrar &#9650;' : 'ordenar &#9660;')+'</span></button>';
      h += '<button class="rut-usar" onclick="usarRutina('+r.slot+');closeModal()">Usar</button>';
      h += '<button class="mx" onclick="borrarRutina('+r.slot+')">&#10005;</button>';
      h += '</div>';
      if(ed){
        h += '<div class="rutedit">';
        h += '<div class="hint" style="margin:10px 0">Arrastr&aacute; desde los puntitos para cambiar el orden.</div>';
        h += '<div id="rutlist">';
        (rutEditEx||[]).forEach(function(e){
          h += '<div class="rutex" data-drag="'+esc(e.id)+'">'+
               '<span class="rutex-n">'+dispName(e.id, e.n)+'</span>'+
               '<span class="rutex-s">'+esc(e.s)+'x'+esc(e.r)+'</span>'+
               gripHTML('rutlist')+'</div>';
        });
        h += '</div>';
        h += '<button class="btn btn-p btn-full" id="btn-rutord" onclick="guardarOrdenRutina()">Guardar orden</button>';
        h += '</div>';
      }
    });
  } else {
    h += '<div class="empty" style="padding:18px">Todav&iacute;a no guardaste ninguna.</div>';
  }

  h += '<div class="mdiv"><span>guardar la de ahora</span></div>';
  h += '<div class="hint" style="margin-bottom:10px">Se guardan los <b>'+draftOrder.length+
       ' ejercicios</b> que ten&eacute;s en pantalla, con sus series y reps. Los pesos no.</div>';

       '<input type="text" id="rut-nombre" placeholder="Ej: Mi rutina" value="'+esc(rutNombre)+'" '+
       'oninput="rutNombre=this.value"></div>';
  h += '<div class="fl kick" style="margin-bottom:6px">Guardar en</div><div class="grow">';
  for(var i=1;i<=MAX_RUTINAS;i++){

    h += '<button class="gbtn rut-slot'+(rutSlot===i?' on':'')+'" data-s="'+i+'" onclick="setRutSlot('+i+')">'+
         (ocupada ? esc(ocupada.nombre).slice(0,10) : 'Libre '+i)+'</button>';
  }
  h += '</div>';
  h += '<button class="btn btn-p btn-full" id="btn-rut" onclick="guardarRutina()">Guardar rutina</button>';

  $('modal-box').innerHTML = h;
}
function setRutSlot(i){

/* ==================================================================
   ORDEN DE LOS EJERCICIOS (v13)
   En la sesion del dia: se arrastra y el orden viaja con la sesion guardada.
   En una rutina: se ordena desde el modal de rutinas.
   La rutina de arranque manda el orden de un dia nuevo. Si Diego reordena el dia
   y tiene rutina de arranque, aparece un boton para llevarse ese orden a la rutina:
   si no, al dia siguiente volveria el orden viejo y pareceria que no se guardo.
   ================================================================== */
var rutEdit = null, rutEditEx = null;   // rutina desplegada en el modal y su copia de trabajo
var ordenCambiado = false;              // Diego reordeno la sesion en pantalla

function toggleRutEdit(slot){
  if(rutEdit === slot){ rutEdit = null; rutEditEx = null; }
  else {
    var r = null;
    rutinas().forEach(function(x){ if(x.slot === slot) r = x; });
    rutEdit = slot;
    rutEditEx = r ? (r.ex||[]).slice() : [];
  }
  renderRutinas();
}
function guardarOrdenRutina(){
  if(rutEdit === null || !rutEditEx) return;
  var rs = rutinas().map(function(r){
    return {slot:r.slot, nombre:r.nombre, ex: r.slot === rutEdit ? rutEditEx : r.ex, def:r.def};
  });
  apiPost('saveRutinas', {rutinas:rs}, $('btn-rutord'))
    .then(function(){
      if(D) D.rutinas = rs;
      rutEdit = null; rutEditEx = null;
      renderRutinas(); buildTrain();
      toast('Orden guardado','ok');
      fetchData(true);
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* la sesion en pantalla tiene los ejercicios de la rutina de arranque en otro orden */
function ordenDistinto(){
  var rd = rutinaDefault();
  if(!rd || !rd.ex) return false;
  var enRut = rd.ex.map(function(e){ return e.id; })
                .filter(function(id){ return draftOrder.indexOf(id) !== -1; });
  var enDraft = draftOrder.filter(function(id){ return enRut.indexOf(id) !== -1; });
  return enRut.join('|') !== enDraft.join('|');
}
/* reordena la rutina de arranque como la sesion en pantalla. Los ejercicios que la
   rutina tiene y hoy no estan quedan al final, en el orden que tenian. */
function guardarOrdenEnRutina(){
  var rd = rutinaDefault();
  if(!rd) return;
  var pos = {};
  draftOrder.forEach(function(id, i){ pos[id] = i; });
  var ex = rd.ex.slice().sort(function(a, b){
    var pa = (pos[a.id] === undefined) ? 1e6 + rd.ex.indexOf(a) : pos[a.id];
    var pb = (pos[b.id] === undefined) ? 1e6 + rd.ex.indexOf(b) : pos[b.id];
    return pa - pb;
  });
  var rs = rutinas().map(function(r){
    return {slot:r.slot, nombre:r.nombre, ex: r.slot === rd.slot ? ex : r.ex, def:r.def};
  });
  apiPost('saveRutinas', {rutinas:rs}, $('btn-ordrut'))
    .then(function(){
      if(D) D.rutinas = rs;
      ordenCambiado = false;
      buildTrain();
      toast('Orden guardado en <b>'+esc(rd.nombre)+'</b>','ok');
      fetchData(true);
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* ---- arrastrar para ordenar ----
   Pointer events, sin librerias. El agarre es solo el icono de puntitos, con
   touch-action:none: asi el resto de la tarjeta sigue scrolleando la pagina normal
   y tocar el nombre sigue abriendo el ejercicio.
   La posicion se recalcula en cada cuadro contra el lugar natural del elemento
   (transform en cero, se mide, se vuelve a aplicar): funciona igual si la lista se
   reordena debajo o si la pantalla scrollea sola cerca de los bordes. */
var drag = null;
var DRAG_FIN = {
  exlist: function(ids){
    draftOrder = ids;
    draftDirty = true;
    ordenCambiado = true;
    buildTrain();
  },
  rutlist: function(ids){
    var porId = {};
    (rutEditEx||[]).forEach(function(e){ porId[e.id] = e; });
    rutEditEx = ids.map(function(id){ return porId[id]; }).filter(Boolean);
    /* el DOM ya esta en el orden nuevo: no hace falta re-renderizar el modal */
  }
};

function gripHTML(listId){
  return '<span class="grip" onpointerdown="dragStart(event,\''+listId+'\')" title="Arrastrar para ordenar">'+
         '<svg viewBox="0 0 10 16" aria-hidden="true">'+
         '<circle cx="2.5" cy="3" r="1.5"/><circle cx="7.5" cy="3" r="1.5"/>'+
         '<circle cx="2.5" cy="8" r="1.5"/><circle cx="7.5" cy="8" r="1.5"/>'+
         '<circle cx="2.5" cy="13" r="1.5"/><circle cx="7.5" cy="13" r="1.5"/></svg></span>';
}

function dragStart(ev, listId){
  if(drag) return;
  if(ev.pointerType === 'mouse' && ev.button !== 0) return;
  var handle = ev.currentTarget || ev.target;
  var item = handle.closest('[data-drag]');
  var list = $(listId);
  if(!item || !list) return;
  ev.preventDefault();
  var r = item.getBoundingClientRect();
  drag = {listId:listId, list:list, item:item, pid:ev.pointerId,
          grab: ev.clientY - r.top, y: ev.clientY, movido:false, raf:0,
          scroller: item.closest('#modal-box')};
  try{ handle.setPointerCapture(ev.pointerId); }catch(e){}
  item.classList.add('dragging');
  document.body.classList.add('arrastrando');
  document.addEventListener('pointermove', dragMove, {passive:false});
  document.addEventListener('pointerup', dragEnd);
  document.addEventListener('pointercancel', dragEnd);
  drag.raf = requestAnimationFrame(dragTick);
}
function dragMove(ev){
  if(!drag || ev.pointerId !== drag.pid) return;
  ev.preventDefault();
  drag.y = ev.clientY;
  drag.movido = true;
  dragPos();
}
function dragPos(){
  var it = drag.item, list = drag.list, sigue = true;
  while(sigue){
    sigue = false;
    var prev = it.previousElementSibling, next = it.nextElementSibling;
    if(prev && prev.hasAttribute('data-drag')){
      var pr = prev.getBoundingClientRect();
      if(drag.y < pr.top + pr.height/2){ list.insertBefore(it, prev); sigue = true; continue; }
    }
    if(next && next.hasAttribute('data-drag')){
      var nr = next.getBoundingClientRect();
      if(drag.y > nr.top + nr.height/2){ list.insertBefore(next, it); sigue = true; }
    }
  }
  it.style.transform = '';
  var top = it.getBoundingClientRect().top;
  it.style.transform = 'translateY('+(drag.y - drag.grab - top)+'px)';
}
/* scroll automatico cerca de los bordes: sin esto no se puede llevar el primer
   ejercicio al final de una lista mas larga que la pantalla */
function dragTick(){
  if(!drag) return;
  if(drag.movido){
    var sc = drag.scroller, top, bot;
    if(sc){ var sr = sc.getBoundingClientRect(); top = sr.top; bot = sr.bottom; }
    else {
      var nav = document.querySelector('nav.tabs');
      top = nav ? nav.getBoundingClientRect().bottom : 0;
      bot = window.innerHeight;
    }
    var zona = 70, v = 0;
    if(drag.y < top + zona) v = -Math.ceil((top + zona - drag.y) / 5);
    else if(drag.y > bot - zona) v = Math.ceil((drag.y - (bot - zona)) / 5);
    if(v){
      if(sc) sc.scrollTop += v; else window.scrollBy(0, v);
      dragPos();
    }
  }
  drag.raf = requestAnimationFrame(dragTick);
}
function dragEnd(ev){
  if(!drag || (ev && ev.pointerId !== undefined && ev.pointerId !== drag.pid)) return;
  cancelAnimationFrame(drag.raf);
  document.removeEventListener('pointermove', dragMove, {passive:false});
  document.removeEventListener('pointerup', dragEnd);
  document.removeEventListener('pointercancel', dragEnd);
  var d = drag;
  drag = null;
  d.item.classList.remove('dragging');
  d.item.style.transform = '';
  document.body.classList.remove('arrastrando');
  var ids = [].slice.call(d.list.querySelectorAll('[data-drag]'))
              .map(function(x){ return x.getAttribute('data-drag'); });
  if(d.movido && DRAG_FIN[d.listId]) DRAG_FIN[d.listId](ids);
}

/* ==================================================================
   MODALIDAD Y RECOMENDACION (v16)
   Doble progresion: dentro del rango de reps de la modalidad se suman reps; al
   llegar al tope se sube un escalon de peso y se vuelve al minimo. Si cambia la
   modalidad, el peso se recalcula con la formula de Epley (1RM = kg x (1 + reps/30)).
   "Tonificar" no es un estimulo aparte: lo que se ve tonificado es musculo con
   menos grasa encima, y eso depende sobre todo de la comida y el cardio. Definir
   usa mas reps y menos descanso, que es lo que se suele buscar con esa palabra.
   ================================================================== */
var MODOS = {
  crecer:  {lbl:'Crecer',  min:8,  max:12, series:3, rest:'90 a 120 s',
            txt:'Hipertrofia: 8 a 12 reps dejando 1 o 2 en reserva. Primero sum&aacute;s reps y al llegar a 12 sub&iacute;s peso.'},
  fuerza:  {lbl:'Fuerza',  min:4,  max:6,  series:4, rest:'2 a 3 min',
            txt:'Pocas reps pesadas (4 a 6) con descansos largos. Prioriza subir el peso.'},
  definir: {lbl:'Definir', min:12, max:20, series:3, rest:'45 a 60 s',
            txt:'Lo que se suele llamar tonificar: 12 a 20 reps con descansos cortos. Ojo: lo que hace que el m&uacute;sculo se vea marcado es tener menos grasa encima, y eso depende sobre todo de la comida y el cardio.'}
};
var openRec = null;
/* Objetivo POR EJERCICIO (v17). Antes habia uno solo para toda la sesion, y no
   servia: en el mismo dia se puede querer fuerza en la sentadilla y definir en los
   vuelos. Se guarda en PREFS como {idEjercicio: modo}, asi viaja entre telefonos.
   Si un ejercicio nunca se toco, hereda el objetivo global viejo ('modo'), que es
   lo que Diego ya tenia elegido: nadie arranca de cero. */
function modosEx(){ return pref('modoEx', {}); }
function modoDe(id){
  var m = modosEx()[id];
  if(MODOS[m]) return m;
  var g = pref('modo', 'crecer');                 /* el global viejo, como punto de partida */
  return MODOS[g] ? g : 'crecer';
}
/* si un ejercicio ya esta en ese objetivo, volver a tocarlo no hace nada */
function setModoEx(id, m){
  if(!MODOS[m] || modoDe(id) === m) return;
  var mp = copia(modosEx());
  mp[id] = m;
  setPref('modoEx', mp);
  openRec = null;
  buildTrain();
}
function toggleRec(id){ openRec = (openRec === id) ? null : id; buildTrain(); }

/* los registros HECHOS de un ejercicio, del mas viejo al mas nuevo. hasta = excluye esa fecha */
function historialEx(id, hasta){
  var out = [];
  ((D && D.sessions) ? D.sessions : []).forEach(function(s){
    if(hasta && s.date >= hasta) return;
    var it = s.items[id];
    if(it && it.done) out.push({date:s.date, weight:it.weight, series:it.series, reps:it.reps, rir:it.rir});
  });
  out.sort(function(a,b){ return a.date < b.date ? -1 : 1; });
  return out;
}
/* el peso real mas cercano a un objetivo, contando escalones desde el actual */
function aEscalon(w, obj, p){
  var n = Math.round((obj - w) / p);
  return Math.max(p, Math.round((w + n*p)*100)/100);
}

function recomendar(id){
  var mk = modoDe(id), M = MODOS[mk];
  var hs = historialEx(id, curDate), u = hs[hs.length-1];
  var rango = M.min+' a '+M.max+' reps';
  var pie = ' Descanso sugerido: '+M.rest+'.';
  if(!u){
    return {que:'Eleg&iacute; un peso con el que llegues a '+M.series+'x'+M.max+' dejando 2 reps en reserva.',
            por:'Todav&iacute;a no hay historial de este ejercicio. En '+M.lbl.toLowerCase()+' se trabaja en '+rango+'.'+pie,
            set:{series:M.series, reps:M.max}};
  }
  var w = nf(u.weight), sr = nf(u.series) || M.series, r = nf(u.reps);
  var rir = (u.rir === '' || u.rir === undefined || u.rir === null) ? null : nf(u.rir);
  var tgt = Math.round((M.min + M.max) / 2);
  var ult = 'La &uacute;ltima vez ('+fShort(u.date)+'): '+(w ? fKg(w)+' kg &middot; ' : '')+sr+'x'+r+
            (rir !== null ? ' &middot; RIR '+rir : '')+'. ';
  var est = estancados(4).filter(function(e){ return e.id === id; })[0];
  var nota = est ? ' Hace '+est.n+' sesiones que est&aacute;s en '+fKg(est.w)+' kg.' : '';

  /* sin peso (captain's chair, abdominales): se progresa en reps y despues en series */
  if(!w){
    if(mk === 'fuerza') return {que:'Sum&aacute; carga (un disco o una mancuerna) y hac&eacute; '+M.series+'x'+M.max+'.',
        por:ult+'Para fuerza hacen falta pocas repeticiones pesadas: sin carga extra no se llega a ese rango.'+pie,
        set:{series:M.series, reps:M.max}};
    if(r < M.max){
      var nr0 = Math.min(M.max, r + 2);
      return {que:'Mismo ejercicio, apunt&aacute; a '+sr+'x'+nr0+'.',
        por:ult+'Sin peso se progresa sumando repeticiones hasta el tope del rango ('+rango+').'+pie,
        set:{series:sr, reps:nr0}};
    }
    if(sr < 4) return {que:'Sum&aacute; una serie: '+(sr+1)+'x'+r+'.',
        por:ult+'Ya est&aacute;s en el tope de repeticiones; el paso siguiente es otra serie.'+pie,
        set:{series:sr+1, reps:r}};
    return {que:'Sum&aacute; carga y volv&eacute; a '+sr+'x'+M.min+'.',
        por:ult+'Con '+sr+'x'+r+' ya est&aacute;s arriba del rango: para seguir creciendo hace falta m&aacute;s resistencia, no m&aacute;s repeticiones.'+pie,
        set:{series:sr, reps:M.min}};
  }

  var p = pasoDe(id), rm = w * (1 + r/30);
  if(r > M.max + 1){
    var nw = aEscalon(w, rm/(1 + tgt/30), p);
    if(nw <= w) nw = subirPeso(id, w);
    var ns = Math.max(sr, M.series);
    return {que:'Sub&iacute; a <b>'+fKg(nw)+' kg</b> y hac&eacute; '+ns+'x'+tgt+'.',
      por:ult+'Para '+M.lbl.toLowerCase()+' conviene '+rango+'. Con tu marca, '+fKg(nw)+' kg te deja cerca de '+tgt+' reps.'+nota+pie,
      set:{weight:nw, series:ns, reps:tgt}};
  }
  if(r < M.min - 1){
    var bw = aEscalon(w, rm/(1 + tgt/30), p);
    if(bw >= w) bw = Math.max(p, Math.round((w - p)*100)/100);
    return {que:'Baj&aacute; a <b>'+fKg(bw)+' kg</b> y hac&eacute; '+sr+'x'+tgt+'.',
      por:ult+'Para '+M.lbl.toLowerCase()+' conviene '+rango+': menos peso y m&aacute;s repeticiones.'+pie,
      set:{weight:bw, series:sr, reps:tgt}};
  }
  /* completar el tope sube el peso aunque la ultima serie haya sido al fallo: Diego
     anota RIR 0 casi siempre, y frenar ahi lo dejaba sin subir nunca */
  if(r >= M.max || (rir !== null && rir >= 3)){
    var sw = subirPeso(id, w);
    return {que:'Sub&iacute; a <b>'+fKg(sw)+' kg</b> y volv&eacute; a '+sr+'x'+M.min+'.',
      por:ult+(r >= M.max
        ? 'Completaste el tope del rango ('+M.max+' reps). Es la doble progresi&oacute;n: cuando complet&aacute;s el m&aacute;ximo, sub&iacute;s un escal&oacute;n y volv&eacute;s al m&iacute;nimo.'+
          (rir === 0 ? ' Sub&iacute; solo si las '+sr+' series te salieron completas.' : '')
        : 'Te sobraron 3 o m&aacute;s repeticiones (RIR '+rir+'): el peso te queda liviano.')+nota+pie,
      set:{weight:sw, series:sr, reps:M.min}};
  }
  if(rir !== null && rir <= 0){
    var nr1 = Math.min(M.max, r + 1);
    return {que:'Quedate en '+fKg(w)+' kg y apunt&aacute; a '+sr+'x'+nr1+'.',
      por:ult+'Llegaste al fallo sin completar el tope ('+M.max+'). Segu&iacute; con este peso hasta llegar a '+M.max+' reps; reci&eacute;n ah&iacute; sub&iacute;s.'+nota+pie,
      set:{weight:w, series:sr, reps:nr1}};
  }
  var nr = Math.min(M.max, r + (mk === 'definir' ? 2 : 1));

/* ==================================================================
   RECORDATORIOS (v16)
   Desde Progreso se marca con la campana: un musculo que viene flojo o un
   ejercicio estancado. En la proxima sesion aparece arriba de los ejercicios con
   una accion concreta, y se borra solo cuando se cumple.
   {t:'musc', m}  -> cumplido al llegar a SERIES_MIN series en la semana
   {t:'peso', id, w} -> cumplido cuando se guarda ese ejercicio con mas de w kg
   ================================================================== */
function recordatorios(){ return pref('recordar', []); }
function ocultos(){ return pref('ocultos', []); }
function recKey(r){ return r.t === 'musc' ? 'm:'+r.m : 'p:'+r.id; }
function tieneRec(key){ return recordatorios().some(function(r){ return recKey(r) === key; }); }
function toggleRecordar(t, x, w){
  var key = (t === 'musc' ? 'm:' : 'p:') + x;
  var l = copia(recordatorios()), i = -1;
  l.forEach(function(r, k){ if(recKey(r) === key) i = k; });
  if(i >= 0){ l.splice(i, 1); toast('Recordatorio quitado'); }
  else {
    l.push(t === 'musc' ? {t:'musc', m:x} : {t:'peso', id:x, w:w});
    toast('Te lo recuerdo en la pr&oacute;xima sesi&oacute;n','ok');
  }
  setPref('recordar', l);
  buildProg(); buildTrain();
}
function quitarRec(key){
  setPref('recordar', recordatorios().filter(function(r){ return recKey(r) !== key; }));
  buildTrain(); buildProg();
}
function recCumplido(r){
  if(r.t === 'musc'){ var st = muscleStats()[r.m]; return !st || st.sem >= SERIES_MIN; }
  var hs = historialEx(r.id), u = hs[hs.length-1];
  return !!(u && nf(u.weight) > nf(r.w));
}
/* al llegar datos nuevos: los cumplidos se van solos */
function limpiarRecordatorios(){
  var l = recordatorios();
  var q = l.filter(function(r){ return !recCumplido(r); });
  if(q.length !== l.length) setPref('recordar', q);
}
/* el mejor ejercicio para cubrir un musculo: uno que ya hiciste (el mas reciente),
   y si no hay, el primero del diccionario */
function candidatoMusc(m){
  var ss = (D && D.sessions) ? D.sessions : [];
  for(var i=0;i<ss.length;i++){
    var ids = ss[i].order && ss[i].order.length ? ss[i].order : Object.keys(ss[i].items);
    for(var k=0;k<ids.length;k++){
      var it = ss[i].items[ids[k]];
      if(it && it.done && !draft[ids[k]] && muscOf(ids[k], it) === m) return {id:ids[k], p:it.name};
    }
  }
  var todos = RUTINA_BASE.concat(CATALOGO);
  for(var j=0;j<todos.length;j++) if(todos[j].m === m && !draft[todos[j].id]) return todos[j];
  return null;
}
function estadoRec(r){
  if(recCumplido(r)) return null;
  if(r.t === 'musc'){
    var st = muscleStats()[r.m], lbl = MUSCULOS[r.m].lbl, sem = Math.round(st.sem);
    var hoy = draftOrder.filter(function(id){ return draft[id] && muscOf(id, draft[id]) === r.m; });
    if(hoy.length){
      return {txt:'<b>'+lbl+'</b>: llev&aacute;s '+sem+' de '+SERIES_MIN+' series esta semana. Sumale una serie a '+
                  dispName(hoy[0], draft[hoy[0]].name)+'.',
              btn:'+1 serie', act:'recSerie(\''+hoy[0]+'\')'};
    }
    var c = candidatoMusc(r.m);
    return {txt:'<b>'+lbl+'</b>: llev&aacute;s '+sem+' de '+SERIES_MIN+' series esta semana y hoy no ten&eacute;s ning&uacute;n ejercicio.',
            btn: c ? 'Agregar '+dispName(c.id, c.p) : '', act: c ? 'recAgregar(\''+c.id+'\')' : ''};
  }
  var nom = dispName(r.id, (exDef(r.id)||{}).p), a = subirPeso(r.id, nf(r.w));
  if(draft[r.id]) return {txt:'Sub&iacute; <b>'+nom+'</b> a '+fKg(a)+' kg (ven&iacute;s en '+fKg(r.w)+').',
                          btn:'Poner '+fKg(a)+' kg', act:'recPeso(\''+r.id+'\','+a+')'};
  return {txt:'<b>'+nom+'</b>: sub&iacute; a '+fKg(a)+' kg. Hoy no est&aacute; en tu sesi&oacute;n.',
          btn:'Agregarlo', act:'recAgregar(\''+r.id+'\','+a+')'};
}
function recSerie(id){ if(draft[id]){ draft[id].series = String(nf(draft[id].series) + 1); draftDirty = true; buildTrain(); toast('Serie sumada','ok'); } }
function recPeso(id, a){ if(draft[id]){ draft[id].weight = String(a); draftDirty = true; buildTrain(); toast('Peso actualizado','ok'); } }
/* agrega sin pasar por closeModal (que scrollea a donde estaba el modal) */
function recAgregar(id, w){
  if(draft[id]) return;
  var e = exDef(id) || {p:id, g:'superior', s:3, r:12};
  draft[id] = precargar(id, {name:e.p, group:e.g, series:e.s, reps:e.r});

       'Guardar sesi&oacute;n</button>';
  if(sessionFor(curDate)) h += '<div class="psub" style="margin:10px 0 0;text-align:center">Ya hay una sesi&oacute;n guardada este d&iacute;a &middot; se sobrescribe</div>';
  h += '</div>';

  $('p-train').innerHTML = h;
}

/* Modo organizar (v17): mientras esta prendido se cierra el ejercicio abierto,
   aparecen los agarres y se puede arrastrar. Apagado, no hay ningun agarre en
   pantalla, asi que el scroll nunca mueve un ejercicio por accidente. */
function toggleOrdenar(){
  ordenando = !ordenando;
  if(ordenando){ openEx = null; openPaso = null; openRec = null; }
  buildTrain();
}

/* Un ejercicio abierto a la vez. Arrancan todos cerrados: con 11 ejercicios abiertos
   la lista mide varias pantallas y hay que scrollear mucho para encontrar el que toca. */
function toggleOpen(id){
  if(ordenando) return;
  openEx = (openEx===id) ? null : id;
  openPaso = null; openRec = null;
  /* el descanso NO se corta al cambiar de ejercicio: sigue en segundo plano */
  buildTrain();
  if(openEx){
    setTimeout(function(){
      var el = $('ex-'+openEx);
      if(el) el.scrollIntoView({block:'nearest'});
    }, 30);
  }
}
function setRir(id,v){
  if(!draft[id]) return;
  draft[id].rir = (draft[id].rir===v) ? '' : v;   /* volver a tocar lo saca */
  draftDirty = true;
  buildTrain();
}
/* descanso sugerido del ejercicio, con lo que Diego haya elegido para el si lo cambio */
function restDe(id){
  var e = exDef(id);
  var base = (e && e.d) ? e.d : 90;
  try{
    var v = parseInt(localStorage.getItem('gym_rest_'+id)||'', 10);
    if(v>0) return v;
  }catch(err){}
  return base;
}

/* ---- timer de descanso ----
   Cuenta contra un timestamp, no sumando ticks: en iOS el setInterval se frena cuando
   la pantalla se bloquea y el descanso quedaria corriendo mal.

   El timer vive en `restTimer` y NO depende del DOM: el render lo consulta con restHTML().
   Antes toggleOpen() lo mataba, asi que tocar cualquier otro ejercicio cancelaba el
   descanso sin aviso; y cada buildTrain() recreaba el nodo mostrando el texto inicial. */
var restTimer = null, audioCtx = null;
/* restTimer = {id, hasta, restante, total, tick}   restante != null => esta pausado */

function iniciarDescanso(id, seg){
  pararDescanso();
  try{
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC && !audioCtx) audioCtx = new AC();   /* crear en el gesto: iOS no deja despues */
  }catch(e){}
  restTimer = { id:id, hasta: Date.now() + seg*1000, restante:null, total:seg };
  restTimer.tick = setInterval(pintarDescanso, 250);
  buildTrain();
}
function pausarDescanso(){
  if(!restTimer || restTimer.restante !== null) return;
  restTimer.restante = restFalta();
  if(restTimer.tick) clearInterval(restTimer.tick);
  restTimer.tick = null;
  buildTrain();
}
function reanudarDescanso(){
  if(!restTimer || restTimer.restante === null) return;
  restTimer.hasta = Date.now() + restTimer.restante*1000;
  restTimer.restante = null;
  restTimer.tick = setInterval(pintarDescanso, 250);
  buildTrain();
}
function reiniciarDescanso(){
  if(!restTimer) return;
  iniciarDescanso(restTimer.id, restTimer.total || restDe(restTimer.id));
}
function pararDescanso(){
  if(restTimer && restTimer.tick) clearInterval(restTimer.tick);
  restTimer = null;
}
function cerrarDescanso(){ pararDescanso(); buildTrain(); }

/* segundos que faltan, este corriendo o pausado */
function restFalta(){
  if(!restTimer) return 0;
  if(restTimer.restante !== null) return restTimer.restante;
  return Math.max(0, Math.round((restTimer.hasta - Date.now())/1000));
}

function pintarDescanso(){
  if(!restTimer) return;
  var falta = restFalta();
  /* si el ejercicio esta cerrado el nodo no existe, pero el timer sigue corriendo igual */
  var el = $('rest-t-'+restTimer.id);
  if(el) el.textContent = fDur(falta);
  var res = $('res-t-'+restTimer.id);
  if(res) res.textContent = fDur(falta);
  if(falta > 0) return;
  pararDescanso();
  beep();
  buildTrain();
  toast('Descanso terminado &middot; a la siguiente serie','ok');
}
/* El bloque de descanso se arma segun el estado del timer: sin timer es el boton para
   arrancarlo; con timer son los controles de pausa, reinicio y cancelar. */
function restHTML(id){
  var activo = (restTimer && restTimer.id === id);
  if(!activo){
    var seg = restDe(id);
    return '<div class="restbox">'+
      '<button class="restbtn" onclick="iniciarDescanso(\''+id+'\','+seg+')">'+
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>'+
      '<span>Descansar '+fDur(seg)+'</span></button></div>';
  }
  var pausado = restTimer.restante !== null;
  var h = '<div class="restbox"><div class="restrun'+(pausado?' pausa':'')+'">';
  h += '<button class="rest-ic" onclick="'+(pausado?'reanudarDescanso()':'pausarDescanso()')+'">';
  h += pausado
     ? '<svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>'
     : '<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>';
  h += '</button>';
  h += '<span class="rest-t" id="rest-t-'+id+'">'+fDur(restFalta())+'</span>';
  h += '<button class="rest-ic ln" onclick="reiniciarDescanso()">'+
       '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg></button>';
  h += '<button class="rest-ic ln" onclick="cerrarDescanso()">'+
       '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>';
  h += '</div></div>';
  return h;
}

function beep(){
  try{
    if(!audioCtx) return;
    if(audioCtx.state==='suspended') audioCtx.resume();
    [0, 0.22].forEach(function(t){
      var o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      o.type='sine'; o.frequency.value=880;
      var t0=audioCtx.currentTime+t;
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(0.25,t0+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.18);
      o.start(t0); o.stop(t0+0.2);
    });
  }catch(e){}
}

function pickDate(v){ if(!v) return; curDate=v; draftDirty=false; openEx=null; pararDescanso(); loadDraft(); buildTrain(); }
function toggleEx(id){ if(draft[id]){ draft[id].done=!draft[id].done; draftDirty=true; buildTrain(); } }
function setF(id,f,v){ if(draft[id]){ draft[id][f]=String(v||'').trim(); draftDirty=true; } }
function applySug(id,v){ if(draft[id]){ draft[id].weight=String(v); draftDirty=true; buildTrain(); } }
function removeEx(id){
  var i=draftOrder.indexOf(id);
  if(i>=0) draftOrder.splice(i,1);
  delete draft[id];
  draftDirty=true;
  buildTrain();
}
function yt(q){ window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q+' tecnica ejercicio'),'_blank'); }

function sessionFor(date){
  if(!D || !D.sessions) return null;
  for(var i=0;i<D.sessions.length;i++) if(D.sessions[i].date===date) return D.sessions[i];
  return null;
}

/* arma el borrador: la sesion guardada de esa fecha; si no hay, la rutina de arranque
   (o la base) con el peso, las series y las reps de la ultima vez */
function loadDraft(){
  draft={}; draftOrder=[]; notesDraft=''; ordenCambiado=false;
  var s = sessionFor(curDate);
  if(s){
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it=s.items[id]; if(!it) return;
      draft[id]={name:it.name, group:it.group||'superior', weight:it.weight||'',
                 series:it.series||'', reps:it.reps||'', rir:it.rir||'', done:it.done===true};
      draftOrder.push(id);
    });
    notesDraft = s.notes||'';
  } else {
    /* si hay una rutina propia marcada de arranque, se usa esa en vez de RUTINA_BASE */
    var rd = rutinaDefault();
    var lista = (rd && rd.ex && rd.ex.length)
      ? rd.ex.map(function(e){
          var def = exDef(e.id);
          return {id:e.id, name:e.n||(def?def.p:e.id), group:e.g||(def?def.g:'superior'),
                  series:e.s||(def?def.s:3), reps:e.r||(def?def.r:12)};
        })
      : RUTINA_BASE.map(function(e){
          return {id:e.id, name:e.p, group:e.g, series:e.s, reps:e.r};
        });
    lista.forEach(function(e){
      draft[e.id] = precargar(e.id, e);
      draftOrder.push(e.id);
    });
  }
}

/* ---- Agregar ejercicio (v15) ----
   Con el diccionario son ~160 ejercicios: se filtran por musculo (pills) y se buscan por
   nombre, alias, musculo o equipo. Buscar "polea triceps" exige las dos palabras. */
var addMusc = '';   // '' = sugeridos

function catItemHTML(e, m){
  var det = [e.mm || MUSCULOS[m].lbl];
  if(e.eq) det.push(e.eq);
  return '<button class="catitem" onclick="addFromCat(\''+e.id+'\')">'+
         '<span class="hdot '+e.g+'"></span>'+
         '<span class="cn">'+dispName(e.id, e.p)+'<span class="cdet">'+det.join(' &middot; ')+'</span></span>'+
         '<span class="cs">'+e.s+'x'+e.r+'</span></button>';
}

function renderAdd(q){
  var known = allKnown();
  var words = palabras(q);
  var prio = {};
  muscleGaps().forEach(function(gp, i){ prio[gp.m] = i; });

  var list = [];
  for(var id in known){
    if(draftOrder.indexOf(id)!==-1) continue;          // ya esta en la sesion
    var e = known[id];
    var em = e.m || muscOf(id, {name:e.p, group:e.g});
    if(addMusc && em !== addMusc) continue;
    if(words.length && !coincide(e, words)) continue;
    list.push({e:e, m:em});
  }
  /* sin filtro: musculo mas descuidado primero. Filtrando por musculo: alfabetico */
  list.sort(function(a,b){
    if(!addMusc){
      var pa = prio[a.m] === undefined ? 99 : prio[a.m];
      var pb = prio[b.m] === undefined ? 99 : prio[b.m];
      if(pa !== pb) return pa - pb;
    }
    var na = slug(nombrePlano(a.e.id, a.e.p), true), nb = slug(nombrePlano(b.e.id, b.e.p), true);
    return na < nb ? -1 : (na > nb ? 1 : 0);
  });

  var h='';
  h += '<div class="mttl"><h3>Agregar ejercicio</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';

  /* --- sugerencias para compensar lo que viene flojo --- */
  if(!words.length && !addMusc){
    var ocl = ocultos();
    var gaps = muscleGaps().filter(function(x){ return ocl.indexOf(x.m) === -1 && (x.falta > 0 || x.dias === null || x.dias >= 7); });
    var sug = [];
    gaps.forEach(function(gp){
      if(sug.length >= 3) return;
      var yaHay = false;
      draftOrder.forEach(function(id){ if(muscOf(id, draft[id]) === gp.m) yaHay = true; });
      if(yaHay) return;
      for(var id in known){
        if(sug.length >= 3) break;
        if(draftOrder.indexOf(id) !== -1) continue;
        var e = known[id];
        if(e.m !== gp.m) continue;
        sug.push({e:e, gap:gp});
        break;
      }
    });

    if(sug.length){
      h += '<div class="sugbox">';
      h += '<div class="kick" style="color:var(--green-2);margin-bottom:9px">Te falta trabajar esto</div>';
      sug.forEach(function(x){
        var motivo = (x.gap.dias === null) ? 'nunca lo hiciste'
                   : (x.gap.dias >= 7 ? 'hace ' + x.gap.dias + ' d&iacute;as'
                                      : x.gap.sem + '/' + SERIES_MIN + ' series esta semana');
        h += '<button class="catitem sug-item" onclick="addFromCat(\''+x.e.id+'\')">'+
             '<span class="hdot '+x.e.g+'"></span>'+
             '<span class="cn">'+dispName(x.e.id, x.e.p)+'<br><span class="cs" style="color:var(--green-2)">'+
             MUSCULOS[x.gap.m].lbl+' &middot; '+motivo+'</span></span>'+
             '<span class="cs">'+x.e.s+'x'+x.e.r+'</span></button>';
      });
      h += '</div>';
    }
  }

  h += '<input type="text" id="add-q" placeholder="Buscar: polea, tr&iacute;ceps, mancuernas..." value="'+esc(q)+'" oninput="renderAdd(this.value)" style="margin-bottom:10px">';

  h += '<div class="muscbar">';
  h += '<button class="mpill'+(addMusc===''?' on':'')+'" onclick="setAddMusc(\'\')">Sugeridos</button>';
  MORDER.forEach(function(m){
    h += '<button class="mpill'+(addMusc===m?' on':'')+'" onclick="setAddMusc(\''+m+'\')">'+MUSCULOS[m].lbl+'</button>';
  });
  h += '</div>';

  var tope = (words.length || addMusc) ? 400 : 40;
  h += '<div class="catlist">';
  if(!list.length){
    h += '<div class="empty" style="padding:18px">Sin resultados. Cargalo a mano abajo.</div>';
  } else {
    list.slice(0, tope).forEach(function(x){ h += catItemHTML(x.e, x.m); });
  }
  h += '</div>';
  if(list.length > tope){
    h += '<div class="hint" style="margin:2px 0 4px;font-size:.76rem">Mostrando '+tope+' de '+list.length+
         '. Eleg&iacute; un m&uacute;sculo o busc&aacute; para ver el resto.</div>';
  }

  h += '<div class="mdiv"><span>o cargalo a mano</span></div>';
  /* los valores salen de newEx, no del DOM: renderAdd corre en cada tecla del buscador
     y antes eso borraba lo que el usuario ya habia cargado a mano */
  h += '<div style="margin-bottom:12px"><div class="fl kick" style="margin-bottom:5px">Nombre del ejercicio o m&aacute;quina</div>'+
       '<input type="text" id="add-name" placeholder="Ej: Prensa 45 Nautilus" value="'+esc(newEx.name)+'" '+
       'oninput="newEx.name=this.value;pintarCoincidencias()"><div id="add-match"></div></div>';
  h += '<div class="fl kick" style="margin-bottom:6px">Tren</div><div class="grow">';
  GORDER.forEach(function(g){
    h += '<button class="gbtn tren-btn'+(newGroup===g?' on':'')+'" data-g="'+g+'" onclick="setNewGroup(\''+g+'\')">'+GRUPOS[g].lbl+'</button>';
  });
  h += '</div>';
  h += '<div class="f3">'+
       '<div><div class="fl">Kg</div><input type="number" step="0.5" min="0" inputmode="decimal" id="add-w" placeholder="&mdash;" value="'+esc(newEx.w)+'" oninput="newEx.w=this.value"></div>'+
       '<div><div class="fl">Series</div><input type="number" step="1" min="0" inputmode="numeric" id="add-s" value="'+esc(newEx.s)+'" oninput="newEx.s=this.value"></div>'+
       '<div><div class="fl">Reps</div><input type="number" step="1" min="0" inputmode="numeric" id="add-r" value="'+esc(newEx.r)+'" oninput="newEx.r=this.value"></div>'+
       '</div>';
  h += '<button class="btn btn-p btn-full" onclick="addCustom()">Agregar a la sesi&oacute;n</button>';

  $('modal-box').innerHTML = h;
  pintarCoincidencias();
  var qi=$('add-q');
  if(qi && q){ qi.focus(); qi.setSelectionRange(qi.value.length,qi.value.length); }
}

function setAddMusc(m){
  addMusc = m;
  var qi = $('add-q');
  renderAdd(qi ? qi.value : '');
  var cl = document.querySelector('#modal-box .catlist');

/* Mientras se escribe un nombre a mano: si ya esta en el diccionario lo ofrece (asi entra
   con musculo, series y descanso), y si no, avisa como lo va a contar la app.
   Solo toca #add-match: re-renderizar el formulario bajaria el teclado. */
function musculoNuevo(nombre){
  var dn = dicPorNombre(nombre);
  if(dn) return {m:dn.m, como:'diccionario'};
  var pn = muscPorNombre(nombre);
  if(pn) return {m:pn, como:'nombre'};
  return {m: newGroup==='medio' ? 'core' : (newGroup==='inferior' ? 'piernas' : 'espalda'), como:'tren'};
}
function pintarCoincidencias(){
  var box = $('add-match');
  if(!box) return;
  var nombre = (newEx.name||'').trim();
  var words = palabras(nombre, 3);
  if(!words.length){ box.innerHTML = ''; return; }
  var known = allKnown(), hits = [];
  for(var id in known){
    if(hits.length >= 3) break;
    if(draftOrder.indexOf(id) !== -1) continue;
    if(coincide(known[id], words)) hits.push(known[id]);
  }
  var h = '';
  if(hits.length){
    h += '<div class="matchbox"><div class="kick" style="margin-bottom:5px;color:var(--violet-2)">&iquest;Es alguno de estos?</div>';
    hits.forEach(function(e){ h += catItemHTML(e, e.m || muscOf(e.id, {name:e.p, group:e.g})); });
    h += '</div>';
  }
  var mn = musculoNuevo(nombre);
  h += '<div class="hint" style="margin-top:7px;font-size:.78rem">Si lo carg&aacute;s a mano, cuenta como <b>'+
       MUSCULOS[mn.m].lbl+'</b>'+(mn.como==='tren' ? ' (por el tren elegido: cambialo abajo si no es)' : '')+'.</div>';
  box.innerHTML = h;
}

/* solo cambia clases: re-renderizar aca borraba el nombre y los kg ya cargados */
function setNewGroup(g){

  var bs=document.querySelectorAll('#modal-box .tren-btn');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.g===g);

function addFromCat(id){

function addCustom(){
  var name = (newEx.name||'').trim();
  if(!name){ toast('Escrib&iacute; el nombre del ejercicio','err'); return; }
  var id = 'x-'+slug(name);
  if(!id || id==='x-'){ toast('Nombre inv&aacute;lido','err'); return; }

  if(nf(newEx.w) < 0){ toast('El peso no puede ser negativo','err'); return; }
  draft[id] = {

  };

}

/* ---------------- GUARDAR ---------------- */
function saveSession(){
  var items={}, order=[];
  var any=false;
  draftOrder.forEach(function(id){
    var st=draft[id]; if(!st) return;
    items[id]={name:st.name, group:st.group, weight:st.weight||'',
               series:st.series||'', reps:st.reps||'', rir:st.rir||'', done:st.done===true};
    order.push(id);
    if(st.done) any=true;
  });
  if(!any){ toast('No marcaste ning&uacute;n ejercicio como hecho','err'); return; }

  var negativos = order.filter(function(id){ return nf(items[id].weight) < 0; });
  if(negativos.length){ toast('Hay pesos negativos: revis&aacute; los kg','err'); return; }

  apiPost('saveSession', {date:curDate, items:items, order:order, notes:notesDraft}, $('btn-save'))
    .then(function(){
      draftDirty = false;
      toast('Sesi&oacute;n guardada &middot; '+fShort(curDate),'ok');
      fetchData(true);
    })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}

/* ==================================================================
   CARDIO
   Espeja la pantalla de detalle de la app Fitness. Se carga a mano:
   HealthKit no expone los entrenamientos a Atajos (verificado 31/08/2026).
   ================================================================== */
var CARDIO_TIPOS = ['Correr','Andar','Bici','Otro'];

function cardioList(){ return (D && D.cardio) ? D.cardio : []; }

/* duracion en segundos -> "11:10" o "1:05:30" */
function fDur(seg){
  var s = Math.round(nf(seg));
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), q = s%60;
  var mm = (h && m<10 ? '0' : '')+m;
  return (h ? h+':' : '') + mm + ':' + (q<10?'0':'') + q;
}
/* ritmo en segundos por km -> "7'50&quot;" */
function fRitmo(segKm){
  var s = Math.round(nf(segKm));
  if(!s) return '';
  return Math.floor(s/60)+'&#39;'+((s%60)<10?'0':'')+(s%60)+'&quot;';
}
function ritmoDe(seg, km){
  var k = nf(km);
  return k>0 ? Math.round(nf(seg)/k) : 0;
}
function cardioStats(list){
  var o = {km:0, seg:0, kcal:0, n:list.length};
  list.forEach(function(c){
    o.km += nf(c.km); o.seg += nf(c.dur); o.kcal += nf(c.kcalTot) || nf(c.kcalAct);
  });
  return o;
}

/* ---- modal de carga ---- */
function openCardio(id){
  var ex = null;
  if(id){ cardioList().forEach(function(c){ if(c.id===id) ex=c; }); }
  if(ex){
    cardioDraft = JSON.parse(JSON.stringify(ex));
    if(!cardioDraft.parciales) cardioDraft.parciales = [];
  } else {
    /* la hora arranca con la actual: es lo que distingue dos corridas del mismo dia,
       y si queda vacia la segunda pisa a la primera */
    var ah = new Date();
    cardioDraft = {
      id:'', date:todayISO(), time:pad(ah.getHours())+':'+pad(ah.getMinutes()), type:'Correr',
      dur:'', km:'', kcalAct:'', kcalTot:'', cadencia:'', desnivel:'', ritmo:'',
      parciales:[], notes:''
    };
  }
  renderCardio();
  openModal();
}

function renderCardio(){
  var c = cardioDraft;
  var mm = Math.floor(nf(c.dur)/60), ss = Math.round(nf(c.dur)%60);
  var ritmoCalc = ritmoDe(c.dur, c.km);

  var h = '';
  h += '<div class="mttl"><h3>'+(c.id?'Editar corrida':'Registrar corrida')+'</h3>'+
       '<button class="mx" onclick="closeModal()">&#10005;</button></div>';
  h += '<div class="hint" style="margin-bottom:14px">Copi&aacute; los n&uacute;meros de la pantalla de detalle de la app Fitness.</div>';

  /* tipo */
  h += '<div class="fl kick" style="margin-bottom:6px">Tipo</div><div class="grow" style="grid-template-columns:repeat(4,1fr)">';
  CARDIO_TIPOS.forEach(function(t){
    h += '<button class="gbtn tipo-btn'+(c.type===t?' on':'')+'" data-t="'+t+'" onclick="setTipo(\''+t+'\')">'+t+'</button>';
  });
  h += '</div>';

  /* fecha y hora */
  h += '<div class="f3" style="grid-template-columns:1fr 1fr">'+
       '<div><div class="fl">Fecha</div><input type="date" id="c-date" value="'+esc(c.date)+'" onchange="setCardio(\'date\',this.value)"></div>'+
       '<div><div class="fl">Hora de inicio</div><input type="time" id="c-time" value="'+esc(c.time)+'" onchange="setCardio(\'time\',this.value)"></div>'+
       '</div>';

  /* duracion y distancia */
  h += '<div class="f3">'+
       '<div><div class="fl">Min</div><input type="number" min="0" inputmode="numeric" id="c-min" value="'+(mm||'')+'" oninput="setDur()"></div>'+
       '<div><div class="fl">Seg</div><input type="number" min="0" max="59" inputmode="numeric" id="c-seg" value="'+(ss||'')+'" oninput="setDur()"></div>'+
       '<div><div class="fl">Distancia km</div><input type="number" step="0.01" inputmode="decimal" id="c-km" value="'+esc(c.km)+'" oninput="setCardio(\'km\',this.value)"></div>'+
       '</div>';

  /* calorias y cadencia */
  h += '<div class="f3">'+
       '<div><div class="fl">Kcal activas</div><input type="number" inputmode="numeric" id="c-ka" value="'+esc(c.kcalAct)+'" oninput="setCardio(\'kcalAct\',this.value)"></div>'+
       '<div><div class="fl">Kcal totales</div><input type="number" inputmode="numeric" id="c-kt" value="'+esc(c.kcalTot)+'" oninput="setCardio(\'kcalTot\',this.value)"></div>'+
       '<div><div class="fl">Cadencia PPM</div><input type="number" inputmode="numeric" id="c-cad" value="'+esc(c.cadencia)+'" oninput="setCardio(\'cadencia\',this.value)"></div>'+
       '</div>';

  h += '<div style="margin-bottom:14px"><div class="fl kick" style="margin-bottom:5px">Desnivel (m) &mdash; opcional</div>'+
       '<input type="number" inputmode="numeric" id="c-desn" value="'+esc(c.desnivel||'')+'" placeholder="&mdash;" oninput="setCardio(\'desnivel\',this.value)"></div>';

  /* ritmo calculado */
  h += '<div class="card" style="background:var(--surface2);padding:11px 13px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center">'+
       '<span class="kick">Ritmo medio</span>'+
       '<span class="num" id="c-ritmo" style="font-weight:700;font-size:1.05rem;color:var(--cyan)">'+
       (ritmoCalc ? fRitmo(ritmoCalc)+' /km' : '&mdash;')+'</span></div>';

  /* parciales */
  h += '<div class="mdiv"><span>parciales (opcional)</span></div>';
  if(!c.parciales) c.parciales = [];
  if(c.parciales.length){
    h += '<div class="tw" style="margin-bottom:9px"><table><thead><tr>'+
         '<th>Km</th><th>Tiempo</th><th>Ritmo</th><th>PPM</th><th></th></tr></thead><tbody>';
    c.parciales.forEach(function(p,i){
      h += '<tr>'+
           '<td>'+(i+1)+'</td>'+
           '<td>'+fDur(p.seg)+'</td>'+
           '<td>'+(fRitmo(p.seg)||'&mdash;')+'</td>'+
           '<td>'+(p.cadencia||'&mdash;')+'</td>'+
           '<td class="r"><button class="mx" style="padding:0 4px" onclick="delParcial('+i+')">&#10005;</button></td>'+
           '</tr>';
    });
    h += '</tbody></table></div>';
  }
  h += '<div class="f3">'+
       '<div><div class="fl">Min</div><input type="number" min="0" inputmode="numeric" id="p-min" placeholder="9"></div>'+
       '<div><div class="fl">Seg</div><input type="number" min="0" max="59" inputmode="numeric" id="p-seg" placeholder="10"></div>'+
       '<div><div class="fl">PPM</div><input type="number" inputmode="numeric" id="p-cad" placeholder="132"></div>'+
       '</div>';

       '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Agregar parcial</button>';

  /* notas */
  h += '<div style="margin-bottom:14px"><div class="fl kick" style="margin-bottom:5px">Notas</div>'+
       '<input type="text" id="c-notes" value="'+esc(c.notes)+'" placeholder="Cinta, calle, sensaciones..." oninput="setCardio(\'notes\',this.value)"></div>';

  h += '<button class="btn btn-p btn-full" id="btn-cardio" onclick="saveCardio()">Guardar corrida</button>';
  if(c.id){
    h += '<button class="btn btn-o btn-full" style="margin-top:9px;color:var(--red);border-color:rgba(255,77,94,.4)" '+
         'onclick="delCardio(\''+jsq(c.id)+'\')">Borrar esta corrida</button>';
  }

  $('modal-box').innerHTML = h;
}

/* NUNCA re-renderizar el modal desde un oninput: destruye el <input>, baja el teclado
   virtual y, con type=number, borra lo tipeado a medio escribir ("1." vale "" para el
   navegador, asi que 1.25 terminaba guardandose como 25). Solo se refresca el ritmo. */
function setCardio(k,v){
  cardioDraft[k] = String(v||'').trim();
  if(k==='km' || k==='dur') pintarRitmo();
}
function setDur(){
  var m = nf($('c-min').value), s = nf($('c-seg').value);
  cardioDraft.dur = String(m*60 + s);
  pintarRitmo();
}
/* actualiza solo el nodo del ritmo, sin tocar el resto del formulario */
function pintarRitmo(){
  var el = $('c-ritmo');
  if(!el) return;
  var r = ritmoDe(cardioDraft.dur, cardioDraft.km);
  el.innerHTML = r ? fRitmo(r)+' /km' : '&mdash;';
}
/* el tipo cambia clases, no re-renderiza */
function setTipo(t){
  cardioDraft.type = t;
  var bs = document.querySelectorAll('#modal-box .tipo-btn');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on', bs[i].dataset.t===t);
}
function addParcial(){
  var m = nf($('p-min').value), s = nf($('p-seg').value), cad = $('p-cad').value;
  if(!m && !s){ toast('Carg&aacute; el tiempo del parcial','err'); return; }
  cardioDraft.parciales.push({seg: m*60+s, cadencia: String(cad||'').trim()});
  renderCardio();   /* aca si: cambia la tabla de parciales */
}
function delParcial(i){ cardioDraft.parciales.splice(i,1); renderCardio(); }

function saveCardio(){
  var c = cardioDraft;
  if(!c.date){ toast('Falta la fecha','err'); return; }
  if(!nf(c.dur) && !nf(c.km)){ toast('Carg&aacute; al menos duraci&oacute;n o distancia','err'); return; }
  c.ritmo = String(ritmoDe(c.dur, c.km));
  if(!c.id) c.id = c.date + 'T' + (c.time || '00:00');
  apiPost('saveCardio', c, $('btn-cardio'))
    .then(function(){ closeModal(); toast('Corrida guardada','ok'); fetchData(true); })
    .catch(function(e){ toast('No pude guardar: '+e.message,'err'); });
}
/* pide confirmacion: el boton es rojo, ancho completo y esta pegado abajo de "Guardar" */
function delCardio(id){
  var c = null;
  cardioList().forEach(function(x){ if(x.id===id) c=x; });
  var q = c ? (c.type+' del '+fShort(c.date)+(c.time?' '+c.time:'')) : 'esta corrida';
  if(!window.confirm('Borrar ' + q + '?\n\nNo se puede deshacer.')) return;
  apiPost('deleteCardio', {id:id})
    .then(function(){ closeModal(); toast('Corrida borrada','ok'); fetchData(true); })
    .catch(function(e){ toast('No pude borrar: '+e.message,'err'); });
}

function setHistView(v){ histView=v; buildHist(); }

/* Mezcla sesiones de gym y corridas en una sola linea de tiempo, mas nuevo primero.
   Cada entrada lleva una clave unica: 'g:<fecha>' para gym, 'c:<id>' para cardio. */
function timeline(ss){
  var out = [];
  ss.forEach(function(s){ out.push({k:'g:'+s.date, kind:'gym', date:s.date, time:'23:59', s:s}); });
  cardioList().forEach(function(c){ out.push({k:'c:'+c.id, kind:'cardio', date:c.date, time:c.time||'00:00', c:c}); });
  out.sort(function(a,b){
    var ka=a.date+'T'+a.time, kb=b.date+'T'+b.time;
    return ka<kb ? 1 : (ka>kb ? -1 : 0);
  });
  return out;
}

function listHTML(ss){
  var items = timeline(ss);
  if(!items.length) return '<div class="empty">Todav&iacute;a no hay nada guardado.</div>';
  var h='';
  items.forEach(function(e){
    h += (e.kind==='gym') ? gymCardHTML(e) : cardioCardHTML(e);
  });
  return h;
}

function gymCardHTML(e){
  var s = e.s;
  var ids = s.order && s.order.length ? s.order : Object.keys(s.items);
  var hechos = ids.filter(function(id){ return s.items[id] && s.items[id].done; });
  var st = statsOf([s]);
  var d = parseISO(s.date);
  var open = openSession===e.k;

  var h = '<div class="hcard'+(open?' open':'')+'">';
  h +=   '<button class="hhead" onclick="toggleSession(\''+e.k+'\')">';
  h +=     '<div class="hbadge"><div class="d">'+d.getDate()+'</div><div class="m">'+MESES[d.getMonth()]+'</div></div>';
  h +=     '<div class="hb"><div class="hd">'+fDate(s.date)+'</div>'+
           '<div class="hm">Gym &middot; '+hechos.length+' ejercicios &middot; '+fInt(st.vol)+' kg</div></div>';
  h +=     '<svg class="hchev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  h +=   '</button>';

  if(open){
    h += '<div class="hdet">';
    if(s.notes) h += '<div class="hnote">&ldquo;'+esc(s.notes)+'&rdquo;</div>';
    ids.forEach(function(id){
      var it=s.items[id]; if(!it || !it.done) return;
      var det = [];
      if(it.weight) det.push(fKg(it.weight)+' kg');
      if(it.series && it.reps) det.push(esc(it.series)+'x'+esc(it.reps));
      h += '<div class="hex">'+
           '<span class="hdot '+(it.group||'superior')+'"></span>'+
           '<span class="hex-n">'+dispName(id, it.name)+'</span>'+
           '<span class="hex-v">'+(det.length?det.join(' &middot; '):'&mdash;')+'</span></div>';
    });
    var noHechos = ids.filter(function(id){ return s.items[id] && !s.items[id].done; });
    if(noHechos.length){
      h += '<div class="hm" style="margin-top:10px">No hechos: '+
           noHechos.map(function(id){ return dispName(id, s.items[id].name); }).join(', ')+'</div>';
    }
    h += '<div style="display:flex;gap:8px;margin-top:14px">'+

function toggleSession(k){ openSession = (openSession===k)?null:k; buildHist(); }
function editSession(date){ curDate=date; loadDraft(); buildTrain(); switchTab('train'); }

function calendarHTML(ss){
  /* arranca en el mes de la ultima actividad, no en el mes actual:
     si hoy es 1 del mes, abrir en un calendario vacio no sirve de nada */
  if(!calRef){
    var ult = null;
    if(ss.length) ult = ss[0].date;
    var cl = cardioList();
    if(cl.length && (!ult || cl[0].date > ult)) ult = cl[0].date;
    calRef = ult ? parseISO(ult) : new Date();
  }
  var y=calRef.getFullYear(), m=calRef.getMonth();

  /* cada dia puede tener gym, cardio o los dos */
  var hits={};
  ss.forEach(function(s){ (hits[s.date]=hits[s.date]||{}).gym = true; });
  cardioList().forEach(function(c){ (hits[c.date]=hits[c.date]||{}).cardio = true; });

  var start=monday(new Date(y,m,1));
  var today=todayISO();

  var h='';
  h += '<div class="card">';
  h += '<div class="calhead">'+
       '<button class="ibtn" onclick="calMove(-1)"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>'+
       '<div class="mname">'+MESESL[m]+' '+y+'</div>'+
       '<button class="ibtn" onclick="calMove(1)"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>'+
       '</div>';
  h += '<div class="calgrid">';
  DOW.forEach(function(d){ h += '<div class="caldow">'+d+'</div>'; });

  var cur=new Date(start);
  var nGym=0, nCar=0;
  for(var i=0;i<42;i++){
    var iso=isoOf(cur);
    var out = cur.getMonth()!==m;
    var hit = hits[iso];
    if(!out && hit){ if(hit.gym) nGym++; if(hit.cardio) nCar++; }
    var cls='calday'+(out?' out':'')+(hit?' hit':'')+(iso===today?' today':'');
    if(hit && !hit.gym && hit.cardio) cls += ' onlycardio';
    var bubs='';
    if(hit){
      bubs = '<span class="bubs">'+
             (hit.gym?'<span class="bub"></span>':'')+
             (hit.cardio?'<span class="bub cardio"></span>':'')+'</span>';
    }
    h += '<button class="'+cls+'"'+(hit?' onclick="jumpTo(\''+iso+'\')"':'')+'>'+
         cur.getDate()+bubs+'</button>';
    cur.setDate(cur.getDate()+1);
    if(i>=34 && cur.getMonth()!==m) break;
  }
  h += '</div>';
  h += '<div class="callegend" style="gap:16px;flex-wrap:wrap">'+
       '<span style="display:flex;align-items:center;gap:6px"><span class="bub"></span>'+
       '<span class="kick">'+nGym+' gym</span></span>'+
       '<span style="display:flex;align-items:center;gap:6px"><span class="bub cardio"></span>'+
       '<span class="kick">'+nCar+' cardio</span></span></div>';
  h += '</div>';
  return h;
}
function calMove(n){
  if(!calRef) calRef=new Date();
  calRef = new Date(calRef.getFullYear(), calRef.getMonth()+n, 1);
  buildHist();
}
/* abre lo primero que haya ese dia: el gym si existe, si no la corrida */
function jumpTo(iso){
  histView='lista';
  var k = null;
  (D && D.sessions ? D.sessions : []).forEach(function(s){ if(s.date===iso && !k) k='g:'+s.date; });
  if(!k) cardioList().forEach(function(c){ if(c.date===iso && !k) k='c:'+c.id; });
  openSession = k;
  buildHist();
  /* scrollear a la tarjeta, no al tope: para un dia viejo quedaba 1000px abajo del fold
     y parecia que el toque no habia hecho nada */
  setTimeout(function(){
    var abierta = document.querySelector('#p-hist .hcard.open');
    if(abierta) abierta.scrollIntoView({block:'center'});
    else window.scrollTo(0,0);
  }, 30);
}

/* ---------------- PROGRESO ---------------- */
/* ==================================================================
   PROGRESO (v12) - reescrito entero
   La pantalla vieja estaba organizada por METRICA: dos filas de toggles y nueve
   maneras de mirar un total. Un total no responde ninguna de las dos preguntas
   con las que Diego entra aca ("estoy mejorando", "que me falta"), y ademas
   obligaba a interpretar. Esta esta organizada por PREGUNTA.

   La decision de modelo que lo destraba todo: el progreso se mide POR EJERCICIO
   contra si mismo, no sumando todo. Con peso, el record son los kg; sin peso
   (abdominales, captain's chair), las reps por serie. Asi el peso corporal entra
   al mismo sistema que el resto y desaparecen de una: el toggle de metrica y el
   cartel que pedia disculpas porque el volumen en kg no lo veia.
   ================================================================== */

/* ---- semanas: la unidad de tiempo de toda la pantalla ----
   Ni la sesion (ruidosa: tiene 4 o 10 ejercicios segun el dia) ni el mes
   (demasiado lento con 5 semanas de historia). Ademas la meta y la referencia
   de 10-20 series ya son semanales. */
function semanas(){
  var map = {}, keys = [];
  function slot(k){
    if(!map[k]){ map[k] = {key:k, fechas:{}, ses:0, series:0, vol:0, reps:0, km:0, corridas:0}; keys.push(k); }
    return map[k];
  }
  ((D && D.sessions) ? D.sessions : []).forEach(function(s){
    var o = slot(weekKey(s.date));
    if(!o.fechas[s.date]){ o.fechas[s.date] = true; o.ses++; }
    var st = statsOf([s]);
    o.series += st.series; o.vol += st.vol; o.reps += st.reps;
  });
  cardioList().forEach(function(c){
    var o = slot(weekKey(c.date));
    o.km += nf(c.km); o.corridas++;
  });
  keys.sort();
  return keys.map(function(k){ return map[k]; });
}

/* semanas anteriores consecutivas que llegaron a la meta (no cuenta la actual) */
function racha(){
  var meta = metaSemanal(), byWeek = {};
  ((D && D.sessions) ? D.sessions : []).forEach(function(s){
    var k = weekKey(s.date); (byWeek[k] = byWeek[k] || {})[s.date] = true;
  });
  var n = 0, cur = monday(new Date());
  for(var i=0;i<200;i++){
    cur.setDate(cur.getDate()-7);
    var c = byWeek[isoOf(cur)] ? Object.keys(byWeek[isoOf(cur)]).length : 0;
    if(c >= meta) n++; else break;
  }
  return n;
}

/* ==================================================================
   RECORDS
   ================================================================== */
/* Valor con el que progresa un ejercicio.
   Con peso -> los kg.
   Sin peso (captain's chair, abdominales) -> las repeticiones TOTALES, series x reps.
   Hasta v12 eran reps por serie, con el argumento de que sumar una serie es volumen
   y no fuerza. En un ejercicio sin carga eso no se sostiene: no hay peso que subir,
   y pasar de 3x15 a 4x15 es justamente como se progresa. Diego lo hizo el 13/09 y
   la app le decia que no habia progreso. */
function valorDe(it){
  var sr = nf(it.series)+'x'+nf(it.reps);
  var w = nf(it.weight);
  if(w > 0) return {v:w, peso:true, sr:sr, txt:fKg(w)+' kg'};
  var tot = nf(it.series) * nf(it.reps);
  return tot > 0 ? {v:tot, peso:false, sr:sr, txt:sr} : null;
}

/* La mejor marca de un ejercicio en las sesiones ANTERIORES a una fecha. null si nunca. */
function recordDe(exId, antesDe, modoPeso){
  var best = null;
  ((D && D.sessions) ? D.sessions : []).forEach(function(s){
    if(antesDe && s.date >= antesDe) return;
    var it = s.items[exId];
    if(!it || !it.done) return;
    var v = valorDe(it);
    if(!v || v.peso !== modoPeso) return;
    if(best === null || v.v > best.v) best = v;
  });
  return best;
}

/* Records rotos en una sesion. El debut no cuenta: la primera vez que hacer un
   ejercicio no es romper un record, es estrenarlo. */
function prsDe(s){
  if(!s) return [];
  var out = [];
  (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
    var it = s.items[id];
    if(!it || !it.done) return;
    var v = valorDe(it);
    if(!v) return;
    var prev = recordDe(id, s.date, v.peso);
    if(prev === null || v.v <= prev.v) return;
    out.push({id:id, name:it.name, de:prev.v, a:v.v, deTxt:prev.txt, aTxt:v.txt, peso:v.peso});
  });
  out.sort(function(a,b){ return (b.a/b.de) - (a.a/a.de); });
  return out;
}

/* la sesion mas reciente que rompio algun record, y cuantas quedaron despues */
function ultimoPR(){
  var ss = (D && D.sessions) ? D.sessions : [];
  for(var i=0;i<ss.length;i++){
    var p = prsDe(ss[i]);
    if(p.length) return {date:ss[i].date, prs:p, desde:i};
  }
  return null;
}

/* ==================================================================
   PROGRESION POR EJERCICIO
   ================================================================== */
function progresionEx(){
  var asc = ((D && D.sessions) ? D.sessions : []).slice()
              .sort(function(a,b){ return a.date<b.date?-1:1; });
  var map = {}, orden = [];
  asc.forEach(function(s){
    (s.order && s.order.length ? s.order : Object.keys(s.items)).forEach(function(id){
      var it = s.items[id];
      if(!it || !it.done) return;
      var v = valorDe(it);
      if(!v) return;
      if(!map[id]){ map[id] = {id:id, name:it.name, peso:v.peso, vals:[], srPri:v.sr, sr:''}; orden.push(id); }
      var e = map[id];
      if(v.peso !== e.peso) return;   /* no mezclo kg con reps */
      e.vals.push(v.v);
      e.uf = s.date;
      e.sr = v.sr;
      e.ses = e.vals.length;
    });
  });
  var out = orden.map(function(id){ return map[id]; });
  out.forEach(function(e){
    e.pri = e.vals[0];
    e.ult = e.vals[e.vals.length-1];
    e.pct = e.pri > 0 ? Math.round((e.ult - e.pri)/e.pri*100) : 0;
  });
  /* los de kg primero, y dentro de cada grupo del que mas mejoro al que menos:
     la lista ordenada es en si misma un ranking de donde hay que empujar */
  out.sort(function(a,b){
    if(a.peso !== b.peso) return a.peso ? -1 : 1;
    return b.pct - a.pct;
  });
  return out;
}

/* ==================================================================
   SVG: anillo y sparkline. Sin dependencias, ~30 lineas cada uno.
   ================================================================== */
function anillo(hechas, meta){
  var r = 30, c = 38, C = 2*Math.PI*r;
  var pct = meta > 0 ? Math.min(1, hechas/meta) : 0;
  var lleno = pct >= 1, gr = lleno ? 9 : 8;
  var col = lleno ? 'var(--green)' : 'var(--violet)';
  return '<svg class="ring" viewBox="0 0 76 76" aria-hidden="true">'+
    '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="'+gr+'"/>'+
    '<circle class="ring-f" cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+col+'" '+
      'stroke-width="'+gr+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" '+
      'stroke-dashoffset="'+((1-pct)*C).toFixed(1)+'" transform="rotate(-90 '+c+' '+c+')"/>'+
    '<text class="ring-t" x="'+c+'" y="'+c+'" text-anchor="middle" dy=".34em" fill="var(--text)">'+
      hechas+'/'+meta+'</text></svg>';
}

/* Muestra la forma, no la escala: cada uno se normaliza a su propio min/max. */
function sparkline(vals, col){
  var w = 72, hh = 24, p = 3;
  if(!vals || !vals.length) return '<svg class="spark" viewBox="0 0 '+w+' '+hh+'"></svg>';
  if(vals.length === 1){
    return '<svg class="spark" viewBox="0 0 '+w+' '+hh+'">'+
           '<circle cx="'+(w-p-1)+'" cy="'+(hh/2)+'" r="2.5" fill="'+col+'"/></svg>';
  }
  var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  var rango = mx - mn;
  var pts = vals.map(function(v,i){
    var x = p + (i/(vals.length-1))*(w-p*2);
    var y = rango > 0 ? (hh-p) - ((v-mn)/rango)*(hh-p*2) : hh/2;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var last = pts[pts.length-1].split(',');
  return '<svg class="spark" viewBox="0 0 '+w+' '+hh+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.8" '+
      'stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+col+'"/></svg>';
}

   RENDER
   ================================================================== */
function buildProg(){
  var ss = (D && D.sessions) ? D.sessions : [];
  var h = '';
  h += '<div class="ptitle">Progreso</div>';

  if(!ss.length){
    $('p-prog').innerHTML = h + '<div class="empty">Todav&iacute;a no hay sesiones para analizar.</div>';
    return;
  }

  h += heroHTML();
  h += recordsHTML();
  h += progresionHTML();
  h += semanasHTML();
  h += balanceHTML();
  h += estancadosHTML();
  h += cardioProgHTML();

  $('p-prog').innerHTML = h;
  if(activeTab==='prog') drawProgCharts();
}

/* ---- 1. la semana en curso: lo primero, sin scrollear ni tocar nada ---- */
function heroHTML(){
  var meta = metaSemanal();
  var all = semanas();
  var wkNow = weekKey(todayISO());
  var cur = null;
  all.forEach(function(w){ if(w.key === wkNow) cur = w; });

  /* Si la semana en curso todavia esta en cero, muestro la pasada. Un anillo
     vacio arriba de todo se lee como reproche, y el lunes no es el momento. */
  var m = cur, rot = 'Esta semana', nueva = false;
  if(!m || m.ses === 0){
    var prev = null;
    all.forEach(function(w){ if(w.key < wkNow && (!prev || w.key > prev.key)) prev = w; });
    if(prev){ m = prev; rot = 'La semana pasada'; nueva = true; }
  }
  if(!m) m = {key:wkNow, ses:0, series:0, vol:0, km:0};

  var hecho = m.ses >= meta;

  /* la linea que hace el trabajo emocional */
  var otras = all.filter(function(w){ return w.key !== m.key; });
  var ante = null;
  otras.forEach(function(w){ if(w.key < m.key && (!ante || w.key > ante.key)) ante = w; });
  var mejor = all.length > 1 && m.series > 0 &&
              otras.every(function(w){ return m.series >= w.series; });

  var linea = '', lcol = 'var(--muted)';
  if(mejor){
    linea = 'Tu mejor semana hasta ahora'; lcol = 'var(--green-2)';
  } else if(ante && ante.series > 0 && m.series > 0){
    var d = Math.round((m.series - ante.series)/ante.series*100);
    if(d >= 10){ linea = '+'+d+'% de trabajo vs la semana anterior'; lcol = 'var(--green-2)'; }
    else if(d <= -15){ linea = 'M&aacute;s tranquila que la anterior'; }
    else { linea = 'Parecida a la semana anterior'; }
  }

  var det = [];
  if(m.ses)    det.push(m.ses + (m.ses===1?' sesi&oacute;n':' sesiones'));
  if(m.series) det.push(Math.round(m.series) + ' series');
  if(m.km)     det.push(fKm(m.km) + ' km');
  if(m.vol)    det.push(fInt(m.vol) + ' kg movidos');

  var h = '<div class="card hero">';
  h += '<div class="hero-top">' + anillo(m.ses, meta) + '<div class="hero-b">';
  h += '<div class="kick">'+rot+'</div>';
  h += '<div class="hero-h">'+(hecho ? 'Semana cumplida'
        : (m.ses===0 ? 'Todav&iacute;a sin entrenar'
        : 'Falta'+((meta-m.ses)===1?' 1':'n '+(meta-m.ses))))+'</div>';
  if(det.length) h += '<div class="hero-m">'+det.join(' &middot; ')+'</div>';
  h += '</div></div>';

  if(linea) h += '<div class="hero-l" style="color:'+lcol+'">'+linea+'</div>';
  if(nueva) h += '<div class="hero-l" style="color:var(--dim);font-weight:600">'+
                 'Semana nueva &mdash; 0 de '+meta+'</div>';

  var r = racha();
  h += '<div class="hero-f">';
  h += '<div class="hint">'+(r ? '<b style="color:var(--green-2)">'+r+
       (r===1?' semana</b> seguida cumpliendo':' semanas</b> seguidas cumpliendo')
       : 'Objetivo semanal')+'</div>';
  h += '<div class="stepper sm">'+
       '<button class="stbtn" onclick="setMeta('+(meta-1)+')"'+(meta<=1?' disabled':'')+'>&minus;</button>'+
       '<span class="stval num">'+meta+'</span>'+
       '<button class="stbtn" onclick="setMeta('+(meta+1)+')"'+(meta>=7?' disabled':'')+'>+</button>'+
       '</div></div>';
  h += '</div>';
  return h;
}

/* ---- 2. records: el recibo del esfuerzo ---- */
function recordsHTML(){
  var ss = (D && D.sessions) ? D.sessions : [];
  var ult = ss[0];
  var prs = prsDe(ult);
  var h = '';

  if(prs.length){
    var prev = ss[1] ? prsDe(ss[1]).length : 0;
    h += secHd('R&eacute;cords','green', 'sesi&oacute;n del '+fShort(ult.date));
    h += '<div class="card">';
    prs.forEach(function(p){
      h += '<div class="hex">'+
           '<span class="pr-up">&#9650;</span>'+
           '<span class="hex-n">'+dispName(p.id, p.name)+'</span>'+
           '<span class="hex-v" style="color:var(--green-2)">'+
             p.deTxt+' &rarr; '+p.aTxt+'</span></div>';
    });
    h += '<div class="hint" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--hairline)">'+
         '<b>'+prs.length+(prs.length===1?' r&eacute;cord':' r&eacute;cords')+'</b> el '+fShort(ult.date)+
         (prev ? ' &middot; '+(prs.length+prev)+' en las &uacute;ltimas dos sesiones' : '')+'.</div>';
    h += '</div>';
    return h;
  }

  /* Sin records en la ultima sesion: en vez de un vacio, el ultimo conseguido.
     Y si ya van 3 sesiones sin ninguno, engancho con los estancados de abajo. */
  var u = ultimoPR();
  h += secHd('R&eacute;cords','green','');
  h += '<div class="card">';
  if(u){
    var p0 = u.prs[0];
    h += '<div class="hex"><span class="pr-up">&#9650;</span>'+
         '<span class="hex-n">'+dispName(p0.id, p0.name)+'<br>'+
         '<span class="hm">&uacute;ltimo r&eacute;cord &middot; '+fShort(u.date)+'</span></span>'+
         '<span class="hex-v" style="color:var(--green-2)">'+p0.aTxt+'</span></div>';
    if(u.desde >= 3){
      h += '<div class="hint" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--hairline)">'+
           'Hace <b>'+u.desde+' sesiones</b> que no rompes un r&eacute;cord. '+
           'Mir&aacute; los estancados m&aacute;s abajo: ah&iacute; est&aacute; el peso que te toca.</div>';
    }
  } else {
    h += '<div class="hint">Todav&iacute;a no hay r&eacute;cords. En cuanto sub&iacute;s un peso o '+
         'sum&aacute;s repeticiones sobre tu mejor marca, aparecen ac&aacute;.</div>';
  }
  h += '</div>';
  return h;
}

/* ---- 3. progresion por ejercicio: reemplaza la tabla que scrolleaba de costado ---- */
/* Arriba lo que haces ahora (hecho en las ultimas 4 semanas o en tu rutina de
   arranque); lo viejo va en "Ya no los haces", cerrado. Cada fila abre el detalle. */
var progViejos = false;
function progRowHTML(e){
  var sube = e.pct > 0;
  var col = sube ? 'var(--green)' : 'var(--dim)';
  var h = '<button class="prow" onclick="openDetalle(\''+e.id+'\')">';
  h += '<span class="prow-n">'+dispName(e.id, e.name)+'</span>';
  h += sparkline(e.vals, sube ? (e.peso ? 'var(--green)' : 'var(--cyan)') : 'var(--dim)');
  h += '<span class="prow-v">';
  if(e.peso){
    h += fKg(e.pri)+' &rarr; '+fKg(e.ult)+' kg';
    h += '<br><span class="prow-p" style="color:'+col+'">'+(sube?'+':'')+e.pct+'%</span>';
  } else if(e.ses > 1){
    h += e.srPri+' &rarr; '+e.sr;
    h += '<br><span class="prow-p" style="color:'+(sube?'var(--cyan)':'var(--dim)')+'">'+(sube?'+':'')+e.pct+'%</span>';
  } else {
    h += e.sr+'<br><span class="prow-p" style="color:var(--muted)">1 vez</span>';
  }
  h += '</span><svg class="prow-c" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>';
  return h;
}
function progresionHTML(){
  var lista = progresionEx();
  if(!lista.length) return '';
  var lim = isoOf(new Date(parseISO(todayISO()).getTime() - 28*86400000));
  var enRut = {}, rd = rutinaDefault();
  if(rd) (rd.ex||[]).forEach(function(x){ enRut[x.id] = 1; });
  var act = [], vie = [];
  lista.forEach(function(e){ (e.uf >= lim || enRut[e.id] ? act : vie).push(e); });

  var h = secHd('Progresi&oacute;n','violet', act.length+' ejercicios');
  h += '<div class="card">';
  h += '<div class="hint" style="margin-bottom:6px">Toc&aacute; uno para ver su evoluci&oacute;n.</div>';
  act.forEach(function(e){ h += progRowHTML(e); });
  if(!act.length) h += '<div class="hint">No hiciste ejercicios en las &uacute;ltimas 4 semanas.</div>';
  if(vie.length){
    h += '<button class="viejos" onclick="progViejos=!progViejos;buildProg()">Ya no los hac&eacute;s ('+vie.length+') '+
         (progViejos ? '&#9650;' : '&#9660;')+'</button>';
    if(progViejos) vie.forEach(function(e){ h += progRowHTML(e); });
  }
  h += '</div>';
  return h;
}

/* ---- detalle de un ejercicio: modal con dos graficos y la tabla de sesiones ---- */
var detId = null;
function openDetalle(id){
  detId = id;
  renderDetalle();
  openModal();
  setTimeout(drawDetalle, 40);
}
function detDatos(id){
  var hs = historialEx(id);
  var peso = hs.some(function(x){ return nf(x.weight) > 0; });
  var filas = hs.filter(function(x){ return peso ? nf(x.weight) > 0 : nf(x.series)*nf(x.reps) > 0; });
  var max = -1;
  filas.forEach(function(x){
    x.v = peso ? nf(x.weight) : nf(x.series)*nf(x.reps);
    x.vol = peso ? nf(x.weight)*nf(x.series)*nf(x.reps) : nf(x.series)*nf(x.reps);
    x.pr = max >= 0 && x.v > max;
    if(x.v > max) max = x.v;
  });
  return {peso:peso, filas:filas, max:max};
}
function renderDetalle(){
  var id = detId, def = exDef(id) || {};
  var dd = detDatos(id), f = dd.filas;
  var h = '<div class="mttl"><h3>'+dispName(id, def.p)+'</h3><button class="mx" onclick="closeModal()">&#10005;</button></div>';
  h += '<div class="hm" style="margin:-10px 0 12px">'+muscEsp(id, {name:def.p})+(def.eq ? ' &middot; '+def.eq : '')+'</div>';
  if(!f.length){ $('modal-box').innerHTML = h + '<div class="empty">Sin registros todav&iacute;a.</div>'; return; }
  var pri = f[0], ult = f[f.length-1];
  var fmt = function(x){ return dd.peso ? fKg(x.weight)+' kg' : x.series+'x'+x.reps; };
  var pct = pri.v > 0 ? Math.round((ult.v - pri.v)/pri.v*100) : 0;
  h += '<div class="dkpis">'+
       '<div class="dk"><span class="kick">Primera vez</span><b>'+fmt(pri)+'</b><span class="hm">'+fShort(pri.date)+'</span></div>'+
       '<div class="dk"><span class="kick">&Uacute;ltima</span><b>'+fmt(ult)+'</b><span class="hm">'+fShort(ult.date)+'</span></div>'+
       '<div class="dk"><span class="kick">Mejor marca</span><b>'+(dd.peso ? fKg(dd.max)+' kg' : dd.max+' reps')+'</b><span class="hm">'+f.length+' sesiones</span></div>'+
       '<div class="dk"><span class="kick">Cambio</span><b style="color:'+(pct>0?'var(--green-2)':'var(--muted)')+'">'+(pct>0?'+':'')+pct+'%</b><span class="hm">desde la primera</span></div>'+
       '</div>';
  h += '<div class="kick" style="margin:6px 0 6px">'+(dd.peso ? 'Peso por sesi&oacute;n' : 'Repeticiones totales por sesi&oacute;n')+
       ' &middot; <span style="color:var(--green-2)">verde = r&eacute;cord</span></div>';
  h += '<div class="chartbox" style="height:170px"><canvas id="cv-det1"></canvas></div>';
  h += '<div class="kick" style="margin:14px 0 6px">'+(dd.peso ? 'Trabajo por sesi&oacute;n (kg &times; series &times; reps)' : 'Series &times; reps')+'</div>';
  h += '<div class="chartbox" style="height:130px"><canvas id="cv-det2"></canvas></div>';
  var rc = recomendar(id);
  if(rc) h += '<div class="recbox" style="margin:14px 0 0"><div class="kick" style="color:var(--violet-2)">Pr&oacute;xima vez &middot; '+
              MODOS[modoDe(id)].lbl+'</div><div class="rec-que">'+rc.que+'</div><div class="rec-por">'+rc.por+'</div></div>';
  h += '<div class="kick" style="margin:16px 0 6px">Sesiones</div><div class="dtab">';
  f.slice().reverse().forEach(function(x){
    h += '<div class="dtr"><span>'+fShort(x.date)+'</span><span>'+(nf(x.weight) ? fKg(x.weight)+' kg' : '&mdash;')+'</span>'+
         '<span>'+x.series+'x'+x.reps+'</span><span>'+(x.rir !== '' && x.rir !== undefined ? 'RIR '+esc(x.rir) : '')+'</span>'+
         '<span class="dpr">'+(x.pr ? '&#9650;' : '')+'</span></div>';
  });
  h += '</div>';
  $('modal-box').innerHTML = h;
}
function drawDetalle(){
  if(!window.Chart) return;
  var dd = detDatos(detId), f = dd.filas;
  var c1 = $('cv-det1'), c2 = $('cv-det2');
  if(!c1 || !f.length) return;
  ['det1','det2'].forEach(function(k){ if(charts[k]){ charts[k].destroy(); charts[k] = null; } });
  var labels = f.map(function(x){ var d = parseISO(x.date); return d.getDate()+'/'+(d.getMonth()+1); });
  var P = PAL();
  charts.det1 = new Chart(c1.getContext('2d'), {
    type:'line',
    data:{labels:labels, datasets:[{
      data: f.map(function(x){ return x.v; }),
      borderColor:P.ac, backgroundColor:'rgba('+P.acRGB+',.12)', fill:true, tension:.25, borderWidth:2.5,
      pointRadius: f.map(function(x){ return x.pr ? 5 : 3; }),
      pointBackgroundColor: f.map(function(x){ return x.pr ? P.ok : P.ac; }),
      pointBorderColor:'transparent'}]},
    options:{responsive:true, maintainAspectRatio:false,

/* ---- 4. trabajo por semana o por mes ----
   Cada barra de semana lleva la fecha del LUNES: el 18/09 esta dentro de "14 sep".
   Diego lo leyo como que faltaba el dia de hoy, asi que la actual dice "Esta sem." */
var trabajoBy = 'sem';
try{ trabajoBy = localStorage.getItem('gym_trabajo') || 'sem'; }catch(e){}
function setTrabajoBy(v){ trabajoBy = v; try{ localStorage.setItem('gym_trabajo', v); }catch(e){} buildProg(); }
function bucketsTrabajo(){
  var hoy = todayISO();
  if(trabajoBy === 'mes'){
    var map = {}, keys = [];
    ((D && D.sessions) ? D.sessions : []).forEach(function(s){
      var k = monthKey(s.date);
      if(!map[k]){ map[k] = {key:k, fechas:{}, ses:0, series:0}; keys.push(k); }
      if(!map[k].fechas[s.date]){ map[k].fechas[s.date] = 1; map[k].ses++; }
      map[k].series += statsOf([s]).series;
    });
    keys.sort();
    return keys.slice(-6).map(function(k){
      var o = map[k], p = k.split('-'), act = (k === monthKey(hoy));
      o.actual = act;
      o.lbl = act ? 'Este mes' : MESES[(+p[1])-1]+(p[0] !== hoy.slice(0,4) ? ' '+p[0].slice(2) : '');
      o.tit = MESESL[(+p[1])-1]+' '+p[0];
      return o;
    });
  }
  var wk = weekKey(hoy);
  return semanas().filter(function(w){ return w.ses > 0; }).slice(-8).map(function(w){
    w.actual = (w.key === wk);
    w.lbl = w.actual ? 'Esta sem.' : fShort(w.key);
    w.tit = 'Semana del '+fShort(w.key);
    return w;
  });
}
